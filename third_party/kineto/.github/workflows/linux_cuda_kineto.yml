name: Linux CUDA Kineto build and test

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}-${{ github.event_name == 'workflow_dispatch' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pr-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - cuda_version: "12.6"
            pm_sampling: "OFF"
          # TODO: Update to CUDA 13.2 once we can install a driver
          # that satisfies the CUDA 13.2 container requirement.
          - cuda_version: "13.0"
            pm_sampling: "ON"
    uses: pytorch/test-infra/.github/workflows/linux_job_v2.yml@main
    with:
      job-name: linux-cuda-${{ matrix.cuda_version }}-kineto-build-and-test
      # AWS A10G GPU instance
      runner: linux.g5.4xlarge.nvidia.gpu
      timeout: 180
      # Checkout the Kineto repo at the PR ref with submodules
      repository: ${{ github.repository }}
      ref: ${{ github.ref }}
      submodules: recursive
      gpu-arch-type: cuda
      gpu-arch-version: ${{ matrix.cuda_version }}
      # kineto_build_test.sh takes in KINETO_ENABLE_CUPTI_PM_SAMPLING=ON/OFF as an env var to control PM sampling compilation
      script: |
        set -eux
        .github/scripts/setup.sh
        KINETO_ENABLE_CUPTI_PM_SAMPLING="${{ matrix.pm_sampling }}" \
          .github/scripts/kineto_build_test.sh cuda
