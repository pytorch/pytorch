name: Download TD Artifacts

description: Download artifacts from target_determination.yml

inputs:
  use-gha:
    description: If set to any value, use GHA to download the artifact. Otherwise use s3.
    required: false

runs:
  using: composite
  steps:
    - name: Download TD Artifacts from S3
      if: inputs.use-gha == '' || inputs.use-gha == 'false'
      uses: seemethere/download-artifact-s3@1da556a7aa0a088e3153970611f6c432d58e80e6 # v4.2.0
      with:
        name: td_results

    - name: Download TD Artifacts from GHA
      if: inputs.use-gha != '' && inputs.use-gha != 'false'
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: td_results.json

    - name: Find the LLM test selection
      id: llm-td
      # Written by llm-td.yml for internal PRs; without it the tests run as today.
      # Any workflow run can upload an artifact with this name, so only accept one
      # from llm-td.yml's pull_request_target run for this head in this repo.
      if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name != 'pull_request'
      continue-on-error: true
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        python3 - >> "$GITHUB_OUTPUT" <<'EOF'
        import json, os, re, urllib.request

        def get(path):
            url = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/{path}"
            req = urllib.request.Request(url, headers={"Authorization": f"Bearer {os.environ['GH_TOKEN']}"})
            with urllib.request.urlopen(req, timeout=30) as r:
                return json.load(r)

        sha = os.environ["HEAD_SHA"]
        # ciflow/<label>/<PR number> tag pushes carry the PR in the ref.
        tag = re.fullmatch(r"refs/tags/ciflow/.+/(\d+)", os.environ["GITHUB_REF"])
        pr = os.environ["PR_NUMBER"] or (tag and tag.group(1))
        name = f"llm_td_selection_{pr}_{sha}"
        for a in (get(f"actions/artifacts?per_page=10&name={name}")["artifacts"] if pr else []):
            run = get(f"actions/runs/{a['workflow_run']['id']}")
            if (
                run["path"] == ".github/workflows/llm-td.yml"
                and run["event"] == "pull_request_target"
                and run["head_sha"] == sha
                and run["head_repository"]["id"] == run["repository"]["id"]
            ):
                print(f"run-id={run['id']}\nname={name}")
                break
        EOF

    - name: Download the LLM test selection
      if: steps.llm-td.outputs.run-id != ''
      continue-on-error: true
      uses: actions/download-artifact@65a9edc5881444af0b9093a5e628f2fe47ea3b2e # v4.1.7
      with:
        name: ${{ steps.llm-td.outputs.name }}
        run-id: ${{ steps.llm-td.outputs.run-id }}
        github-token: ${{ github.token }}

    - name: Move artifacts to .additional_ci_files folder
      shell: bash
      run: |
        mkdir -p .additional_ci_files
        mv td_results.json .additional_ci_files/td_results.json || true
        mv llm_td_selection.json .additional_ci_files/llm_td_selection.json || true
