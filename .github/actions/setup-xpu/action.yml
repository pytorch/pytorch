name: Setup XPU host

description: Set up XPU host for CI

runs:
  using: composite
  steps:
    - name: Clean all stopped docker containers
      if: always()
      shell: bash
      run: |
        # Prune all stopped containers.
        # If other runner is pruning on this node, will skip.
        nprune=$(ps -ef | grep -c "docker container prune")
        if [[ $nprune -eq 1 ]]; then
          docker container prune -f
        fi

    - name: Runner health check system info
      if: always()
      shell: bash
      run: |
        cat /etc/os-release || true
        cat /etc/apt/sources.list.d/oneAPI.list || true
        cat /etc/apt/sources.list.d/intel-gpu-jammy.list || true
        whoami

    - name: Runner health check xpu-smi
      if: always()
      shell: bash
      run: |
        timeout 30 xpu-smi discovery || true

    - name: Runner health check GPU
      if: always()
      shell: bash
      run: |
        if ! discovery=$(timeout 30 xpu-smi discovery -j); then
          echo "Error: Failed to discover GPUs on the runner"
          exit 1
        fi

        device_ids=$(jq -r '.. | objects | .device_id? // empty' <<< "$discovery" | sort -nu)

        if [[ ${#device_ids[@]} -eq 0 ]]; then
          echo "Error: Failed to detect any GPUs on the runner"
          exit 1
        fi

        for device_id in "${device_ids[@]}"; do
          if ! info=$(timeout 30 xpu-smi discovery -d "$device_id" -j); then
            echo "Error: Failed to query GPU $device_id"
            exit 1
          fi

          device_name=$(jq -r '.device_name // empty' <<< "$info")
          device_state=$(jq -r '.device_state // empty' <<< "$info")
          gfx_firmware_status=$(jq -r '.gfx_firmware_status // empty' <<< "$info")

          if [[ -z "$device_name" ]]; then
            echo "Error: Failed to detect GPU $device_id"
            exit 1
          fi

          # Newer xpu-smi versions expose device_state, while older/LTS
          # versions may only expose gfx_firmware_status.
          if [[ -n "$device_state" ]]; then
            if [[ "$device_state" != "normal" ]]; then
              echo "Error: GPU $device_id is not in normal state: $device_state"
              exit 1
            fi
          elif [[ -n "$gfx_firmware_status" ]]; then
            if [[ "$gfx_firmware_status" != "normal" ]]; then
              echo "Error: GPU $device_id GFX firmware is not in normal state: $gfx_firmware_status"
              exit 1
            fi
          else
            echo "Error: Unable to determine health state of GPU $device_id"
            exit 1
          fi

          echo "GPU $device_id is healthy: $device_name"
        done

    - name: Runner health check GPU count
      if: always()
      shell: bash
      run: |
        ngpu=$(timeout 30 xpu-smi discovery | grep -c -E 'Device Name' || true)
        msg="Please file an issue on pytorch/pytorch reporting the faulty runner. Include a link to the runner logs so the runner can be identified"
        if [[ $ngpu -eq 0 ]]; then
          echo "Error: Failed to detect any GPUs on the runner"
          echo "$msg"
          exit 1
        fi

    - name: Runner diskspace health check
      uses: pytorch/pytorch/.github/actions/diskspace-cleanup@main
      if: always()

    - name: Runner health check disconnect on failure
      if: ${{ failure() }}
      shell: bash
      run: |
        killall runsvc.sh

    - name: Setup useful environment variables
      shell: bash
      run: |
        RUNNER_ARTIFACT_DIR="${RUNNER_TEMP}/artifacts"
        sudo rm -rf "${RUNNER_ARTIFACT_DIR}"
        mkdir -p "${RUNNER_ARTIFACT_DIR}"
        echo "RUNNER_ARTIFACT_DIR=${RUNNER_ARTIFACT_DIR}" >> "${GITHUB_ENV}"

        RUNNER_TEST_RESULTS_DIR="${RUNNER_TEMP}/test-results"
        sudo rm -rf "${RUNNER_TEST_RESULTS_DIR}"
        mkdir -p "${RUNNER_TEST_RESULTS_DIR}"
        echo "RUNNER_TEST_RESULTS_DIR=${RUNNER_TEST_RESULTS_DIR}" >> "${GITHUB_ENV}"

        RUNNER_DOCS_DIR="${RUNNER_TEMP}/docs"
        sudo rm -rf "${RUNNER_DOCS_DIR}"
        mkdir -p "${RUNNER_DOCS_DIR}"
        echo "RUNNER_DOCS_DIR=${RUNNER_DOCS_DIR}" >> "${GITHUB_ENV}"

    - name: Preserve github env variables for use in docker
      shell: bash
      run: |
        env | grep '^GITHUB' >> "${RUNNER_TEMP}/github_env_${GITHUB_RUN_ID}"
        env | grep '^CI' >> "${RUNNER_TEMP}/github_env_${GITHUB_RUN_ID}"
        env | grep '^RUNNER' >> "${RUNNER_TEMP}/github_env_${GITHUB_RUN_ID}"

    - name: XPU set GPU_FLAG
      shell: bash
      run: |
        # Add render group for container creation.
        render_gid=`cat /etc/group | grep render | cut -d: -f3`
        echo "GPU_FLAG=--device=/dev/mem --device=/dev/dri --group-add video --group-add $render_gid -e ZE_AFFINITY_MASK" >> "${GITHUB_ENV}"

    - name: Login to ECR
      uses: pytorch/pytorch/.github/actions/ecr-login@main
