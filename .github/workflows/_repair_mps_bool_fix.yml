name: Repair MPS bool fix v2

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Restore host file
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git revert --no-edit 4555f0b5047ccb0091afa8a0fce02fe4c4a90862

      - name: Restore Metal file
        run: git revert --no-edit 3379fe351e3f90b9740a7931ac684fb711807e29

      - name: Apply Metal bool diff
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('aten/src/ATen/native/mps/kernels/LinearAlgebra.metal')
          s = p.read_text()
          replacements = [
              ('if (params.transposed == 0u)', 'if (!params.transposed)'),
              ('(params.transposed == 0u) ? U_b : V_b', 'params.transposed ? V_b : U_b'),
              ('(params.transposed == 0u) ? params.u_ld : params.v_ld', 'params.transposed ? params.v_ld : params.u_ld'),
              ('const bool compute_v = params.compute_v != 0u;', 'const bool compute_v = params.compute_v;'),
              ('const bool upper = params.upper != 0u;', 'const bool upper = params.upper;'),
          ]
          for old, new in replacements:
              assert old in s, old
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          git add aten/src/ATen/native/mps/kernels/LinearAlgebra.metal
          git commit -m 'fix(mps): use bool linear algebra kernel flags'

      - name: Apply host bool diff
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('aten/src/ATen/native/mps/operations/LinearAlgebra.mm')
          s = p.read_text()
          replacements = [
              ('static_cast<uint32_t>(compute_uv ? 1 : 0)', 'compute_uv'),
              ('static_cast<uint32_t>(transposed ? 1 : 0)', 'transposed'),
              ('static_cast<uint32_t>(stage_v ? 1 : 0)', 'stage_v'),
              ('static_cast<uint32_t>(compute_eigenvectors ? 1 : 0)', 'compute_eigenvectors'),
              ('static_cast<uint32_t>(upper ? 1 : 0)', 'upper'),
          ]
          for old, new in replacements:
              assert old in s, old
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          git add aten/src/ATen/native/mps/operations/LinearAlgebra.mm
          git commit -m 'fix(mps): pass linear algebra bool params as bool'
          git push origin main
