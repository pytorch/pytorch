# Owner(s): ["oncall: releng"]
name: Build manywheel docker images

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - release/*
    tags:
      # NOTE: Binary build pipelines should only get triggered on release candidate or nightly builds
      # Release candidate tags look like: v1.11.0-rc1
      - v[0-9]+.[0-9]+.[0-9]+-rc[0-9]+
    paths:
      - .ci/docker/**
      - .github/workflows/build-manywheel-images.yml
      - .github/actions/binary-docker-build/**
  pull_request:
    paths:
      - .ci/docker/**
      - .github/workflows/build-manywheel-images.yml
      - .github/actions/binary-docker-build/**

env:
  DOCKER_BUILDKIT: 1
  WITH_PUSH: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release') || startsWith(github.ref, 'refs/tags/v')) }}
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}-${{ github.event_name == 'workflow_dispatch' }}
  cancel-in-progress: true

jobs:
  build:
    if: github.repository_owner == 'pytorch'
    environment: ${{ (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release') || startsWith(github.ref, 'refs/tags/v')) && 'docker-build') || '' }}
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/actions/actions-runner:latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include: [
          { name: "manylinux2_28-builder",          tag: "cuda13.2",          runner: "mt-${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/nightly' || startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/tags/v')) && 'rel-l-x86iavx512-44-340' || 'l-x86iavx512-48-384' }}", buildkit_addr: "tcp://buildkitd-amd64.buildkit:1234" },
          { name: "manylinux2_28-builder",          tag: "cuda13.0",          runner: "mt-${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/nightly' || startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/tags/v')) && 'rel-l-x86iavx512-44-340' || 'l-x86iavx512-48-384' }}", buildkit_addr: "tcp://buildkitd-amd64.buildkit:1234" },
          { name: "manylinux2_28-builder",          tag: "cuda12.6",          runner: "mt-${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/nightly' || startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/tags/v')) && 'rel-l-x86iavx512-44-340' || 'l-x86iavx512-48-384' }}", buildkit_addr: "tcp://buildkitd-amd64.buildkit:1234" },
          { name: "manylinuxaarch64-builder",       tag: "cuda13.2",          runner: "mt-${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/nightly' || startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/tags/v')) && 'rel-l-arm64g3-44-340' || 'l-arm64g3-61-463' }}",    buildkit_addr: "tcp://buildkitd-arm64.buildkit:1234" },
          { name: "manylinuxaarch64-builder",       tag: "cuda13.0",          runner: "mt-${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/nightly' || startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/tags/v')) && 'rel-l-arm64g3-44-340' || 'l-arm64g3-61-463' }}",    buildkit_addr: "tcp://buildkitd-arm64.buildkit:1234" },
          { name: "manylinuxaarch64-builder",       tag: "cuda12.6",          runner: "mt-${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/nightly' || startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/tags/v')) && 'rel-l-arm64g3-44-340' || 'l-arm64g3-61-463' }}",    buildkit_addr: "tcp://buildkitd-arm64.buildkit:1234" },
          { name: "manylinux2_28-builder",          tag: "rocm7.1",           runner: "mt-${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/nightly' || startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/tags/v')) && 'rel-l-x86iavx512-44-340' || 'l-x86iavx512-48-384' }}", buildkit_addr: "tcp://buildkitd-amd64.buildkit:1234" },
          { name: "manylinux2_28-builder",          tag: "rocm7.2",           runner: "mt-${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/nightly' || startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/tags/v')) && 'rel-l-x86iavx512-44-340' || 'l-x86iavx512-48-384' }}", buildkit_addr: "tcp://buildkitd-amd64.buildkit:1234" },
          { name: "manylinux2_28-builder",          tag: "cpu",               runner: "mt-${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/nightly' || startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/tags/v')) && 'rel-l-x86iavx512-44-340' || 'l-x86iavx512-48-384' }}", buildkit_addr: "tcp://buildkitd-amd64.buildkit:1234" },
          { name: "manylinux2_28_aarch64-builder",  tag: "cpu-aarch64",       runner: "mt-${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/nightly' || startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/tags/v')) && 'rel-l-arm64g3-44-340' || 'l-arm64g3-61-463' }}",    buildkit_addr: "tcp://buildkitd-arm64.buildkit:1234" },
          { name: "manylinux2_28-builder",          tag: "xpu",               runner: "mt-${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/nightly' || startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/tags/v')) && 'rel-l-x86iavx512-44-340' || 'l-x86iavx512-48-384' }}", buildkit_addr: "tcp://buildkitd-amd64.buildkit:1234" },
        ]
    name: ${{ matrix.name }}:${{ matrix.tag }}
    steps:
      - name: Build docker image
        # TODO(huydhn): revert to @main once #188625 (the binary-docker-build
        # remote-BuildKit change this depends on) has landed. `uses: ...@main`
        # resolves the action from the main branch, not this PR's tree, so we
        # temporarily point at the stacked PR's head branch to exercise it here.
        uses: pytorch/pytorch/.github/actions/binary-docker-build@gh/huydhn/65/head
        with:
          docker-image-name: ${{ matrix.name }}
          custom-tag-prefix: ${{ matrix.tag }}
          docker-build-dir: manywheel
          buildkit-addr: ${{ matrix.buildkit_addr }}
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
          DOCKER_ID: ${{ secrets.DOCKER_ID }}
