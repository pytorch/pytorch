# Owner(s): ["module: ci"]
name: pull

on:
  pull_request:
    branches-ignore:
      - nightly
  push:
    branches:
      - main
      - release/*
      - landchecks/*
    tags:
      - ciflow/pull/*
  workflow_dispatch:
    inputs:
      jobs-to-include:
        description: "Space-separated list of job display names to run (empty = all)"
        required: false
        default: ""
        type: string
      tests-to-include:
        description: "Space-separated tests to include (passed to test runner; empty = default)"
        required: false
        default: ""
        type: string
  schedule:
    - cron: 29 8 * * *  # about 1:29am PDT

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}-${{ github.event_name == 'workflow_dispatch' && github.run_id }}-${{ github.event_name == 'schedule' }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read
  actions: read

jobs:
  # See job-filter.yml for rules on adding job filter conditions
  job-filter:
    needs: get-label-type
    if: github.repository_owner == 'pytorch'
    name: job-filter
    uses: ./.github/workflows/job-filter.yml
    with:
      jobs-to-include: ${{ github.event.inputs.jobs-to-include || '' }}

  llm-td:
    if: github.repository_owner == 'pytorch'
    name: before-test
    uses: ./.github/workflows/llm_td_retrieval.yml

  target-determination:
    name: before-test
    uses: ./.github/workflows/target_determination.yml
    needs: llm-td

  get-label-type:
    name: get-label-type
    uses: pytorch/pytorch/.github/workflows/_runner-determinator.yml@main
    if: ${{ (github.event_name != 'schedule' || github.repository == 'pytorch/pytorch') && github.repository_owner == 'pytorch' }}
    with:
      triggering_actor: ${{ github.triggering_actor }}
      issue_owner: ${{ github.event.pull_request.user.login || github.event.issue.user.login }}
      curr_branch: ${{ github.head_ref || github.ref_name }}
      check_experiments: lf

  # ╠══════════════════════════════════════════════════════════════════════╣
  # ║ linux-jammy-py3.11-gcc11 (build + test)                              ║
  # ╠══════════════════════════════════════════════════════════════════════╣

  linux-jammy-py3_11-gcc11-build:
    if: ${{ needs.job-filter.outputs.jobs == '' || contains(needs.job-filter.outputs.jobs, ' linux-jammy-py3.11-gcc11 ') }}
    name: linux-jammy-py3.11-gcc11
    uses: ./.github/workflows/_linux-build.yml
    needs:
      - get-label-type
      - job-filter
    with:
      runner_prefix: "${{ needs.get-label-type.outputs.label-type }}"
      build-environment: linux-jammy-py3.11-gcc11
      docker-image-name: ci-image:pytorch-linux-jammy-py3.11-clang21
      ci-docker-hash: ${{ needs.get-label-type.outputs.ci-docker-hash }}
      test-matrix: |
        { include: [
          { config: "default", shard: 1, num_shards: 10, runner: "${{ needs.get-label-type.outputs.label-type }}linux.4xlarge" },
          { config: "docs_test", shard: 1, num_shards: 1,  runner: "${{ needs.get-label-type.outputs.label-type }}linux.2xlarge" },
          { config: "backwards_compat", shard: 1, num_shards: 1, runner: "${{ needs.get-label-type.outputs.label-type }}linux.c7i.2xlarge" },
          # Use m7i instead of m7a to match the existing (Intel Xeon) numerics. DTensor crossref tests like linalg.multi_dot have tight
          # float32 tolerances sensitive to different FMA/reduction order across CPU vendors.
          { config: "distributed", shard: 1, num_shards: 8, runner: "${{ needs.get-label-type.outputs.label-type }}linux.2xlarge.amx" },
        ]}
      python-version: "3.11"
      compiler: gcc11
    secrets: inherit

  linux-jammy-py3_11-gcc11-test:
    if: ${{ needs.job-filter.outputs.jobs == '' || contains(needs.job-filter.outputs.jobs, ' linux-jammy-py3.11-gcc11 ') }}
    name: linux-jammy-py3.11-gcc11
    uses: ./.github/workflows/_linux-test.yml
    needs:
      - linux-jammy-py3_11-gcc11-build
      - target-determination
      - job-filter
      - get-label-type
    with:
      build-environment: ${{ needs.linux-jammy-py3_11-gcc11-build.outputs.build-environment }}
      docker-image: ${{ needs.linux-jammy-py3_11-gcc11-build.outputs.docker-image }}
      test-matrix: ${{ needs.linux-jammy-py3_11-gcc11-build.outputs.test-matrix }}
      tests-to-include: ${{ github.event.inputs.tests-to-include || '' }}
      tests-to-exclude: "inductor/test_torchinductor_opinfo"
      python-version: "3.11"
      compiler: gcc11
    secrets: inherit

  # ╠══════════════════════════════════════════════════════════════════════╣
  # ║ linux-jammy-aarch64-py3.11-gcc11 (build + test)                      ║
  # ╠══════════════════════════════════════════════════════════════════════╣
  linux-jammy-aarch64-py3_11-gcc13-build:
    name: linux-jammy-aarch64-py3.11
    uses: ./.github/workflows/_linux-build.yml
    needs:
      - get-label-type
      - job-filter
    with:
      runner_prefix: ${{ needs.get-label-type.outputs.label-type }}
      build-environment: linux-jammy-aarch64-py3.11
      docker-image-name: ci-image:pytorch-linux-jammy-aarch64-py3.11-gcc13
      ci-docker-hash: ${{ needs.get-label-type.outputs.ci-docker-hash }}
      runner: linux.arm64.m8g.4xlarge
      test-matrix: |
        { include: [
          { config: "default", shard: 1, num_shards: 7, runner: "${{ needs.get-label-type.outputs.label-type }}linux.arm64.m8g.4xlarge" },
        ]}
      python-version: "3.11"
      compiler: gcc13
    secrets: inherit

  linux-jammy-aarch64-py3_11-gcc13-test:
    name: linux-jammy-aarch64-py3.11
    uses: ./.github/workflows/_linux-test.yml
    needs:
      - linux-jammy-aarch64-py3_11-gcc13-build
      - target-determination
      - job-filter
      - get-label-type
    with:
      build-environment: ${{ needs.linux-jammy-aarch64-py3_11-gcc13-build.outputs.build-environment }}
      docker-image: ${{ needs.linux-jammy-aarch64-py3_11-gcc13-build.outputs.docker-image }}
      test-matrix: ${{ needs.linux-jammy-aarch64-py3_11-gcc13-build.outputs.test-matrix }}
      tests-to-include: ${{ github.event.inputs.tests-to-include || '' }}
      tests-to-exclude: "inductor/test_torchinductor_opinfo"
      python-version: "3.11"
      compiler: gcc13
    secrets: inherit

  # ╠══════════════════════════════════════════════════════════════════════╣
  # ║ linux-jammy-py3.14t-clang21 (build + test)                           ║
  # ╠══════════════════════════════════════════════════════════════════════╣
