# Owner(s): ["module: ci"]
name: pull

on:
  pull_request:
    branches-ignore:
      - nightly
  push:
    branches:
      - main
      - release/*
      - landchecks/*
    tags:
      - ciflow/pull/*
  workflow_dispatch:
  schedule:
    - cron: 29 8 * * *  # about 1:29am PDT

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}-${{ github.event_name == 'workflow_dispatch' && github.run_id }}-${{ github.event_name == 'schedule' }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read
  actions: read

jobs:
  get-label-type:
    name: get-label-type
    uses: pytorch/pytorch/.github/workflows/_runner-determinator.yml@main
    if: ${{ (github.event_name != 'schedule' || github.repository == 'pytorch/pytorch') && github.repository_owner == 'pytorch' }}
    with:
      triggering_actor: ${{ github.triggering_actor }}
      issue_owner: ${{ github.event.pull_request.user.login || github.event.issue.user.login }}
      curr_branch: ${{ github.head_ref || github.ref_name }}
      check_experiments: lf

  linux-jammy-py3_14t-clang21-build:
    name: linux-jammy-py3.14t-clang21
    uses: ./.github/workflows/_linux-build.yml
    needs: get-label-type
    with:
      runner_prefix: "${{ needs.get-label-type.outputs.label-type }}"
      build-environment: linux-jammy-py3.14t-clang21
      docker-image-name: ci-image:pytorch-linux-jammy-py3.14t-clang21
      ci-docker-hash: ${{ needs.get-label-type.outputs.ci-docker-hash }}
      disable-test-config-filtering: true
      test-matrix: |
        { include: [
          { config: "default", shard: 1, num_shards: 11, runner: "${{ needs.get-label-type.outputs.label-type }}linux.4xlarge" },
          { config: "default", shard: 2, num_shards: 11, runner: "${{ needs.get-label-type.outputs.label-type }}linux.4xlarge" },
          { config: "default", shard: 3, num_shards: 11, runner: "${{ needs.get-label-type.outputs.label-type }}linux.4xlarge" },
          { config: "default", shard: 4, num_shards: 11, runner: "${{ needs.get-label-type.outputs.label-type }}linux.4xlarge" },
          { config: "default", shard: 5, num_shards: 11, runner: "${{ needs.get-label-type.outputs.label-type }}linux.4xlarge" },
          { config: "default", shard: 6, num_shards: 11, runner: "${{ needs.get-label-type.outputs.label-type }}linux.4xlarge" },
          { config: "default", shard: 7, num_shards: 11, runner: "${{ needs.get-label-type.outputs.label-type }}linux.4xlarge" },
          { config: "default", shard: 8, num_shards: 11, runner: "${{ needs.get-label-type.outputs.label-type }}linux.4xlarge" },
          { config: "default", shard: 9, num_shards: 11, runner: "${{ needs.get-label-type.outputs.label-type }}linux.4xlarge" },
          { config: "default", shard: 10, num_shards: 11, runner: "${{ needs.get-label-type.outputs.label-type }}linux.4xlarge" },
          { config: "default", shard: 11, num_shards: 11, runner: "${{ needs.get-label-type.outputs.label-type }}linux.4xlarge" },
          { config: "crossref", shard: 1, num_shards: 6, runner: "${{ needs.get-label-type.outputs.label-type }}linux.2xlarge" },
          { config: "crossref", shard: 2, num_shards: 6, runner: "${{ needs.get-label-type.outputs.label-type }}linux.2xlarge" },
          { config: "crossref", shard: 3, num_shards: 6, runner: "${{ needs.get-label-type.outputs.label-type }}linux.2xlarge" },
          { config: "crossref", shard: 4, num_shards: 6, runner: "${{ needs.get-label-type.outputs.label-type }}linux.2xlarge" },
          { config: "crossref", shard: 5, num_shards: 6, runner: "${{ needs.get-label-type.outputs.label-type }}linux.2xlarge" },
          { config: "crossref", shard: 6, num_shards: 6, runner: "${{ needs.get-label-type.outputs.label-type }}linux.2xlarge" },
          # Free-threaded Python 3.14t has ~20-50% higher per-object memory overhead from biased reference counting and
          # per-object locks, and test_nn (531 tests) under dynamo wrapping with compiled autograd consistently OOMs at 64GB.
          { config: "dynamo_wrapped", shard: 1, num_shards: 8, runner: "${{ needs.get-label-type.outputs.label-type }}linux.4xlarge" },
          { config: "dynamo_wrapped", shard: 2, num_shards: 8, runner: "${{ needs.get-label-type.outputs.label-type }}linux.4xlarge" },
          { config: "dynamo_wrapped", shard: 3, num_shards: 8, runner: "${{ needs.get-label-type.outputs.label-type }}linux.4xlarge" },
          { config: "dynamo_wrapped", shard: 4, num_shards: 8, runner: "${{ needs.get-label-type.outputs.label-type }}linux.4xlarge" },
          { config: "dynamo_wrapped", shard: 5, num_shards: 8, runner: "${{ needs.get-label-type.outputs.label-type }}linux.4xlarge" },
          { config: "dynamo_wrapped", shard: 6, num_shards: 8, runner: "${{ needs.get-label-type.outputs.label-type }}linux.4xlarge" },
          { config: "dynamo_wrapped", shard: 7, num_shards: 8, runner: "${{ needs.get-label-type.outputs.label-type }}linux.4xlarge" },
          { config: "dynamo_wrapped", shard: 8, num_shards: 8, runner: "${{ needs.get-label-type.outputs.label-type }}linux.4xlarge" },
          { config: "einops", shard: 1, num_shards: 1, runner: "${{ needs.get-label-type.outputs.label-type }}linux.2xlarge" },
          { config: "openreg", shard: 1, num_shards: 1, runner: "${{ needs.get-label-type.outputs.label-type }}linux.2xlarge" },
          { config: "slow", shard: 1, num_shards: 2, runner: "${{ needs.get-label-type.outputs.label-type }}linux.4xlarge" },
          { config: "slow", shard: 2, num_shards: 2, runner: "${{ needs.get-label-type.outputs.label-type }}linux.4xlarge" },
          { config: "distributed", shard: 1, num_shards: 8, runner: "${{ needs.get-label-type.outputs.label-type }}linux.2xlarge.amx" },
          { config: "distributed", shard: 2, num_shards: 8, runner: "${{ needs.get-label-type.outputs.label-type }}linux.2xlarge.amx" },
          { config: "distributed", shard: 3, num_shards: 8, runner: "${{ needs.get-label-type.outputs.label-type }}linux.2xlarge.amx" },
          { config: "distributed", shard: 4, num_shards: 8, runner: "${{ needs.get-label-type.outputs.label-type }}linux.2xlarge.amx" },
          { config: "distributed", shard: 5, num_shards: 8, runner: "${{ needs.get-label-type.outputs.label-type }}linux.2xlarge.amx" },
          { config: "distributed", shard: 6, num_shards: 8, runner: "${{ needs.get-label-type.outputs.label-type }}linux.2xlarge.amx" },
          { config: "distributed", shard: 7, num_shards: 8, runner: "${{ needs.get-label-type.outputs.label-type }}linux.2xlarge.amx" },
          { config: "distributed", shard: 8, num_shards: 8, runner: "${{ needs.get-label-type.outputs.label-type }}linux.2xlarge.amx" },
          { config: "inductor_amx", shard: 1, num_shards: 2, runner: "${{ needs.get-label-type.outputs.label-type }}linux.2xlarge.amx" },
          { config: "inductor_amx", shard: 2, num_shards: 2, runner: "${{ needs.get-label-type.outputs.label-type }}linux.2xlarge.amx" },
        ]}
      python-version: "3.14t"
      compiler: clang21
    secrets: inherit

  linux-jammy-py3_14t-clang21-test:
    name: linux-jammy-py3.14t-clang21
    uses: ./.github/workflows/_linux-test.yml
    needs:
      - linux-jammy-py3_14t-clang21-build
      - get-label-type
    with:
      timeout-minutes: 480
      build-environment: ${{ needs.linux-jammy-py3_14t-clang21-build.outputs.build-environment }}
      docker-image: ${{ needs.linux-jammy-py3_14t-clang21-build.outputs.docker-image }}
      test-matrix: ${{ needs.linux-jammy-py3_14t-clang21-build.outputs.test-matrix }}
      python-version: "3.14t"
      compiler: clang21
      collect-test-dependencies: true
    secrets: inherit

  td-tracer-aggregate:
    if: ${{ always() && github.repository_owner == 'pytorch' }}
    name: td-tracer-aggregate
    needs: linux-jammy-py3_14t-clang21-test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PyTorch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Download TD tracer shards
        continue-on-error: true
        uses: actions/download-artifact@65a9edc5881444af0b9093a5e628f2fe47ea3b2e # v4.1.7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.run_id }}
          pattern: td-tracer-runattempt*-linux-jammy-py3.14t-clang21-*
          path: td-tracer-shards
          merge-multiple: false

      - name: Merge TD tracer shards
        run: |
          python3 tools/testing/merge_td_tracer.py \
            --input-dir td-tracer-shards \
            --output td_result.json \
            --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --workflow-run-id "${GITHUB_RUN_ID}" \
            --workflow-run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --expected-shard default-1 \
            --expected-shard default-2 \
            --expected-shard default-3 \
            --expected-shard default-4 \
            --expected-shard default-5 \
            --expected-shard default-6 \
            --expected-shard default-7 \
            --expected-shard default-8 \
            --expected-shard default-9 \
            --expected-shard default-10 \
            --expected-shard default-11 \
            --expected-shard crossref-1 \
            --expected-shard crossref-2 \
            --expected-shard crossref-3 \
            --expected-shard crossref-4 \
            --expected-shard crossref-5 \
            --expected-shard crossref-6 \
            --expected-shard dynamo_wrapped-1 \
            --expected-shard dynamo_wrapped-2 \
            --expected-shard dynamo_wrapped-3 \
            --expected-shard dynamo_wrapped-4 \
            --expected-shard dynamo_wrapped-5 \
            --expected-shard dynamo_wrapped-6 \
            --expected-shard dynamo_wrapped-7 \
            --expected-shard dynamo_wrapped-8 \
            --expected-shard einops-1 \
            --expected-shard openreg-1 \
            --expected-shard slow-1 \
            --expected-shard slow-2 \
            --expected-shard distributed-1 \
            --expected-shard distributed-2 \
            --expected-shard distributed-3 \
            --expected-shard distributed-4 \
            --expected-shard distributed-5 \
            --expected-shard distributed-6 \
            --expected-shard distributed-7 \
            --expected-shard distributed-8 \
            --expected-shard inductor_amx-1 \
            --expected-shard inductor_amx-2

      - name: Upload merged TD tracer output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: td-test-dependencies-runattempt${{ github.run_attempt }}
          path: td_result.json
          if-no-files-found: error
          retention-days: 14

      - name: Check merged TD tracer output
        run: |
          python3 - <<'PY'
          import json

          with open("td_result.json", encoding="utf-8") as input_file:
              output = json.load(input_file)
          if not output["usable"]:
              raise SystemExit("TD tracer output is incomplete or contains failures")
          print(f'Collected dependencies for {len(output["coverage_by_test"])} tests')
          PY
