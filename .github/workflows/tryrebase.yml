# Owner(s): ["module: ci"]
name: Rebase PR

on:
  repository_dispatch:
    types: [try-rebase]

jobs:
  do_rebase:
    runs-on: ubuntu-24.04
    environment: mergebot
    env:
        GH_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        GIT_REPO_DIR: ${{ github.workspace }}
    steps:
      - name: Checkout repo
        id: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          token: ${{ secrets.MERGEBOT_TOKEN }}

      - name: Stage mergebot scripts
        id: stage
        # Rebasing or merging changes the files in the workspace, so every
        # helper runs from this copy of the checked-out scripts instead.
        run: |
          mkdir -p "${RUNNER_TEMP}/mergebot/.github"
          cp -a .github/scripts "${RUNNER_TEMP}/mergebot/.github/scripts"

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          architecture: x64
          check-latest: false
          cache: pip
      - run: pip install pyyaml==6.0.2

      - name: Setup committer id
        run: |
          git config --global user.email "pytorchmergebot@users.noreply.github.com"
          git config --global user.name "PyTorch MergeBot"

      - name: Rebase
        env:
          GITHUB_TOKEN: ${{ secrets.MERGEBOT_TOKEN }}
          PR_NUM: ${{ github.event.client_payload.pr_num }}
          BRANCH: ${{ github.event.client_payload.branch }}
        run: |
          set -x
          if [ -n "${BRANCH}" ]; then
            python3 "${RUNNER_TEMP}/mergebot/.github/scripts/tryrebase.py" "${PR_NUM}" --branch "${BRANCH}"
          else
            python3 "${RUNNER_TEMP}/mergebot/.github/scripts/tryrebase.py" "${PR_NUM}"
          fi
      - name: Comment on Canceled
        if: ${{ cancelled() && steps.stage.outcome == 'success' }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.MERGEBOT_TOKEN }}
          PR_NUM: ${{ github.event.client_payload.pr_num }}
        run: |
          set -ex
          python3 "${RUNNER_TEMP}/mergebot/.github/scripts/comment_on_pr.py" "${PR_NUM}" "rebase"
