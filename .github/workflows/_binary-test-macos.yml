# Owner(s): ["oncall: releng", "module: macos"]
name: test-and-upload (macOS wheel)

# Run the smoke-test of a built macOS arm64 wheel on a fresh macos runner,
# and — only if the test passes — push the same wheel to S3/R2 by
# delegating to the shared _binary-upload.yml reusable workflow.
# Called from a matrix in the main macOS wheel workflow; each matrix entry
# spawns an independent invocation, giving per-Python-version gating
# (test-X failing blocks only upload-X).

on:
  workflow_call:
    inputs:
      build_name:
        required: true
        type: string
        description: Artifact name, e.g. wheel-py3_10-cpu.
      setup_python_version:
        required: true
        type: string
        description: Full X.Y.Z version string for actions/setup-python.
      freethreaded:
        required: true
        type: boolean
      desired_python:
        required: true
        type: string
        description: Short "X.Y" or "X.Yt" — passed through to the uploader.
      package_type:
        required: true
        type: string
      desired_cuda:
        required: true
        type: string
      gpu_arch_type:
        required: true
        type: string
      docker_image:
        required: false
        type: string
      docker_image_tag_prefix:
        required: false
        type: string
    secrets:
      github-token:
        required: true
      R2_ACCOUNT_ID:
        required: false
      R2_ACCESS_KEY_ID:
        required: false
      R2_SECRET_ACCESS_KEY:
        required: false

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout smoke-test script
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          sparse-checkout: .ci/pytorch/smoke_test/
          show-progress: false
      - name: Probe MPS timestamp sampling on paravirtual GPU
        if: ${{ inputs.desired_python == '3.14' }}
        timeout-minutes: 2
        run: |
          set -euo pipefail
          swift - <<'SWIFT'
          import Foundation
          import Metal

          let devices = MTLCopyAllDevices()
          print("Metal devices: \(devices.count)")
          for device in devices {
              print("device: \(device.name)")
              let stageSampling = device.supportsCounterSampling(.atStageBoundary)
              print("stage-boundary sampling: \(stageSampling)")
              let sets = device.counterSets ?? []
              print("counter sets: \(sets.map { $0.name })")
              guard stageSampling,
                    let timestamps = sets.first(where: { $0.name == MTLCommonCounterSet.timestamp.rawValue }) else {
                  print("stage timestamp path unavailable")
                  continue
              }
              do {
                  let descriptor = MTLCounterSampleBufferDescriptor()
                  descriptor.counterSet = timestamps
                  descriptor.storageMode = .shared
                  descriptor.sampleCount = 4096
                  let samples = try device.makeCounterSampleBuffer(descriptor: descriptor)
                  let shader = "kernel void timestamp_noop(device uint* out [[buffer(0)]]) { out[0] = 0; }"
                  let library = try device.makeLibrary(source: shader, options: nil)
                  guard let function = library.makeFunction(name: "timestamp_noop"),
                        let queue = device.makeCommandQueue(),
                        let command = queue.makeCommandBuffer(),
                        let buffer = device.makeBuffer(length: 4, options: [.storageModePrivate, .hazardTrackingModeUntracked]) else {
                      print("could not create timestamp commands")
                      continue
                  }
                  let pipeline = try device.makeComputePipelineState(function: function)
                  let pass = MTLComputePassDescriptor()
                  pass.sampleBufferAttachments[0].sampleBuffer = samples
                  pass.sampleBufferAttachments[0].startOfEncoderSampleIndex = 0
                  pass.sampleBufferAttachments[0].endOfEncoderSampleIndex = MTLCounterDontSample
                  guard let encoder = command.makeComputeCommandEncoder(descriptor: pass) else {
                      print("could not create sampling encoder")
                      continue
                  }
                  encoder.setComputePipelineState(pipeline)
                  encoder.setBuffer(buffer, offset: 0, index: 0)
                  encoder.dispatchThreads(MTLSize(width: 1, height: 1, depth: 1),
                                          threadsPerThreadgroup: MTLSize(width: 1, height: 1, depth: 1))
                  encoder.endEncoding()
                  command.commit()
                  command.waitUntilCompleted()
                  print("command status: \(command.status.rawValue); error: \(String(describing: command.error))")
                  if let data = try samples.resolveCounterRange(0..<1), data.count >= MemoryLayout<MTLCounterResultTimestamp>.size {
                      let ticks = data.withUnsafeBytes { $0.loadUnaligned(as: MTLCounterResultTimestamp.self).timestamp }
                      print("GPU timestamp: \(ticks); valid: \(ticks != 0 && ticks != MTLCounterErrorValue)")
                  } else {
                      print("could not resolve GPU timestamp")
                  }
              } catch {
                  print("timestamp setup failed: \(error)")
              }
          }
          SWIFT
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ inputs.setup_python_version }}
          freethreaded: ${{ inputs.freethreaded }}
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ${{ inputs.build_name }}
          path: ${{ runner.temp }}/artifacts
      - name: Smoke-test wheel
        run: |
          set -eux -o pipefail
          venv_dir="${RUNNER_TEMP}/test_venv"
          rm -rf "$venv_dir"
          python -mvenv "$venv_dir"
          # shellcheck disable=SC1091
          source "$venv_dir/bin/activate"
          pip install "${RUNNER_TEMP}/artifacts"/*.whl numpy -v
          python .ci/pytorch/smoke_test/smoke_test.py --package torchonly
      # GitHub-hosted runners expose a paravirtual GPU that is not Apple7+,
      # see https://github.com/pytorch/pytorch/issues/202529
      - name: Test MPS on paravirtual GPU
        if: ${{ inputs.desired_python == '3.14' }}
        run: |
          set -eux -o pipefail
          # shellcheck disable=SC1091
          source "${RUNNER_TEMP}/test_venv/bin/activate"
          python - <<'EOF'
          import torch
          print(f"torch {torch.__version__}")
          if not torch.backends.mps.is_available():
              raise RuntimeError("MPS is not available")
          print(f"MPS device: {torch.backends.mps.get_name()}")
          a = torch.rand(64, 64) + 64 * torch.eye(64)
          torch.testing.assert_close(torch.linalg.inv(a.to("mps")).cpu(), torch.linalg.inv(a))
          EOF

  upload:
    needs: test
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/_binary-upload.yml
    with:
      PYTORCH_ROOT: /pytorch
      PACKAGE_TYPE: ${{ inputs.package_type }}
      DESIRED_CUDA: ${{ inputs.desired_cuda }}
      GPU_ARCH_TYPE: ${{ inputs.gpu_arch_type }}
      DOCKER_IMAGE: ${{ inputs.docker_image }}
      DOCKER_IMAGE_TAG_PREFIX: ${{ inputs.docker_image_tag_prefix }}
      DESIRED_PYTHON: ${{ inputs.desired_python }}
      build_name: ${{ inputs.build_name }}
      use_s3: false
    secrets:
      github-token: ${{ secrets.github-token }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
