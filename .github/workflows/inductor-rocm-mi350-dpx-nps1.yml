# Owner(s): ["module: rocm"]
# DO NOT MERGE. One shard of the real inductor-rocm-mi350 test on the
# single DPX+NPS1 runner. Shard 2 is not requested: this machine has
# one 1-GPU runner, so a second shard would wait behind the first.
# CUDA, CPU, and multi-GPU inductor jobs are not scheduled.
name: inductor-rocm-mi350-dpx-nps1

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read
  actions: read

jobs:
  get-label-type:
    name: get-label-type
    uses: pytorch/pytorch/.github/workflows/_runner-determinator.yml@main
    if: ${{ github.repository_owner == 'pytorch' }}
    with:
      triggering_actor: ${{ github.triggering_actor }}
      issue_owner: ${{ github.event.pull_request.user.login || github.event.issue.user.login }}
      curr_branch: ${{ github.head_ref || github.ref_name }}
      curr_ref_type: ${{ github.ref_type }}
      opt_out_experiments: lf
      check_experiments: amd-dpx

  linux-noble-rocm-py3_11-inductor-build:
    name: linux-noble-rocm-py3.11-mi350
    uses: ./.github/workflows/_linux-build.yml
    needs: get-label-type
    with:
      runner_prefix: "mt-"
      # Main's .ci/docker tree (9db57817), published by docker-builds on
      # 106626232c1e. Hashing this branch would ask for 4af25553, whose
      # image is gone (ImagePullBackOff). The pull_request build checks
      # out the merge with main, so this image matches the source.
      ci-docker-hash: 9db57817b83b2c8c8c224e23680e2734f8d14d68
      build-environment: linux-noble-rocm-py3.11-mi350
      docker-image-name: ci-image:pytorch-linux-noble-rocm-n-py3.11
      rocm-arch-list: gfx950
      test-matrix: |
        { include: [
          { config: "inductor", shard: 1, num_shards: 2, runner: "linux.rocm.gpu.mi350.1.dpx.nps1" },
        ]}
    secrets: inherit

  linux-noble-rocm-py3_11-inductor-test:
    name: linux-noble-rocm-py3.11-mi350
    uses: ./.github/workflows/_rocm-test.yml
    needs: linux-noble-rocm-py3_11-inductor-build
    with:
      build-environment: ${{ needs.linux-noble-rocm-py3_11-inductor-build.outputs.build-environment }}
      docker-image: ${{ needs.linux-noble-rocm-py3_11-inductor-build.outputs.docker-image }}
      test-matrix: ${{ needs.linux-noble-rocm-py3_11-inductor-build.outputs.test-matrix }}
    secrets: inherit
