# Owner(s): ["module: rocm"]
#
# Kubernetes-container counterpart to _rocm-test.yml. The selected CI image is
# the job pod itself; there is no host setup, image pull action, or docker exec.
name: test-kubernetes

on:
  workflow_call:
    inputs:
      build-environment:
        required: true
        type: string
        description: Top-level label for what's being built/tested.
      test-matrix:
        required: true
        type: string
        description: JSON description of what test configs to run.
      docker-image:
        required: true
        type: string
        description: CI environment image to use directly as the job container.
      sync-tag:
        required: false
        type: string
        default: ""
      timeout-minutes:
        required: false
        type: number
        default: 300
      tests-to-include:
        required: false
        type: string
        default: ""
      dashboard-tag:
        required: false
        type: string
        default: ""
      disable-monitor:
        required: false
        type: boolean
        default: true
      monitor-log-interval:
        required: false
        type: number
        default: 5
      monitor-data-collect-interval:
        required: false
        type: number
        default: 1
    secrets:
      HUGGING_FACE_HUB_TOKEN:
        required: false
        description: HF Auth token to avoid rate limits when downloading datasets.

env:
  GIT_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

permissions:
  id-token: write
  contents: read

jobs:
  test:
    # Keep the production guard from _rocm-test.yml.
    if: github.repository_owner == 'pytorch' && toJSON(fromJSON(inputs.test-matrix).include) != '[]'
    strategy:
      matrix: ${{ fromJSON(inputs.test-matrix) }}
      fail-fast: false
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    # _linux-build returns the exact ECR image it used, including ci-docker-hash.
    # ARC's Kubernetes hook turns this container block into the GPU job pod.
    container:
      image: ${{ inputs.docker-image }}
    steps:
      # Use a remote action reference: in kubernetes-novolume mode the checkout
      # exists only in the job pod, while the runner resolves action.yml files.
      - name: Checkout PyTorch
        uses: pytorch/pytorch/.github/actions/checkout-pytorch@main
        with:
          no-sudo: true

      - name: Job pod GPU check
        shell: bash
        run: |
          set -euo pipefail
          ngpu=$(rocminfo | grep -c -E 'Name:.*\sgfx')
          required=1
          config="${{ matrix.config }}"
          if [[ "${config}" == *distributed* ]]; then
            required=2
          fi
          if [[ "${ngpu}" -lt "${required}" ]]; then
            echo "::error::Only ${ngpu} GPU(s) detected; ${required} required"
            exit 1
          fi

      - name: Get workflow job id
        id: get-job-id
        uses: pytorch/pytorch/.github/actions/get-workflow-job-id@main
        if: always()
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Initialize job directories
        shell: bash
        run: |
          set -euo pipefail
          for name in artifacts test-results docs; do
            path="${RUNNER_TEMP}/${name}"
            rm -rf "${path}"
            mkdir -p "${path}"
            case "${name}" in
              artifacts) echo "RUNNER_ARTIFACT_DIR=${path}" >> "${GITHUB_ENV}" ;;
              test-results) echo "RUNNER_TEST_RESULTS_DIR=${path}" >> "${GITHUB_ENV}" ;;
              docs) echo "RUNNER_DOCS_DIR=${path}" >> "${GITHUB_ENV}" ;;
            esac
          done

      - name: Start monitoring script
        id: monitor-script
        if: ${{ !inputs.disable-monitor }}
        shell: bash
        continue-on-error: true
        env:
          JOB_ID: ${{ steps.get-job-id.outputs.job-id }}
          JOB_NAME: ${{ steps.get-job-id.outputs.job-name }}
          WORKFLOW_NAME: ${{ github.workflow }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          MONITOR_LOG_INTERVAL: ${{ inputs.monitor-log-interval }}
          MONITOR_DATA_COLLECT_INTERVAL: ${{ inputs.monitor-data-collect-interval }}
        run: |
          python3 -m pip install psutil==5.9.8 dataclasses_json==0.6.7
          python3 -m tools.stats.monitor \
            --log-interval "${MONITOR_LOG_INTERVAL}" \
            --data-collect-interval "${MONITOR_DATA_COLLECT_INTERVAL}" \
            > usage_log.txt 2>&1 &
          echo "monitor-script-pid=${!}" >> "${GITHUB_OUTPUT}"

      # setup-rocm normally establishes the host-side AWS session. Since this
      # job starts inside the CI image, obtain the artifact-read role directly.
      - name: Configure AWS credentials
        id: aws-creds
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7
        with:
          role-to-assume: arn:aws:iam::308535385114:role/arc
          aws-region: us-east-1
          role-duration-seconds: 18000

      - name: Download build artifacts
        uses: pytorch/pytorch/.github/actions/download-build-artifacts@main
        with:
          name: ${{ inputs.build-environment }}
          use-gha: ${{ steps.aws-creds.outcome != 'success' }}

      - name: Download TD artifacts
        continue-on-error: true
        uses: pytorch/pytorch/.github/actions/download-td-artifacts@main
        with:
          use-gha: ${{ steps.aws-creds.outcome != 'success' }}

      - name: Parse ref
        id: parse-ref
        shell: bash
        run: .github/scripts/parse_ref.py

      - name: Check for keep-going label and re-enabled test issues
        id: keep-going
        uses: pytorch/pytorch/.github/actions/filter-test-configs@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          test-matrix: ${{ inputs.test-matrix }}
          job-name: ${{ steps.get-job-id.outputs.job-name }}

      - name: Set Test step time
        id: test-timeout
        shell: bash
        env:
          JOB_TIMEOUT: ${{ inputs.timeout-minutes }}
        run: echo "timeout=$((JOB_TIMEOUT-30))" >> "${GITHUB_OUTPUT}"

      - name: Configure AWS credentials for in-run test-result upload
        uses: aws-actions/configure-aws-credentials@ececac1a45f3b08a01d2dd070d28d111c5fe6722 # v4.1.0
        continue-on-error: true
        with:
          role-to-assume: arn:aws:iam::308535385114:role/gha_workflow_rocm-test-results-write
          role-duration-seconds: 18000
          aws-region: us-east-1

      - name: Test
        id: test
        timeout-minutes: ${{ fromJson(steps.test-timeout.outputs.timeout) }}
        env:
          BUILD_ENVIRONMENT: ${{ inputs.build-environment }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
          GITHUB_JOB: ${{ github.job }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          JOB_ID: ${{ steps.get-job-id.outputs.job-id }}
          JOB_NAME: ${{ steps.get-job-id.outputs.job-name }}
          BRANCH: ${{ steps.parse-ref.outputs.branch }}
          SHA1: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          TEST_CONFIG: ${{ matrix.config }}
          SHARD_NUMBER: ${{ matrix.shard }}
          NUM_TEST_SHARDS: ${{ matrix.num_shards }}
          REENABLED_ISSUES: ${{ steps.keep-going.outputs.reenabled-issues }}
          CONTINUE_THROUGH_ERROR: ${{ steps.keep-going.outputs.keep-going }}
          VERBOSE_TEST_LOGS: ${{ steps.keep-going.outputs.ci-verbose-test-logs }}
          TEST_SHOWLOCALS: ${{ steps.keep-going.outputs.ci-test-showlocals }}
          NO_TEST_TIMEOUT: ${{ steps.keep-going.outputs.ci-no-test-timeout }}
          NO_TD: ${{ steps.keep-going.outputs.ci-no-td }}
          DOCKER_IMAGE: ${{ inputs.docker-image }}
          PYTORCH_TEST_RERUN_DISABLED_TESTS: ${{ matrix.rerun_disabled_tests && '1' || '0' }}
          TESTS_TO_INCLUDE: ${{ inputs.tests-to-include }}
          DASHBOARD_TAG: ${{ inputs.dashboard-tag }}
          HUGGING_FACE_HUB_TOKEN: ${{ secrets.HUGGING_FACE_HUB_TOKEN }}
          USE_ARC: "1"
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${TEST_CONFIG}" == "multigpu" ]]; then
            TEST_COMMAND=.ci/pytorch/multigpu-test.sh
          elif [[ "${BUILD_ENVIRONMENT}" == *onnx* ]]; then
            TEST_COMMAND=.ci/caffe2/test.sh
          else
            TEST_COMMAND=.ci/pytorch/test.sh
          fi

          # nproc sees the 192-core node, not the job pod's CPU quota.
          cpus=""
          if [[ -r /sys/fs/cgroup/cpu.max ]]; then
            read -r quota period < /sys/fs/cgroup/cpu.max
            if [[ "${quota}" != "max" ]]; then
              cpus=$(( quota / period ))
            fi
          elif [[ -r /sys/fs/cgroup/cpu/cpu.cfs_quota_us ]]; then
            quota="$(cat /sys/fs/cgroup/cpu/cpu.cfs_quota_us)"
            period="$(cat /sys/fs/cgroup/cpu/cpu.cfs_period_us)"
            if [[ "${quota}" -gt 0 ]]; then
              cpus=$(( quota / period ))
            fi
          fi
          if [[ -z "${cpus}" || "${cpus}" -lt 1 ]]; then
            cpus="$(nproc)"
          fi
          export MAX_JOBS="$(( cpus > 2 ? cpus - 2 : 1 ))"

          pip install dist/*.whl
          if [[ "${TEST_CONFIG}" == *distributed* ]]; then
            timeout 180 python .ci/pytorch/rocm_preflight.py
          fi
          "${TEST_COMMAND}"

      - name: Print remaining test logs
        shell: bash
        if: always() && steps.test.conclusion
        run: cat test/**/*_toprint.log || true

      - name: Stop monitoring script
        if: ${{ always() && steps.monitor-script.outputs.monitor-script-pid }}
        shell: bash
        continue-on-error: true
        env:
          MONITOR_SCRIPT_PID: ${{ steps.monitor-script.outputs.monitor-script-pid }}
        run: kill "${MONITOR_SCRIPT_PID}"

      - name: Upload test artifacts
        uses: pytorch/pytorch/.github/actions/upload-test-artifacts@main
        if: always() && steps.test.conclusion && steps.test.conclusion != 'skipped'
        with:
          skip-s3: true
          file-suffix: ${{ github.job }}-${{ matrix.config }}-${{ matrix.shard }}-${{ matrix.num_shards }}-${{ matrix.runner }}_${{ steps.get-job-id.outputs.job-id }}

      - name: Collect backtraces from coredumps (if any)
        if: always()
        shell: bash
        run: |
          find . -iname "core.[1-9]*" -exec gdb python {} -ex 'bt' -ex 'q' \; || true

      - name: Store Core dumps on GitHub
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: coredumps-${{ github.job }}-${{ matrix.config }}-${{ matrix.shard }}-${{ matrix.num_shards }}-${{ matrix.runner }}
          retention-days: 14
          if-no-files-found: ignore
          path: ./**/core.[1-9]*

      - name: Authenticate with AWS
        uses: aws-actions/configure-aws-credentials@ececac1a45f3b08a01d2dd070d28d111c5fe6722 # v4.1.0
        with:
          role-to-assume: arn:aws:iam::308535385114:role/gha_workflow_upload-benchmark-results
          role-duration-seconds: 18000
          aws-region: us-east-1

      - name: Upload the benchmark results
        uses: pytorch/test-infra/.github/actions/upload-benchmark-results@main
        with:
          benchmark-results-dir: test/test-reports
          dry-run: false
          schema-version: v3
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload utilization stats
        if: ${{ always() && steps.test.conclusion && steps.test.conclusion != 'skipped' && !inputs.disable-monitor }}
        continue-on-error: true
        uses: pytorch/pytorch/.github/actions/upload-utilization-stats@main
        with:
          job_id: ${{ steps.get-job-id.outputs.job-id }}
          job_name: ${{ steps.get-job-id.outputs.job-name }}
          workflow_name: ${{ github.workflow }}
          workflow_run_id: ${{ github.run_id }}
          workflow_attempt: ${{ github.run_attempt }}
