# Owner(s): ["module: ci"]
name: "Claude Code scripts: test"


on:
  push:
    branches: [main]
    paths:
      - "scripts/claude_code/**"
      - ".claude/hooks/claude_code/**"
      - ".github/workflows/claude-code.yml"
      - ".github/workflows/claude-code-scripts-test.yml"
      - ".claude/skills/pr-review/**"
  pull_request:
    paths:
      - "scripts/claude_code/**"
      - ".claude/hooks/claude_code/**"
      - ".github/workflows/claude-code.yml"
      - ".github/workflows/claude-code-scripts-test.yml"
      - ".claude/skills/pr-review/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}-${{ github.event_name == 'workflow_dispatch' }}
  cancel-in-progress: true

jobs:
  test:
    if: github.repository_owner == 'pytorch'
    # The suite shells out to jq and shellcheck, which this image ships.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.10'

      - run: pip install pyyaml==6.0.2

      - name: Run the time budget tests
        run: python3 scripts/claude_code/test_time_budget.py
