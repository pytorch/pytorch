# Owner(s): ["module: ci"]
name: Retrieval PyTorch Tests for Target Determination

on:
  workflow_call:

permissions:
  contents: read

jobs:
  get-label-type:
    name: get-label-type
    # Don't run on forked repos
    if: github.repository_owner == 'pytorch'
    uses: pytorch/pytorch/.github/workflows/_runner-determinator.yml@main
    with:
      triggering_actor: ${{ github.triggering_actor }}
      issue_owner: ${{ github.event.pull_request.user.login || github.event.issue.user.login }}
      curr_branch: ${{ github.head_ref || github.ref_name }}
      curr_ref_type: ${{ github.ref_type }}
      check_experiments: "lf"

  llm-retrieval:
    # Don't run on forked repos
    if: github.repository_owner == 'pytorch'
    runs-on: "${{ needs.get-label-type.outputs.label-type }}l-x86iavx512-16-128"
    continue-on-error: true
    needs: get-label-type
    container:
      image: ghcr.io/actions/actions-runner:latest
    steps:
      - name: Setup Linux
        timeout-minutes: 25
        uses: pytorch/pytorch/.github/actions/setup-linux@main
        with:
          use-arc: true
          submodules: false

      - name: Setup uv
        timeout-minutes: 5
        uses: pytorch/test-infra/.github/actions/setup-uv@main
        with:
          python-version: "3.12"
          activate-environment: true
          enable-cache: true

      - name: Checkout test-infra
        timeout-minutes: 5
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: pytorch/test-infra
          ref: main
          path: test-infra
          persist-credentials: false

      - name: Install requirements
        timeout-minutes: 10
        shell: bash
        env:
          UV_NO_CONFIG: "1"
        run: |
          set -euxo pipefail
          uv pip install awscli==1.29.40
          uv pip install -r test-infra/tools/torchci/td/llm/requirements-torch.txt --index-url https://download.pytorch.org/whl/cpu
          uv pip install -r test-infra/tools/torchci/td/llm/requirements.txt
          uv pip install -e test-infra/tools/torchci

      - name: Fetch index
        id: fetch
        continue-on-error: true
        timeout-minutes: 20
        uses: nick-fields/retry@7152eba30c6575329ac0576536151aca5a72780e # v3.0.0
        with:
          max_attempts: 3
          retry_wait_seconds: 10
          timeout_minutes: 5
          shell: bash
          command: |
            set -euxo pipefail
            mkdir -p "${RUNNER_TEMP}/llm"
            cd test-infra/tools/torchci
            aws s3 cp s3://target-determinator-assets/indexes/latest/bundle.tar "${RUNNER_TEMP}/llm/bundle.tar" --no-sign-request
            python -P -m torchci.td.llm.bundle verify "${RUNNER_TEMP}/llm/bundle.tar"

      - name: Run Retriever
        id: run_retriever
        if: steps.fetch.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 10
        shell: bash
        working-directory: test-infra/tools/torchci
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The runner's default HF_HOME is a read-only shared cache.
          HF_HOME: ${{ runner.temp }}/hf
        run: |
          set -euxo pipefail
          python -P -m torchci.td.llm.retrieve \
            --pytorch "${GITHUB_WORKSPACE}" \
            --bundle "${RUNNER_TEMP}/llm/bundle.tar" \
            --out "${RUNNER_TEMP}/llm/mappings/indexer-files-gitdiff-output.json" \
            --pr-number "${PR_NUMBER}" \
            --base-ref "${BASE_REF}" \
            --base-sha "${BASE_SHA}" \
            --github-ref "${GITHUB_REF}"
          cd "${RUNNER_TEMP}/llm"
          python -m zipfile -c mappings.zip mappings/

      - name: Warn when the retriever produced nothing
        timeout-minutes: 1
        if: steps.fetch.outcome == 'failure' || steps.run_retriever.outcome == 'failure'
        shell: bash
        run: echo "::warning title=LLM TD::retrieval produced no results; TD runs without the LLM heuristic"

      - name: Upload results
        timeout-minutes: 5
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ steps.run_retriever.outcome == 'success' }}
        with:
          name: llm_results
          retention-days: 1
          if-no-files-found: warn
          path: ${{ runner.temp }}/llm/mappings.zip
