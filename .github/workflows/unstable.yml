# Owner(s): ["module: ci"]
name: unstable

on:
  push:
    branches:
      - main
    tags:
      - ciflow/unstable/*
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}-${{ github.ref_type == 'branch' && github.sha }}-${{ github.event_name == 'workflow_dispatch' }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read
  # _linux-build.yml and _linux-test.yml both request actions: read, and a nested
  # job cannot be granted more than its caller has. Omitting it here means
  # actions: none, which fails the whole workflow at startup.
  actions: read

jobs:
  # There must be at least one job here to satisfy GitHub action workflow syntax
  introduction:
    if: github.repository_owner == 'pytorch'
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - name: Introduce PyTorch unstable workflow
        run: |
          echo "PyTorch unstable workflow is used to host experimental or flaky jobs"
          echo " that needs to be run for every commit, but doesn't block PR merging"
          echo " as part of the stable pull or trunk workflows."
          echo
          echo "In addition, a new label called ciflow/unstable can be attached to the"
          echo " PR to trigger this workflow. That can be done either manually or"
          echo " automatically using PyTorch auto-label bot."
          echo
          echo "Once the jobs are deemed stable enough (% red signal < 5% and TTS < 3h),"
          echo " they can graduate and move back to pull or trunk."

  target-determination:
    if: github.repository_owner == 'pytorch'
    name: before-test
    uses: ./.github/workflows/target_determination.yml
    permissions:
      id-token: write
      contents: read

  get-label-type:
    name: get-label-type
    uses: pytorch/pytorch/.github/workflows/_runner-determinator.yml@main
    if: ${{ (github.event_name != 'schedule' || github.repository == 'pytorch/pytorch') && github.repository_owner == 'pytorch' }}
    with:
      triggering_actor: ${{ github.triggering_actor }}
      issue_owner: ${{ github.event.pull_request.user.login || github.event.issue.user.login }}
      curr_branch: ${{ github.head_ref || github.ref_name }}
      curr_ref_type: ${{ github.ref_type }}

  # B200 CUDA 13.2 sm100 smoke coverage, staged here to gauge B200 runner
  # reliability/availability on every main commit before it graduates to trunk.
  linux-jammy-cuda13_2-py3_12-gcc11-sm100-build:
    if: github.repository_owner == 'pytorch'
    name: linux-jammy-cuda13.2-py3.12-gcc11-sm100
    uses: ./.github/workflows/_linux-build.yml
    needs: get-label-type
    with:
      runner_prefix: "${{ needs.get-label-type.outputs.label-type }}"
      runner: linux.r7i.4xlarge
      build-environment: linux-jammy-cuda13.2-py3.12-gcc11-sm100
      docker-image-name: ci-image:pytorch-linux-jammy-cuda13.2-cudnn9-py3.12-gcc11
      ci-docker-hash: ${{ needs.get-label-type.outputs.ci-docker-hash }}
      cuda-arch-list: '10.0'
      test-matrix: |
        { include: [
          { config: "smoke_b200", shard: 1, num_shards: 1, runner: "linux.dgx.b200" },
        ]}
      # config: "smoke_b200" maps to test_python_smoke_b200() in .ci/pytorch/test.sh
      python-version: "3.12"
      compiler: gcc11
      cuda-version: "13.2"
    secrets: inherit

  linux-jammy-cuda13_2-py3_12-gcc11-sm100-test:
    if: github.repository_owner == 'pytorch'
    name: linux-jammy-cuda13.2-py3.12-gcc11-sm100
    uses: ./.github/workflows/_linux-test.yml
    needs:
      - linux-jammy-cuda13_2-py3_12-gcc11-sm100-build
      - target-determination
    with:
      build-environment: ${{ needs.linux-jammy-cuda13_2-py3_12-gcc11-sm100-build.outputs.build-environment }}
      docker-image: ${{ needs.linux-jammy-cuda13_2-py3_12-gcc11-sm100-build.outputs.docker-image }}
      test-matrix: ${{ needs.linux-jammy-cuda13_2-py3_12-gcc11-sm100-build.outputs.test-matrix }}
      python-version: "3.12"
      compiler: gcc11
      cuda-version: "13.2"
    secrets: inherit
