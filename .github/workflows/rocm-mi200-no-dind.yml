# Owner(s): ["module: rocm"]
name: rocm-mi200-no-dind

on:
  push:
    tags:
      # Shares the registered rocm-mi200 label so the trial runs next to the DinD workflow.
      - ciflow/rocm-mi200/*
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}-${{ github.ref_type == 'branch' && github.sha }}-${{ github.event_name == 'workflow_dispatch' }}-${{ github.event_name == 'schedule' }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read
  actions: read

jobs:
  target-determination:
    if: github.repository_owner == 'pytorch'
    name: before-test
    uses: ./.github/workflows/target_determination.yml
    permissions:
      id-token: write
      contents: read

  get-label-type:
    name: get-label-type
    uses: pytorch/pytorch/.github/workflows/_runner-determinator.yml@main
    if: ${{ (github.event_name != 'schedule' || github.repository == 'pytorch/pytorch') && github.repository_owner == 'pytorch' }}
    with:
      triggering_actor: ${{ github.triggering_actor }}
      issue_owner: ${{ github.event.pull_request.user.login || github.event.issue.user.login }}
      curr_branch: ${{ github.head_ref || github.ref_name }}
      curr_ref_type: ${{ github.ref_type }}

  linux-jammy-rocm-py3_11-build:
    if: ${{ (github.event_name != 'schedule' || github.repository == 'pytorch/pytorch') && github.repository_owner == 'pytorch' }}
    name: linux-jammy-rocm-py3.11-mi200-no-dind
    uses: ./.github/workflows/_linux-build.yml
    needs: get-label-type
    with:
      runner_prefix: "mt-"
      ci-docker-hash: ${{ needs.get-label-type.outputs.ci-docker-hash }}
      build-environment: linux-jammy-rocm-py3.11-mi200-no-dind
      docker-image-name: ci-image:pytorch-linux-jammy-rocm-n-py3
      rocm-arch-list: gfx90a
      sync-tag: rocm-build
      test-matrix: |
        { include: [
          { config: "default", shard: 1, num_shards: 10, runner: "linux.rocm.gpu.mi210.no-dind.1" },
          { config: "default", shard: 2, num_shards: 10, runner: "linux.rocm.gpu.mi210.no-dind.1" },
          { config: "default", shard: 3, num_shards: 10, runner: "linux.rocm.gpu.mi210.no-dind.1" },
          { config: "distributed", shard: 1, num_shards: 3, runner: "linux.rocm.gpu.mi210.no-dind.2", owners: ["module:rocm", "oncall:distributed"] },
        ]}
    secrets: inherit

  linux-jammy-rocm-py3_11-test:
    permissions:
      id-token: write
      contents: read
    name: linux-jammy-rocm-py3.11-mi200-no-dind
    uses: ./.github/workflows/_rocm-test-no-dind.yml
    needs:
      - linux-jammy-rocm-py3_11-build
      - target-determination
    with:
      build-environment: ${{ needs.linux-jammy-rocm-py3_11-build.outputs.build-environment }}
      docker-image: ${{ needs.linux-jammy-rocm-py3_11-build.outputs.docker-image }}
      test-matrix: ${{ needs.linux-jammy-rocm-py3_11-build.outputs.test-matrix }}
      # Same exclusions as rocm-mi200.yml: inductor tests run in their own workflow.
      tests-to-exclude: >-
        inductor/test_torchinductor
        inductor/test_torchinductor_opinfo
        inductor/test_aot_inductor
        inductor/test_cpu_select_algorithm
    secrets: inherit
