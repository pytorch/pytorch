# Builds and tests dynamo for one Python version. dynamo-unittest.yml calls this once per
# version so that each version's test job reads the test-matrix of its own build.
name: dynamo-unittest-python

on:
  workflow_call:
    inputs:
      python-version:
        required: true
        type: string
      runner:
        required: true
        type: string
      label-type:
        required: false
        type: string
        default: ""
      lf-runners:
        required: false
        type: string
        default: ""
      ci-docker-hash:
        required: false
        type: string
        default: ""

jobs:
  dynamo-build:
    name: dynamo-build
    uses: ./.github/workflows/_linux-build.yml
    with:
      runner_prefix: ${{ inputs.label-type }}
      lf_runners: ${{ inputs.lf-runners }}
      build-environment: linux-jammy-py${{ inputs.python-version }}-clang21
      docker-image-name: ci-image:pytorch-linux-jammy-py${{ inputs.python-version }}-clang21
      ci-docker-hash: ${{ inputs.ci-docker-hash }}
      test-matrix: |
        { include: [
          { config: "dynamo_core", shard: 1, num_shards: 1, runner: "${{ inputs.label-type }}${{ inputs.runner }}" },
          { config: "dynamo_wrapped", shard: 1, num_shards: 7, runner: "${{ inputs.label-type }}${{ inputs.runner }}" },
          { config: "dynamo_wrapped", shard: 2, num_shards: 7, runner: "${{ inputs.label-type }}${{ inputs.runner }}" },
          { config: "dynamo_wrapped", shard: 3, num_shards: 7, runner: "${{ inputs.label-type }}${{ inputs.runner }}" },
          { config: "dynamo_wrapped", shard: 4, num_shards: 7, runner: "${{ inputs.label-type }}${{ inputs.runner }}" },
          { config: "dynamo_wrapped", shard: 5, num_shards: 7, runner: "${{ inputs.label-type }}${{ inputs.runner }}" },
          { config: "dynamo_wrapped", shard: 6, num_shards: 7, runner: "${{ inputs.label-type }}${{ inputs.runner }}" },
          { config: "dynamo_wrapped", shard: 7, num_shards: 7, runner: "${{ inputs.label-type }}${{ inputs.runner }}" },
        ]}
      python-version: ${{ inputs.python-version }}
      compiler: clang21
      cuda-version: cpu
    secrets: inherit

  dynamo-test:
    name: dynamo-test
    uses: ./.github/workflows/_linux-test.yml
    needs: dynamo-build
    with:
      build-environment: linux-jammy-py${{ inputs.python-version }}-clang21
      docker-image: ${{ needs.dynamo-build.outputs.docker-image }}
      test-matrix: ${{ needs.dynamo-build.outputs.test-matrix }}
      python-version: ${{ inputs.python-version }}
      compiler: clang21
      cuda-version: cpu
    secrets: inherit
