name: Auto PR Triage

# Runs for every non-draft PR when it is opened, marked ready for review, or
# pushed to, so codepath owners are requested as GitHub's CODEOWNERS did and
# ownership is reevaluated as the diff changes. Each run reads the PR, its
# triage signals, and reviewer state once and plans the exact effects against
# what earlier runs and people already did; live apply executes that plan.
# Separate calls can observe different moments, later changes are ignored for
# this run, and stale effects are bounded and recoverable.

on:
  pull_request_target:
    types: [opened, ready_for_review, synchronize]

# Runs on one PR never overlap: each plans against the labels and reviewers the
# previous one left. GitHub keeps one pending run per group, and a newer push
# replacing a pending run loses nothing, since every run reads the current PR.
concurrency:
  group: auto-pr-triage-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  # Change only this value to enable the bounded live mutation path. Shadow
  # plans in the read-only analyze job and never runs a job that can write.
  AUTO_PR_TRIAGE_MODE: live

jobs:
  analyze:
    if: >-
      github.repository_owner == 'pytorch' &&
      github.event.pull_request.state == 'open' &&
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: bedrock
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      action-plan-json: ${{ steps.auto-pr-triage.outputs.action-plan-json }}
    permissions:
      contents: read
      id-token: write
      issues: read
      pull-requests: read
    steps:
      - name: Read deployment mode
        id: mode
        run: |
          [[ "$AUTO_PR_TRIAGE_MODE" == "shadow" || "$AUTO_PR_TRIAGE_MODE" == "live" ]] || exit 1
          echo "mode=$AUTO_PR_TRIAGE_MODE" >> "$GITHUB_OUTPUT"

      - name: Set Auto PR Triage artifact directory
        id: paths
        env:
          OUTPUT_DIR: ${{ runner.temp }}/auto-pr-triage-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          mkdir -p "$OUTPUT_DIR"
          echo "output-dir=$OUTPUT_DIR" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.sha }}

      # trusted_config.py reads OWNERSHIP.yaml with PyYAML.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: python3 -m pip install pyyaml==6.0.2

      - name: Analyze PR ownership
        id: auto-pr-triage
        uses: ./.github/actions/auto-pr-triage
        with:
          output-dir: ${{ steps.paths.outputs.output-dir }}
          pr-number: ${{ github.event.pull_request.number }}
          repository: ${{ github.repository }}
          run-attempt: ${{ github.run_attempt }}
          workflow-sha: ${{ github.sha }}

      # Logs, the step summary, and these artifacts are visible to anyone who can
      # read this repository's Actions runs, so nothing here may hold secrets.
      # They hold PR content, checked-in config, and LLM output from a session
      # with no tools or credential access. The full Claude transcript
      # (execution.json) is uploaded only when the analysis action fails.
      - name: Upload human-review result
        if: >-
          steps.auto-pr-triage.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: auto-pr-triage-human-review-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
          path: |
            ${{ steps.paths.outputs.output-dir }}/action-failure.json
            ${{ steps.paths.outputs.output-dir }}/error.json
            ${{ steps.paths.outputs.output-dir }}/intake.json
            ${{ steps.paths.outputs.output-dir }}/ownership.json
            ${{ steps.paths.outputs.output-dir }}/planner_input.json
            ${{ steps.paths.outputs.output-dir }}/plan.json
            ${{ steps.paths.outputs.output-dir }}/result.json
          retention-days: 90
          if-no-files-found: error

      - name: Upload Auto PR Triage failure diagnostics
        if: >-
          always() &&
          steps.auto-pr-triage.outcome != 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: auto-pr-triage-human-review-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
          path: |
            ${{ steps.paths.outputs.output-dir }}/action-failure.json
            ${{ steps.paths.outputs.output-dir }}/error.json
            ${{ steps.paths.outputs.output-dir }}/execution.json
            ${{ steps.paths.outputs.output-dir }}/intake.json
            ${{ steps.paths.outputs.output-dir }}/ownership.json
            ${{ steps.paths.outputs.output-dir }}/planner_input.json
            ${{ steps.paths.outputs.output-dir }}/plan.json
            ${{ steps.paths.outputs.output-dir }}/result.json
          retention-days: 90
          if-no-files-found: warn

  apply:
    needs: analyze
    if: >-
      needs.analyze.result == 'success' &&
      needs.analyze.outputs.mode == 'live' &&
      needs.analyze.outputs.action-plan-json != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Apply Auto PR Triage plan
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          ACTION_PLAN_JSON: ${{ needs.analyze.outputs.action-plan-json }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          python3 scripts/auto_pr_triage/apply_actions.py \
            "$PR_NUMBER" \
            --repository "$REPOSITORY" \
            --workflow-sha "$WORKFLOW_SHA" \
            --run-attempt "$RUN_ATTEMPT" \
            --action-plan-json "$ACTION_PLAN_JSON"

  record-error:
    needs: [analyze, apply]
    if: >-
      always() &&
      needs.analyze.outputs.mode == 'live' &&
      (needs.analyze.result == 'failure' ||
       needs.apply.result == 'failure' ||
       (needs.analyze.result == 'success' && needs.apply.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      pull-requests: write
    steps:
      - name: Record unexpected Auto PR Triage failure
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [[ ! "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "::warning::Cannot record Auto PR Triage failure for invalid PR identity."
            exit 0
          fi
          if ! gh api \
            --method POST \
            "repos/$REPOSITORY/issues/$PR_NUMBER/labels" \
            -f 'labels[]=bot-triage-error' >/dev/null; then
            echo "::warning::Unable to add bot-triage-error. Inspect the failed job logs."
          fi
