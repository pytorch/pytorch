name: Auto PR Triage

# Intentional one-pass execution: analyze reads each PR, triage signal, and
# reviewer state once and plans the exact effects. Live apply executes
# that plan. Separate calls can observe different moments, later changes are
# ignored for this run, and stale effects are bounded and recoverable.

# auto-pr-triage-request.yml admits entry events from the PR's base branch.
# workflow_run always runs this workflow from main, so its code, its policy, and
# the bedrock environment never depend on a ghstack base branch.
on:
  workflow_run:
    workflows: [Auto PR Triage Request]
    types: [completed]

# GitHub keeps one pending run per group, so a burst of label events would let
# an unrelated label's run replace the pending `open source` run and then skip.
# Only admitted requests share the per-PR group, keyed by the PR head.
concurrency:
  group: auto-pr-triage-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}-${{ github.event.workflow_run.conclusion == 'success' && 'entry' || github.run_id }}
  cancel-in-progress: false

env:
  # Change only this value to enable the bounded live mutation path. Shadow
  # plans in the read-only analyze job and never runs a job that can write.
  AUTO_PR_TRIAGE_MODE: live

jobs:
  analyze:
    if: >-
      github.repository_owner == 'pytorch' &&
      github.event.workflow_run.event == 'pull_request_target' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: bedrock
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      pr-number: ${{ steps.request.outputs.pr-number }}
      should-run: ${{ steps.history.outputs.should-run }}
      action-plan-json: ${{ steps.auto-pr-triage.outputs.action-plan-json }}
    permissions:
      contents: read
      id-token: write
      issues: read
      pull-requests: read
    steps:
      - name: Read deployment mode
        id: mode
        run: |
          [[ "$AUTO_PR_TRIAGE_MODE" == "shadow" || "$AUTO_PR_TRIAGE_MODE" == "live" ]] || exit 1
          echo "mode=$AUTO_PR_TRIAGE_MODE" >> "$GITHUB_OUTPUT"

      - name: Resolve the requested PR
        id: request
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.workflow_run.head_branch }}
          HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          REPOSITORY: ${{ github.repository }}
          REQUEST_TITLE: ${{ github.event.workflow_run.display_title }}
        run: |
          # Anyone who can push a ghstack base branch can edit the request
          # workflow, so its run name is only a claim. The claimed PR must have
          # the head branch that GitHub recorded for the request run.
          REQUEST_RE='^Auto PR Triage Request #([1-9][0-9]*) (labeled|ready_for_review)$'
          [[ "$REQUEST_TITLE" =~ $REQUEST_RE ]] || exit 1
          PR_NUMBER="${BASH_REMATCH[1]}"
          EVENT_ACTION="${BASH_REMATCH[2]}"
          PR_HEAD="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" --jq '"\(.head.repo.full_name):\(.head.ref)"')"
          [[ "$PR_HEAD" == "$HEAD_REPOSITORY:$HEAD_REF" ]] || exit 1
          echo "pr-number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "event-action=$EVENT_ACTION" >> "$GITHUB_OUTPUT"

      - name: Admit the label event or the first ready event after it
        id: history
        env:
          EVENT_ACTION: ${{ steps.request.outputs.event-action }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.request.outputs.pr-number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || exit 1
          [[ "$EVENT_ACTION" == "labeled" || "$EVENT_ACTION" == "ready_for_review" ]] || exit 1
          HISTORY="$(
            # GraphQL variables must remain literal for gh to bind with -F.
            # shellcheck disable=SC2016
            gh api graphql \
              -F owner="${REPOSITORY%%/*}" \
              -F name="${REPOSITORY#*/}" \
              -F number="$PR_NUMBER" \
              -f query='query($owner: String!, $name: String!, $number: Int!) {
                repository(owner: $owner, name: $name) {
                  pullRequest(number: $number) {
                    timelineItems(
                      last: 100
                      itemTypes: [LABELED_EVENT, READY_FOR_REVIEW_EVENT]
                    ) {
                      nodes {
                        __typename
                        ... on LabeledEvent { label { name } }
                      }
                      pageInfo { hasPreviousPage }
                    }
                  }
                }
              }'
          )"
          HISTORY_TRUNCATED="$(
            jq -r '.data.repository.pullRequest.timelineItems.pageInfo.hasPreviousPage' <<<"$HISTORY"
          )"
          LATEST_LABEL_INDEX="$(
            jq '[.data.repository.pullRequest.timelineItems.nodes | to_entries[] | select(.value.__typename == "LabeledEvent" and .value.label.name == "open source") | .key] | max // -1' <<<"$HISTORY"
          )"
          READY_EVENT_COUNT="$(
            jq --argjson label_index "$LATEST_LABEL_INDEX" '[.data.repository.pullRequest.timelineItems.nodes | to_entries[] | select(.key > $label_index and .value.__typename == "ReadyForReviewEvent")] | length' <<<"$HISTORY"
          )"
          [[ "$HISTORY_TRUNCATED" == "true" || "$HISTORY_TRUNCATED" == "false" ]] || exit 1
          [[ "$LATEST_LABEL_INDEX" =~ ^-?[0-9]+$ ]] || exit 1
          [[ "$READY_EVENT_COUNT" =~ ^[0-9]+$ ]] || exit 1
          # Adding `open source` needs triage permission, so every such event
          # is a deliberate request to triage; a PR that already has an outcome
          # label or `no automated triage` is a no-op. To triage again, remove
          # those labels, then remove and re-add `open source`.
          if [[ "$EVENT_ACTION" == "labeled" ]]; then
            echo "should-run=true" >> "$GITHUB_OUTPUT"
          elif [[ "$HISTORY_TRUNCATED" == "true" ]]; then
            echo "should-run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping Auto PR Triage because entry-event history exceeds 100 matching events."
          elif [[ "$EVENT_ACTION" == "ready_for_review" && "$LATEST_LABEL_INDEX" -ge 0 && "$READY_EVENT_COUNT" == "1" ]]; then
            echo "should-run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should-run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping repeated or ineligible $EVENT_ACTION event for $REPOSITORY#$PR_NUMBER."
          fi

      - name: Set Auto PR Triage artifact directory
        if: steps.history.outputs.should-run == 'true'
        id: paths
        env:
          OUTPUT_DIR: ${{ runner.temp }}/auto-pr-triage-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          mkdir -p "$OUTPUT_DIR"
          echo "output-dir=$OUTPUT_DIR" >> "$GITHUB_OUTPUT"

      - if: steps.history.outputs.should-run == 'true'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Analyze PR ownership
        if: steps.history.outputs.should-run == 'true'
        id: auto-pr-triage
        uses: ./.github/actions/auto-pr-triage
        with:
          output-dir: ${{ steps.paths.outputs.output-dir }}
          pr-number: ${{ steps.request.outputs.pr-number }}
          repository: ${{ github.repository }}
          run-attempt: ${{ github.run_attempt }}
          workflow-sha: ${{ github.sha }}

      # Logs, the step summary, and these artifacts are visible to anyone who can
      # read this repository's Actions runs, so nothing here may hold secrets.
      # They hold PR content, checked-in config, and LLM output from a session
      # with no tools or credential access. The full Claude transcript
      # (execution.json) is uploaded only when the analysis action fails.
      - name: Upload human-review result
        if: >-
          steps.history.outputs.should-run == 'true' &&
          steps.auto-pr-triage.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: auto-pr-triage-human-review-${{ steps.request.outputs.pr-number }}-${{ github.run_attempt }}
          path: |
            ${{ steps.paths.outputs.output-dir }}/action-failure.json
            ${{ steps.paths.outputs.output-dir }}/error.json
            ${{ steps.paths.outputs.output-dir }}/intake.json
            ${{ steps.paths.outputs.output-dir }}/ownership.json
            ${{ steps.paths.outputs.output-dir }}/planner_input.json
            ${{ steps.paths.outputs.output-dir }}/plan.json
            ${{ steps.paths.outputs.output-dir }}/result.json
          retention-days: 90
          if-no-files-found: error

      - name: Upload Auto PR Triage failure diagnostics
        if: >-
          always() &&
          steps.history.outputs.should-run == 'true' &&
          steps.auto-pr-triage.outcome != 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: auto-pr-triage-human-review-${{ steps.request.outputs.pr-number }}-${{ github.run_attempt }}
          path: |
            ${{ steps.paths.outputs.output-dir }}/action-failure.json
            ${{ steps.paths.outputs.output-dir }}/error.json
            ${{ steps.paths.outputs.output-dir }}/execution.json
            ${{ steps.paths.outputs.output-dir }}/intake.json
            ${{ steps.paths.outputs.output-dir }}/ownership.json
            ${{ steps.paths.outputs.output-dir }}/planner_input.json
            ${{ steps.paths.outputs.output-dir }}/plan.json
            ${{ steps.paths.outputs.output-dir }}/result.json
          retention-days: 90
          if-no-files-found: warn

  apply:
    needs: analyze
    if: >-
      needs.analyze.result == 'success' &&
      needs.analyze.outputs.mode == 'live' &&
      needs.analyze.outputs.should-run == 'true' &&
      needs.analyze.outputs.action-plan-json != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Apply Auto PR Triage plan
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.analyze.outputs.pr-number }}
          REPOSITORY: ${{ github.repository }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          ACTION_PLAN_JSON: ${{ needs.analyze.outputs.action-plan-json }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          python3 scripts/auto_pr_triage/apply_actions.py \
            "$PR_NUMBER" \
            --repository "$REPOSITORY" \
            --workflow-sha "$WORKFLOW_SHA" \
            --run-attempt "$RUN_ATTEMPT" \
            --action-plan-json "$ACTION_PLAN_JSON"

  record-error:
    needs: [analyze, apply]
    if: >-
      always() &&
      needs.analyze.outputs.mode == 'live' &&
      (needs.analyze.result == 'failure' ||
       needs.apply.result == 'failure' ||
       (needs.analyze.result == 'success' &&
        needs.analyze.outputs.should-run == 'true' &&
        needs.apply.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      pull-requests: write
    steps:
      - name: Record unexpected Auto PR Triage failure
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.analyze.outputs.pr-number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [[ ! "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "::warning::Cannot record Auto PR Triage failure for invalid PR identity."
            exit 0
          fi
          if ! gh api \
            --method POST \
            "repos/$REPOSITORY/issues/$PR_NUMBER/labels" \
            -f 'labels[]=bot-triage-error' >/dev/null; then
            echo "::warning::Unable to add bot-triage-error. Inspect the failed job logs."
          fi
