# Owner(s): ["module: ci"]
# AI-assisted temporary diagnostic. Never merge.
name: CI BuildKit own-event context diagnostic
on:
  pull_request:
    paths: [.github/workflows/ci-buildkit-version-canary.yml]
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}-${{ github.event_name == 'workflow_dispatch' }}
  cancel-in-progress: false
jobs:
  probe:
    # Exact owned route; normal selected-head approval remains mandatory.
    if: >-
      github.repository == 'pytorch/pytorch' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.number == 204886 &&
      github.event.pull_request.user.login == 'ptdbot' &&
      github.event.pull_request.head.repo.full_name == 'ptdbot/pytorch' &&
      github.event.pull_request.head.ref == 'ci-buildkit-version-20261113' &&
      github.event.pull_request.base.repo.full_name == 'pytorch/pytorch' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: mt-l-x86iavx512-8-64
    timeout-minutes: 5
    container:
      image: python:3.12-slim@sha256:5e2bdb1b0d542d5039cffb8181c65930093949194a65c365dfb1b0fe13a4fa5b
    steps:
      - name: Diagnose own-event context carrier
        shell: sh
        run: |
          python3 -I - <<'PY'
          # AI-assisted context-only diagnostic. Never merge.
          import json
          import os
          import re
          import resource
          import stat

          PLAN = "e0977553a895c7fdd9e550640bcf767204efd039d8c6225f43a111c948e901a6"
          PR_NUMBER = 204886
          BRANCH = "ci-buildkit-version-20261113"
          PATHS = {
              "standard": "/github/workflow/event.json",
              "staged": "/__w/_temp/_github_workflow/event.json",
          }
          STAGES = (
              "opened",
              "regular",
              "size_ok",
              "json_valid",
              "event_scope_matches",
              "receipt_present",
              "receipt_schema_valid",
              "receipt_head_matches",
              "receipt_plan_matches",
              "context_matches",
          )
          FIELDS = (
              "env_scope_matches",
              "env_path_is_standard",
              "env_path_is_staged",
              "both_payloads_equal",
              "no_external_action",
              "diagnostic_error",
          ) + tuple(prefix + "_" + stage for prefix in PATHS for stage in STAGES)


          def unique_object(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError("duplicate")
                  result[key] = value
              return result


          def parse_json(data, limit):
              if len(data) > limit:
                  raise ValueError("size")
              return json.loads(data.decode("utf-8"), object_pairs_hook=unique_object)


          def matches(value, pattern):
              return type(value) is str and re.fullmatch(pattern, value) is not None


          def event_scope(event):
              pr = event["pull_request"]
              return (
                  event["repository"]["full_name"] == "pytorch/pytorch"
                  and type(event["number"]) is int
                  and event["number"] == PR_NUMBER
                  and type(pr["number"]) is int
                  and pr["number"] == PR_NUMBER
                  and pr["state"] == "open"
                  and pr["user"]["login"] == "ptdbot"
                  and pr["head"]["repo"]["full_name"] == "ptdbot/pytorch"
                  and pr["head"]["ref"] == BRANCH
                  and matches(pr["head"]["sha"], "[0-9a-f]{40}")
                  and pr["base"]["repo"]["full_name"] == "pytorch/pytorch"
                  and pr["base"]["ref"] == "main"
              )


          def inspect_payload(data, prefix, result):
              def mark(stage, value=True):
                  result[prefix + "_" + stage] = bool(value)

              event = parse_json(data, 1024 * 1024)
              mark("json_valid")
              if not event_scope(event):
                  return
              mark("event_scope_matches")
              body = event["pull_request"]["body"]
              start, end = "<!-- ci-buildkit-version-selection-v1\n", "\n-->"
              if type(body) is not str or body.count(start) != 1:
                  return
              receipt_text = body.split(start, 1)[1]
              if receipt_text.count(end) != 1:
                  return
              mark("receipt_present")
              receipt = parse_json(receipt_text.split(end, 1)[0].encode("utf-8"), 2048)
              expected = {
                  "schema": 1,
                  "repository": "pytorch/pytorch",
                  "pr": PR_NUMBER,
                  "author": "ptdbot",
                  "head_repository": "ptdbot/pytorch",
                  "head_ref": BRANCH,
                  "base_ref": "main",
              }
              if type(receipt) is not dict or set(receipt) != set(expected) | {
                  "head_sha",
                  "head_tree",
                  "plan_sha256",
              }:
                  return
              if any(
                  type(receipt[k]) is not type(v) or receipt[k] != v for k, v in expected.items()
              ):
                  return
              if not all(matches(receipt[k], "[0-9a-f]{40}") for k in ("head_sha", "head_tree")):
                  return
              if not matches(receipt["plan_sha256"], "[0-9a-f]{64}"):
                  return
              mark("receipt_schema_valid")
              mark(
                  "receipt_head_matches",
                  receipt["head_sha"] == event["pull_request"]["head"]["sha"],
              )
              mark("receipt_plan_matches", receipt["plan_sha256"] == PLAN)
              # Event attests commit, not tree; review/tree/normal approval are external.
              mark(
                  "context_matches",
                  result[prefix + "_receipt_head_matches"]
                  and result[prefix + "_receipt_plan_matches"],
              )


          def read_fixed(root_fd, prefix, result):
              # No environment-derived path or directory enumeration.
              path = PATHS[prefix]
              owned = []
              try:
                  current = root_fd
                  for part in path.strip("/").split("/")[:-1]:
                      current = os.open(
                          part, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW, dir_fd=current
                      )
                      owned.append(current)
                  fd = os.open(
                      "event.json", os.O_RDONLY | os.O_NONBLOCK | os.O_NOFOLLOW, dir_fd=current
                  )
                  owned.append(fd)
                  result[prefix + "_opened"] = True
                  info = os.fstat(fd)
                  if not stat.S_ISREG(info.st_mode):
                      return None
                  result[prefix + "_regular"] = True
                  if info.st_size > 1024 * 1024:
                      return None
                  data = bytearray()
                  while len(data) <= 1024 * 1024:
                      block = os.read(fd, min(65536, 1024 * 1024 + 1 - len(data)))
                      if not block:
                          break
                      data.extend(block)
                  if len(data) > 1024 * 1024:
                      return None
                  result[prefix + "_size_ok"] = True
                  return bytes(data)
              finally:
                  for fd in reversed(owned):
                      os.close(fd)


          def diagnose(root_fd, result):
              result["env_scope_matches"] = (
                  os.environ.get("GITHUB_EVENT_NAME") == "pull_request"
                  and os.environ.get("GITHUB_REPOSITORY") == "pytorch/pytorch"
              )
              for prefix, path in PATHS.items():
                  result["env_path_is_" + prefix] = os.environ.get("GITHUB_EVENT_PATH") == path
              if not result["env_scope_matches"]:
                  return
              payloads = {}
              for prefix in PATHS:
                  try:
                      data = read_fixed(root_fd, prefix, result)
                      if data is not None:
                          payloads[prefix] = data
                          inspect_payload(data, prefix, result)
                  except (OSError, ValueError, TypeError, KeyError, UnicodeError):
                      result["diagnostic_error"] = True
              result["both_payloads_equal"] = (
                  len(payloads) == 2 and payloads["standard"] == payloads["staged"]
              )


          def main():
              result = dict.fromkeys(FIELDS, False)
              resource.setrlimit(resource.RLIMIT_CORE, (0, 0))
              root_fd = None
              try:
                  root_fd = os.open("/", os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW)
                  diagnose(root_fd, result)
              except BaseException:
                  result["diagnostic_error"] = True
              finally:
                  if root_fd is not None:
                      os.close(root_fd)
              result["no_external_action"] = True
              print(json.dumps(result, sort_keys=True, separators=(",", ":")), flush=True)
              return (
                  0
                  if result["env_scope_matches"]
                  and (result["standard_context_matches"] or result["staged_context_matches"])
                  else 1
              )


          if __name__ == "__main__":
              raise SystemExit(main())
          PY
