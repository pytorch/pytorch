# Owner(s): ["module: rocm"]
# Kubernetes-container copy of rocm-mi350.yml for rollout validation.
# The build remains unchanged; only the 1-GPU test jobs use the new no-DinD
# queue and run the build-selected CI image as the Kubernetes job container.
name: rocm-mi350-kubernetes

on:
  # Keep this manual until the new ARC scale set is deployed and validated.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}-${{ github.ref_type == 'branch' && github.sha }}-${{ github.event_name == 'workflow_dispatch' }}-${{ github.event_name == 'schedule' }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read
  actions: read

jobs:
  target-determination:
    if: github.repository_owner == 'pytorch'
    name: before-test
    uses: ./.github/workflows/target_determination.yml

  get-label-type:
    name: get-label-type
    uses: pytorch/pytorch/.github/workflows/_runner-determinator.yml@main
    if: ${{ (github.event_name != 'schedule' || github.repository == 'pytorch/pytorch') && github.repository_owner == 'pytorch' }}
    with:
      triggering_actor: ${{ github.triggering_actor }}
      issue_owner: ${{ github.event.pull_request.user.login || github.event.issue.user.login }}
      curr_branch: ${{ github.head_ref || github.ref_name }}
      curr_ref_type: ${{ github.ref_type }}
      check_experiments: amd-dpx

  linux-noble-rocm-py3_11-build:
    if: ${{ (github.event_name != 'schedule' || github.repository == 'pytorch/pytorch') && github.repository_owner == 'pytorch' }}
    name: linux-noble-rocm-py3.11-mi350
    uses: ./.github/workflows/_linux-build.yml
    needs: get-label-type
    with:
      runner_prefix: "mt-"
      ci-docker-hash: ${{ needs.get-label-type.outputs.ci-docker-hash }}
      build-environment: linux-noble-rocm-py3.11-mi350
      docker-image-name: ci-image:pytorch-linux-noble-rocm-n-py3.11
      test-matrix: |
        { include: [
          { config: "default", shard: 1, num_shards: 6, runner: "linux.rocm.gpu.gfx950.1-no-dind" },
          { config: "default", shard: 2, num_shards: 6, runner: "linux.rocm.gpu.gfx950.1-no-dind" },
          { config: "default", shard: 3, num_shards: 6, runner: "linux.rocm.gpu.gfx950.1-no-dind" },
          { config: "default", shard: 4, num_shards: 6, runner: "linux.rocm.gpu.gfx950.1-no-dind" },
          { config: "default", shard: 5, num_shards: 6, runner: "linux.rocm.gpu.gfx950.1-no-dind" },
          { config: "default", shard: 6, num_shards: 6, runner: "linux.rocm.gpu.gfx950.1-no-dind" },
        ]}
    secrets: inherit

  linux-noble-rocm-py3_11-test:
    name: linux-noble-rocm-py3.11-mi350
    uses: ./.github/workflows/_rocm-test-kubernetes.yml
    needs:
      - linux-noble-rocm-py3_11-build
      - target-determination
    with:
      build-environment: ${{ needs.linux-noble-rocm-py3_11-build.outputs.build-environment }}
      # This is the exact image selected by _linux-build, including ci-docker-hash.
      # _rocm-test-kubernetes uses it directly as the workflow pod's job image.
      docker-image: ${{ needs.linux-noble-rocm-py3_11-build.outputs.docker-image }}
      test-matrix: ${{ needs.linux-noble-rocm-py3_11-build.outputs.test-matrix }}
    secrets: inherit
