name: Build vLLM wheels

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-vllm-wheel.yml
      - .github/ci_commit_pins/vllm.txt
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/build-vllm-wheel.yml
      - .github/ci_commit_pins/vllm.txt
  schedule:
    # every morning at 01:30PM UTC, 9:30AM EST, 6:30AM PST
    - cron: 30 13 * * *

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}-${{ github.event_name == 'workflow_dispatch' }}
  cancel-in-progress: true

jobs:
  build-wheel:
    if: github.repository_owner == 'pytorch'
    strategy:
      fail-fast: false
      matrix:
        python-version: [ '3.12' ]
        platform: [ 'manylinux_2_28_x86_64', 'manylinux_2_28_aarch64' ]
        device: [ 'cu130', 'cu132' ]
        include:
          - platform: manylinux_2_28_x86_64
            device: cu130
            manylinux-image: 'pytorch/manylinux2_28-builder:cuda13.0'
            runner: mt-rel-l-x86iavx512-8-64
            buildkit_addr: tcp://buildkitd-amd64.buildkit:1234
          - platform: manylinux_2_28_x86_64
            device: cu132
            manylinux-image: 'pytorch/manylinux2_28-builder:cuda13.2'
            runner: mt-rel-l-x86iavx512-8-64
            buildkit_addr: tcp://buildkitd-amd64.buildkit:1234
          - platform: manylinux_2_28_aarch64
            device: cu130
            manylinux-image: 'pytorch/manylinuxaarch64-builder:cuda13.0'
            runner: mt-rel-l-arm64g4-16-62
            buildkit_addr: tcp://buildkitd-arm64.buildkit:1234
          - platform: manylinux_2_28_aarch64
            device: cu132
            manylinux-image: 'pytorch/manylinuxaarch64-builder:cuda13.2'
            runner: mt-rel-l-arm64g4-16-62
            buildkit_addr: tcp://buildkitd-arm64.buildkit:1234
    name: "Build ${{ matrix.device }} vLLM wheel on ${{ matrix.platform }}"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 480
    permissions:
      id-token: write
      contents: read
    # OSDC ARC has no host docker daemon; run in the gh actions image and build via
    # the remote buildkit builder (same pattern as docker-builds.yml).
    container:
      image: ghcr.io/actions/actions-runner:latest
    env:
      PY_VERS: ${{ matrix.python-version }}
      MANYLINUX_IMAGE: ${{ matrix.manylinux-image }}
      PLATFORM: ${{ matrix.platform }}
      BUILD_DEVICE: ${{ matrix.device }}
    steps:
      - name: Setup Linux
        uses: pytorch/pytorch/.github/actions/setup-linux@main
        with:
          use-arc: true
          submodules: false

      - name: Login to ECR
        uses: pytorch/pytorch/.github/actions/ecr-login@main
        with:
          aws-role-to-assume: arn:aws:iam::308535385114:role/arc

      - name: Set up Docker Buildx (remote, no bootstrap)
        shell: bash
        # NOT docker/setup-buildx-action (its --bootstrap connect times out on a
        # cold/burst start). --use makes this the default builder so the vLLM
        # `docker buildx build --output type=local` runs on the remote buildkitd.
        run: |
          set -ex
          docker buildx create \
            --name remote-buildkit \
            --driver remote \
            --use \
            "${{ matrix.buildkit_addr }}"

      - uses: pytorch/test-infra/.github/actions/setup-uv@main
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: "true"

      - name: Get latest PyTorch nightly
        shell: bash
        run: |
          set -eux

          # Keep PyTorch nightly wheels for the vLLM build. The runner arch matches
          # the target platform, so pip resolves the correct manylinux wheels.
          # No docker run/exec: OSDC ARC has no host docker daemon.
          mkdir -p "${RUNNER_TEMP}/artifacts/"
          uv pip install pip==25.3
          python -m pip download \
            --pre torch torchvision torchaudio \
            --index-url "https://download.pytorch.org/whl/nightly/${BUILD_DEVICE}" \
            --dest "${RUNNER_TEMP}/artifacts"

      - name: Build vLLM wheel
        shell: bash
        # No SCCACHE_BUCKET/REGION: the compile runs on the remote buildkitd,
        # which has no AWS creds, so sccache-to-S3 can't authenticate. Omitting
        # them makes lumen set USE_SCCACHE=0, taking the Dockerfile's ccache path
        # whose `--mount=type=cache` persists on buildkitd across builds.
        env:
          CUDA_VERSION: ${{ matrix.device == 'cu130' && '13.0' || '13.2' }}
          TORCH_CUDA_ARCH_LIST: '8.0;8.9;9.0;10.0;12.0'
          # vLLM sets cmake jobs = max(1, MAX_JOBS // NVCC_THREADS), and each nvcc
          # spawns NVCC_THREADS threads (up to one per arch). The x86 buildkitd
          # handles 64/8 (8 jobs). The arm64 buildkitd is memory-constrained and
          # OOMs at that level, so run many single-thread jobs: 16/1 = 16 jobs but
          # only 16 concurrent single-arch compiles (well under the ~40 that OOM'd).
          MAX_JOBS: ${{ contains(matrix.platform, 'aarch64') && '16' || '64' }}
          NVCC_THREADS: ${{ contains(matrix.platform, 'aarch64') && '1' || '8' }}
          # Use the manylinux builder as the base; remote buildkit pulls it from
          # the registry (no local docker daemon needed).
          BASE_IMAGE: ${{ matrix.manylinux-image }}
          TORCH_WHEELS_PATH: ${{ runner.temp }}/artifacts
          OUTPUT_DIR: ${{ runner.temp }}/artifacts/externals/vllm
        run: |
          set -eux
          # Call lumen directly rather than the build-external-packages action,
          # which runs `docker images` (needs a local daemon). lumen builds with
          # `docker buildx build --output type=local`, which runs on the remote
          # buildkit builder set up above.
          (cd .ci/lumen_cli && uv pip install -e .)
          # MAX_JOBS is set per-platform in this step's env (the build runs on the
          # remote buildkitd, not this tiny orchestrator pod).
          python3 -m cli.run build external vllm

      - name: Prepare vLLM wheel
        shell: bash
        # Original ran this inside the manylinux container via docker exec (cwd
        # /artifacts, with PYTHON_EXECUTABLE + auditwheel/wheel/unzip present).
        # OSDC ARC has no host docker daemon, so run it directly on the pod: cd to
        # the artifacts dir (where torch-* and externals/vllm/wheels live), point
        # PYTHON_EXECUTABLE at the uv venv, and install the repackaging tools.
        working-directory: ${{ runner.temp }}/artifacts
        env:
          PYTHON_EXECUTABLE: python
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y unzip patchelf
          uv pip install auditwheel wheel==0.45.1
          bash "${GITHUB_WORKSPACE}/.github/scripts/prepare_vllm_wheels.sh"

      - uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.0
        with:
          name: vllm-wheel-${{ matrix.device }}-${{ matrix.platform }}-${{ matrix.python-version }}
          if-no-files-found: error
          path: ${{ runner.temp }}/artifacts/externals/vllm/wheels/*.whl

  # Copied from build-triton-wheel workflow (mostly)
  upload-wheel:
    name: "Upload ${{ matrix.device }} vLLM wheel on ${{ matrix.platform }}"
    needs:
      - build-wheel
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        platform: [ 'manylinux_2_28_x86_64', 'manylinux_2_28_aarch64' ]
        device: [ 'cu130', 'cu132' ]
    env:
      PLATFORM: ${{ matrix.platform }}
      BUILD_DEVICE: ${{ matrix.device }}
    permissions:
      id-token: write
      contents: read
    container:
      image: continuumio/miniconda3:4.12.0
    environment: ${{ ((github.event_name == 'push' && github.event.ref == 'refs/heads/main') || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'nightly-wheel-upload' || '' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure AWS credentials(PyTorch account) for main
        if: ${{ (github.event_name == 'push' && github.event.ref == 'refs/heads/main') || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        uses: aws-actions/configure-aws-credentials@ececac1a45f3b08a01d2dd070d28d111c5fe6722 # v4.1.0
        with:
          role-to-assume: arn:aws:iam::749337293305:role/gha_workflow_nightly_build_wheels
          aws-region: us-east-1

      - name: Configure AWS credentials(PyTorch account) for RC builds
        if: ${{ github.event_name == 'push' &&  (startsWith(github.event.ref, 'refs/tags/') && !startsWith(github.event.ref, 'refs/tags/ciflow/')) }}
        uses: aws-actions/configure-aws-credentials@ececac1a45f3b08a01d2dd070d28d111c5fe6722 # v4.1.0
        with:
          role-to-assume: arn:aws:iam::749337293305:role/gha_workflow_test_build_wheels
          aws-region: us-east-1

      - name: Download Build Artifacts
        uses: actions/download-artifact@65a9edc5881444af0b9093a5e628f2fe47ea3b2e # v4.1.7
        with:
          # Download all available artifacts
          path: ${{ runner.temp }}/artifacts-all

      - name: Select Wheel Artifacts
        shell: bash
        run: |
          set -eux
          mkdir -p "${RUNNER_TEMP}/artifacts/"
          mv "${RUNNER_TEMP}"/artifacts-all/vllm-wheel-"${BUILD_DEVICE}"-"${PLATFORM}"-*/* "${RUNNER_TEMP}/artifacts/"

      - name: Set DRY_RUN
        if: ${{ (github.event_name == 'push' && (github.event.ref == 'refs/heads/main' || startsWith(github.event.ref, 'refs/tags/v'))) || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          echo "DRY_RUN=disabled" >> "$GITHUB_ENV"

      - name: Set UPLOAD_CHANNEL
        if: ${{ github.event_name == 'push' && startsWith(github.event.ref, 'refs/tags/v') }}
        shell: bash
        run: |
          set -ex

          if [[ "${GITHUB_REF_NAME}" = *-rc[0-9]* ]]; then
            echo "UPLOAD_CHANNEL=test" >> "$GITHUB_ENV"
          fi

      - name: Upload binaries
        env:
          PACKAGE_TYPE: wheel
          UPLOAD_SUBFOLDER: ${{ env.BUILD_DEVICE }}
          PKG_DIR: ${{ runner.temp }}/artifacts
          R2_UPLOAD: ${{ ((github.event_name == 'push' && github.event.ref == 'refs/heads/main') || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'true' || '' }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        shell: bash
        run: |
          set -ex
          bash .ci/pytorch/binary_upload.sh
