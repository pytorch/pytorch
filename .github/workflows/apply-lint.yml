name: Apply lint patches

on:
  repository_dispatch:
    types: [apply-lint]

permissions: {}

env:
  GH_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
  PR_NUM: ${{ github.event.client_payload.pr_num }}

jobs:
  # Runs the PR's linters, which are PR code, so this job gets no mergebot
  # token and saves no cache. It only uploads the diff the linters made.
  lint:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    env:
      LINTERS: CLANGFORMAT,NEWLINE,PYFMT,RUFF,ATEN_CPU_GPU_AGNOSTIC
    outputs:
      head_sha: ${{ steps.pr.outputs.head_sha }}
      has_changes: ${{ steps.lint.outputs.has_changes }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Find the PR branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          HEAD_REF=$(gh pr view "$PR_NUM" --json headRefName -q .headRefName)
          BASE_BRANCH=$(gh pr view "$PR_NUM" --json baseRefName -q .baseRefName)
          echo "BASE_BRANCH=$BASE_BRANCH" >> "$GITHUB_ENV"
          if [[ "$HEAD_REF" =~ ^gh/[^/]+/[0-9]+/head$ ]]; then
            echo "PR_REF=${HEAD_REF/%head/orig}" >> "$GITHUB_ENV"
          else
            echo "PR_REF=refs/pull/${PR_NUM}/head" >> "$GITHUB_ENV"
          fi

      - name: Checkout PR branch
        id: pr
        run: |
          git fetch origin "$BASE_BRANCH"
          git fetch origin "$PR_REF"
          git checkout --detach FETCH_HEAD
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          architecture: x64
          check-latest: false

      - name: Run lintrunner
        id: lint
        run: |
          set -x
          pip install lintrunner pyyaml==6.0.2 uv
          lintrunner init --take "$LINTERS"
          # Only run linters that produce auto-fixable patches (is_formatter = true)
          lintrunner -a \
            --take "$LINTERS" \
            -m "origin/${BASE_BRANCH}" 2>/dev/null || true
          git diff --binary > "${RUNNER_TEMP}/lint.patch"
          if [ -s "${RUNNER_TEMP}/lint.patch" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload lint patch
        if: steps.lint.outputs.has_changes == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lint-patch
          path: ${{ runner.temp }}/lint.patch
          retention-days: 1

  # Holds the mergebot token and runs no PR code: it checks the lint job's
  # patch with a script from main, applies it and pushes.
  apply-lint:
    needs: lint
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    environment: mergebot
    steps:
      - name: Checkout repo
        id: checkout
        if: needs.lint.outputs.has_changes == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          token: ${{ secrets.MERGEBOT_TOKEN }}

      - name: Stage the patch checker
        if: steps.checkout.outcome == 'success'
        run: |
          mkdir -p "${RUNNER_TEMP}/mergebot"
          cp .github/scripts/check_lint_patch.py "${RUNNER_TEMP}/mergebot/"

      - name: Checkout PR branch
        if: steps.checkout.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.MERGEBOT_TOKEN }}
          HEAD_SHA: ${{ needs.lint.outputs.head_sha }}
        run: |
          HEAD_REF=$(gh pr view "$PR_NUM" --json headRefName -q .headRefName)
          BASE_BRANCH=$(gh pr view "$PR_NUM" --json baseRefName -q .baseRefName)
          echo "BASE_BRANCH=$BASE_BRANCH" >> "$GITHUB_ENV"
          if [[ "$HEAD_REF" =~ ^gh/[^/]+/[0-9]+/head$ ]]; then
            echo "IS_GHSTACK=true" >> "$GITHUB_ENV"
            ORIG_REF="${HEAD_REF/%head/orig}"
            git fetch origin "$ORIG_REF" "$BASE_BRANCH"
            git checkout -b "$ORIG_REF" "origin/$ORIG_REF"
          else
            git fetch origin "$BASE_BRANCH"
            gh pr checkout "$PR_NUM"
          fi
          if [ "$(git rev-parse HEAD)" != "$HEAD_SHA" ]; then
            echo "::error::PR #${PR_NUM} changed while lint ran, run the command again"
            exit 1
          fi

      - name: Download lint patch
        if: steps.checkout.outcome == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: lint-patch
          path: ${{ runner.temp }}/lint-patch

      - name: Setup Python
        if: steps.checkout.outcome == 'success'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          architecture: x64
          check-latest: false

      - name: Setup committer id
        if: steps.checkout.outcome == 'success'
        run: |
          if [ "$IS_GHSTACK" = "true" ]; then
            git config --global user.email "$(git log HEAD --pretty=format:%ae -1)"
            git config --global user.name "$(git log HEAD --pretty=format:%an -1)"
          else
            git config --global user.email "pytorchmergebot@users.noreply.github.com"
            git config --global user.name "PyTorch MergeBot"
          fi

      - name: Apply lint patches
        if: steps.checkout.outcome == 'success'
        run: |
          set -x
          PATCH="${RUNNER_TEMP}/lint-patch/lint.patch"
          python3 -I "${RUNNER_TEMP}/mergebot/check_lint_patch.py" "$PATCH" "origin/${BASE_BRANCH}"
          git apply --index "$PATCH"
          if [ "$IS_GHSTACK" = "true" ]; then
            git commit --amend --no-edit
          else
            git commit -m "Apply lint patches

          Generated by apply-lint bot, see ${GH_RUN_URL}"
          fi

      - name: Push lint changes
        if: steps.checkout.outcome == 'success' && env.IS_GHSTACK != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.MERGEBOT_TOKEN }}
        run: |
          git push
          MSG="Successfully applied lint patches in ${GH_RUN_URL}. Please pull locally before pushing more changes."
          # shellcheck disable=SC2016
          if ! ABOVE=$(gh api graphql -F owner="${GITHUB_REPOSITORY%/*}" \
              -F name="${GITHUB_REPOSITORY#*/}" -F number="$PR_NUM" -f query='
                query ($owner: String!, $name: String!, $number: Int!) {
                  repository(owner: $owner, name: $name) {
                    pullRequest(number: $number) {
                      stackEntry { position }
                      stack { entries(first: 100) { nodes { position pullRequest { number closed } } } }
                    }
                  }
                }' \
              -q '.data.repository.pullRequest | .stackEntry.position as $pos
                | [(.stack.entries.nodes // [])[]
                   | select($pos != null and .pullRequest != null and .position > $pos
                     and (.pullRequest.closed | not))
                   | "#\(.pullRequest.number)"]
                | join(", ")'); then
            echo "::warning::Could not read the GitHub stack of PR #${PR_NUM}"
            ABOVE=""
          fi
          if [ -n "$ABOVE" ]; then
            MSG+=$'\n\n'"This PR is in a GitHub stack, and the open PRs above it (${ABOVE}) no longer include this commit, so they cannot merge until the stack is updated. With \`gh stack\`, run \`gh stack sync\` before you push again (\`gh stack push\` alone overwrites this commit; if this branch has new local commits, \`git pull --rebase\` it first). Or comment \`@pytorchbot rebase -b main\` on the top PR of the stack."
          fi
          gh pr comment "$PR_NUM" --body "$MSG"

      - name: Push lint changes (ghstack)
        if: steps.checkout.outcome == 'success' && env.IS_GHSTACK == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.MERGEBOT_TOKEN }}
          OAUTH_TOKEN: ${{ secrets.MERGEBOT_TOKEN }}
        run: |
          pip install ghstack
          cat > .ghstackrc <<EOF
          [ghstack]
          github_url=github.com
          github_username=pytorchmergebot
          remote_name=origin
          EOF
          ghstack
          gh pr comment "$PR_NUM" --body \
            "Successfully applied lint patches in ${GH_RUN_URL}. Please pull locally before pushing more changes."

      - name: Comment when there is nothing to apply
        if: needs.lint.result == 'success' && needs.lint.outputs.has_changes != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.MERGEBOT_TOKEN }}
        run: |
          gh pr comment "$PR_NUM" --repo "$GITHUB_REPOSITORY" --body \
            "No auto-fixable lint issues found, your PR is clean."

      - name: Comment on Canceled
        if: ${{ cancelled() }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.MERGEBOT_TOKEN }}
        run: |
          gh pr comment "$PR_NUM" --repo "$GITHUB_REPOSITORY" --body \
            "Apply lint patches was cancelled, see ${GH_RUN_URL}"

      - name: Comment on failure
        if: ${{ failure() || needs.lint.result == 'failure' }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.MERGEBOT_TOKEN }}
        run: |
          gh pr comment "$PR_NUM" --repo "$GITHUB_REPOSITORY" --body \
            "Failed to apply lint patches, see ${GH_RUN_URL}"
