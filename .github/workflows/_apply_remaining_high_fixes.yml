name: Apply remaining high fixes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: LSTM packed validation
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('torch/nn/modules/rnn.py')
          s = p.read_text()
          old = '''                hx = (h_zeros, c_zeros)\n            else:\n                # Each batch of the hidden state should match the input sequence that\n                # the user believes he/she is passing in.\n                hx = self.permute_hidden(hx, sorted_indices)'''
          new = '''                hx = (h_zeros, c_zeros)\n                self.check_forward_args(input, hx, batch_sizes)\n            else:\n                # Each batch of the hidden state should match the input sequence that\n                # the user believes he/she is passing in.\n                self.check_forward_args(input, hx, batch_sizes)\n                hx = self.permute_hidden(hx, sorted_indices)'''
          assert old in s
          p.write_text(s.replace(old, new, 1))
          PY
          git add torch/nn/modules/rnn.py
          git commit -m 'fix(rnn): validate packed LSTM forward arguments'

      - name: Smooth L1 validation
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('torch/_decomp/decompositions.py')
          s = p.read_text()
          old = '''def smooth_l1_loss(\n    self: Tensor,\n    target: Tensor,\n    reduction: int = Reduction.MEAN.value,\n    beta: float = 1.0,\n):\n    loss = (self - target).abs()'''
          new = '''def smooth_l1_loss(\n    self: Tensor,\n    target: Tensor,\n    reduction: int = Reduction.MEAN.value,\n    beta: float = 1.0,\n):\n    if beta < 0:\n        raise RuntimeError("smooth_l1_loss does not support negative values for beta.")\n    loss = (self - target).abs()'''
          assert old in s
          s = s.replace(old, new, 1)
          old = '''def smooth_l1_loss_backward(\n    grad_output: Tensor, self: Tensor, target: Tensor, reduction: int, beta: float\n):\n    norm = 1.0 / self.numel()'''
          new = '''def smooth_l1_loss_backward(\n    grad_output: Tensor, self: Tensor, target: Tensor, reduction: int, beta: float\n):\n    if beta < 0:\n        raise RuntimeError("smooth_l1_loss does not support negative values for beta.")\n    norm = 1.0 / self.numel()'''
          assert old in s
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          git add torch/_decomp/decompositions.py
          git commit -m 'fix(inductor): validate smooth_l1_loss beta in decomposition'

      - name: Dynamo class provenance
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('torch/_dynamo/variables/user_defined.py')
          s = p.read_text()
          old = '''    def generic_getattr(\n        self, tx: "InstructionTranslatorBase", name: str\n    ) -> VariableTracker:\n'''
          new = '''    def _class_vt(self, tx: "InstructionTranslatorBase") -> VariableTracker:\n        if self.source:\n            cls_source: Source | None = AttrSource(self.source, "__class__")\n        else:\n            cls_source = self.cls_source\n        return VariableTracker.build(tx, self.python_type(), cls_source)\n\n    tp_getset = {"__class__": GetSet(_class_vt, readonly_setter)}\n\n    def generic_getattr(\n        self, tx: "InstructionTranslatorBase", name: str\n    ) -> VariableTracker:\n'''
          assert old in s
          s = s.replace(old, new, 1)
          old = '''        if name == "__class__":\n            cls_source: Source | None = source\n            if source is None:\n                cls_source = self.cls_source\n            else:\n                cls_source = source\n            return VariableTracker.build(tx, type(self.value), cls_source)'''
          new = '''        if name == "__class__":\n            return self._class_vt(tx)'''
          assert old in s
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          git add torch/_dynamo/variables/user_defined.py
          git commit -m 'fix(dynamo): preserve class provenance for user objects'

      - name: take_along_dim bounds
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('aten/src/ATen/native/TensorAdvancedIndexing.cpp')
          s = p.read_text()
          old = '''  // Wrap negative indices to positive (Python-style)\n  indices_broadcasted =\n      indices_broadcasted.remainder(self_broadcasted.size(dim));'''
          new = '''  const auto dim_size = self_broadcasted.size(dim);\n  TORCH_CHECK_INDEX(\n      dim_size > 0,\n      "torch.take_along_dim(): cannot index dimension with size 0");\n  auto valid_indices =\n      (indices_broadcasted >= -dim_size) & (indices_broadcasted < dim_size);\n  TORCH_CHECK_INDEX(\n      valid_indices.all().item<bool>(),\n      "torch.take_along_dim(): index is out of bounds for dimension ",\n      dim,\n      " with size ",\n      dim_size);\n\n  // Wrap negative indices to positive (Python-style)\n  indices_broadcasted = indices_broadcasted.remainder(dim_size);'''
          assert old in s
          p.write_text(s.replace(old, new, 1))
          PY
          git add aten/src/ATen/native/TensorAdvancedIndexing.cpp
          git commit -m 'fix(indexing): reject out-of-bounds take_along_dim indices'
          git push origin main
