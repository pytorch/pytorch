# Owner(s): ["module: ci"]
#
# Runs pull-equivalent shards with TD disabled. Keep the copied matrices in sync
# with pull.yml. "unstable" is required for CI tooling to treat jobs as non-blocking.
name: td-holdout-unstable

on:
  # Capture the initial PR snapshot; synchronize events do not rerun it.
  pull_request:
    branches-ignore:
      - nightly
    types: [opened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}-${{ github.event_name == 'workflow_dispatch' }}
  # Required by repository policy. PR updates do not cancel this run because
  # `synchronize` is not a trigger for this workflow.
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read
  actions: read

jobs:
  get-label-type:
    name: get-label-type
    uses: pytorch/pytorch/.github/workflows/_runner-determinator.yml@main
    if: github.repository_owner == 'pytorch'
    with:
      triggering_actor: ${{ github.triggering_actor }}
      issue_owner: ${{ github.event.pull_request.user.login }}
      curr_branch: ${{ github.head_ref }}
      # Pin to the Meta fleet so shard timings and per-run cost stay comparable
      # across the holdout window.
      opt_out_experiments: lf

  # TD runs but is not acted on: force-no-td keeps every shard at 100% of tests.
  # The ranking is recorded so failures can be scored against what TD would have
  # picked, using the heuristic inputs as they existed at this commit.
  llm-td:
    if: github.repository_owner == 'pytorch'
    name: before-test
    uses: ./.github/workflows/llm_td_retrieval.yml

  target-determination:
    name: before-test
    uses: ./.github/workflows/target_determination.yml
    needs: llm-td
