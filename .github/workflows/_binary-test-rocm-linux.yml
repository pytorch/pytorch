# Owner(s): ["module: rocm"]
name: linux-binary-test-rocm

# Reusable ROCm manywheel binary test. The builder image is the job container,
# so no step needs a host docker CLI or an ECR login.

on:
  workflow_call:
    inputs:
      build_name:
        required: true
        type: string
      PYTORCH_ROOT:
        required: true
        type: string
      PACKAGE_TYPE:
        required: true
        type: string
      DESIRED_CUDA:
        required: true
        type: string
      INDEX_SUBFOLDER:
        required: false
        default: ""
        type: string
      GPU_ARCH_VERSION:
        required: true
        type: string
      GPU_ARCH_TYPE:
        required: true
        type: string
      DOCKER_IMAGE:
        required: true
        type: string
      DOCKER_IMAGE_TAG_PREFIX:
        required: true
        type: string
      DOCKER_IMAGE_REGISTRY_HOST:
        required: false
        default: ""
        type: string
        description: |
          Registry host prefix (with trailing slash) prepended to the
          pytorch/<image> path: empty for Docker Hub, or ghcr.io/. The image is
          pulled before any step runs, so it must not need an in-job login.
      DESIRED_PYTHON:
        required: false
        type: string
      runs_on:
        required: false
        type: string
        default: linux.rocm.gpu.mi350.1
      timeout-minutes:
        required: false
        type: number
        default: 240

permissions:
  contents: read

jobs:
  # Wait for the GHCR mirror on a CPU runner, so a missing tag never holds a
  # GPU runner until the container pull or pod start times out.
  resolve-image:
    runs-on: ubuntu-24.04
    permissions: {}
    outputs:
      docker-image: ${{ steps.resolve.outputs.docker-image }}
    steps:
      - name: Resolve builder image
        id: resolve
        shell: bash
        env:
          REGISTRY_HOST: ${{ inputs.DOCKER_IMAGE_REGISTRY_HOST }}
          REPOSITORY: pytorch/${{ inputs.DOCKER_IMAGE }}
          TAG: ${{ inputs.DOCKER_IMAGE_TAG_PREFIX }}
        run: |
          set -euo pipefail
          # The image becomes a GPU job container, so only accept builder names.
          if [[ ! "${REPOSITORY}" =~ ^pytorch/manylinux[A-Za-z0-9_.-]*builder$ || ! "${TAG}" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error::Refusing unexpected builder image '${REPOSITORY}:${TAG}'."
            exit 1
          fi
          image="${REGISTRY_HOST}${REPOSITORY}:${TAG}"
          case "${REGISTRY_HOST}" in
            "")
              ;;
            ghcr.io/)
              # build-manywheel-images may still be rebuilding the builder, so
              # wait up to 60 min for the tag, as get-docker-tag does for ECR.
              deadline=$(( SECONDS + 60 * 60 ))
              token_file="$(mktemp)"
              while true; do
                token_status="$(curl -sS -o "${token_file}" -w '%{http_code}' \
                  "https://ghcr.io/token?scope=repository:${REPOSITORY}:pull" || true)"
                if [[ "${token_status}" == "401" || "${token_status}" == "403" ]]; then
                  echo "::error::ghcr.io/${REPOSITORY} is not a public package (HTTP ${token_status}); a pytorch org admin must make it public."
                  exit 1
                fi
                status="token HTTP ${token_status}"
                if [[ "${token_status}" == "200" ]] && token="$(jq -er .token "${token_file}")"; then
                  status="$(curl -sS -o /dev/null -w 'HTTP %{http_code}' \
                    -H "Authorization: Bearer ${token}" \
                    -H 'Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.docker.distribution.manifest.v2+json' \
                    "https://ghcr.io/v2/${REPOSITORY}/manifests/${TAG}" || true)"
                fi
                if [[ "${status}" == "HTTP 200" ]]; then
                  break
                fi
                if (( SECONDS > deadline )); then
                  echo "::error::${image} was not mirrored within 60 min (${status}). build-manywheel-images mirrors ROCm builders on ciflow/docker runs; rerun ciflow/docker on this PR."
                  exit 1
                fi
                echo "${image} not pullable yet (${status}); retrying in 60s..."
                sleep 60
              done
              ;;
            *)
              echo "::error::Unsupported registry host '${REGISTRY_HOST}'; the job container cannot log in before it is pulled."
              exit 1
              ;;
          esac
          echo "docker-image=${image}" >> "${GITHUB_OUTPUT}"
          echo "Resolved ${image}"

  test:
    needs: resolve-image
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    container:
      image: ${{ needs.resolve-image.outputs.docker-image }}
      # `bin` is gid 1 on AlmaLinux (`daemon` on Ubuntu); the host `video` gid maps
      # there. Tests skip the GPU smoke for ROCm, so no render gid or isolation.
      options: --device=/dev/mem --device=/dev/kfd --device=/dev/dri --group-add video --group-add daemon --group-add bin
    env:
      PYTORCH_ROOT: ${{ github.workspace }}
      PACKAGE_TYPE: ${{ inputs.PACKAGE_TYPE }}
      DESIRED_CUDA: ${{ inputs.DESIRED_CUDA }}
      INDEX_SUBFOLDER: ${{ inputs.INDEX_SUBFOLDER }}
      GPU_ARCH_VERSION: ${{ inputs.GPU_ARCH_VERSION }}
      GPU_ARCH_TYPE: ${{ inputs.GPU_ARCH_TYPE }}
      DOCKER_IMAGE: ${{ needs.resolve-image.outputs.docker-image }}
      SKIP_ALL_TESTS: 1
      DESIRED_PYTHON: ${{ inputs.DESIRED_PYTHON }}
      ALPINE_IMAGE: "308535385114.dkr.ecr.us-east-1.amazonaws.com/tool/alpine"
      AWS_DEFAULT_REGION: us-east-1
      BINARY_ENV_FILE: /tmp/env
      BUILD_ENVIRONMENT: linux-binary-manywheel
      SHA1: ${{ github.event.pull_request.head.sha || github.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    permissions:
      contents: read
    steps:
      - name: Configure git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Checkout PyTorch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          submodules: recursive
          show-progress: false

      - uses: actions/download-artifact@65a9edc5881444af0b9093a5e628f2fe47ea3b2e # v4.1.7
        name: Download Build Artifacts
        with:
          name: ${{ inputs.build_name }}
          path: "${{ runner.temp }}/artifacts/"

      - name: Make test env permanent
        shell: bash
        run: |
          mkdir -p "$(dirname "$BINARY_ENV_FILE")"
          PYTORCH_FINAL_PACKAGE_DIR="${RUNNER_TEMP}/artifacts"
          {
            echo "PYTORCH_ROOT=${PYTORCH_ROOT}"
            echo "PACKAGE_TYPE=${PACKAGE_TYPE}"
            echo "DESIRED_CUDA=${DESIRED_CUDA}"
            echo "INDEX_SUBFOLDER=${INDEX_SUBFOLDER}"
            echo "GPU_ARCH_VERSION=${GPU_ARCH_VERSION}"
            echo "GPU_ARCH_TYPE=${GPU_ARCH_TYPE}"
            echo "DOCKER_IMAGE=${DOCKER_IMAGE}"
            echo "SKIP_ALL_TESTS=${SKIP_ALL_TESTS}"
            echo "DESIRED_PYTHON=${DESIRED_PYTHON}"
            echo "ALPINE_IMAGE=${ALPINE_IMAGE}"
            echo "AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION}"
            echo "BINARY_ENV_FILE=${BINARY_ENV_FILE}"
            echo "BUILD_ENVIRONMENT=${BUILD_ENVIRONMENT}"
            echo "BUILD_NAME=${{ inputs.build_name }}"
            echo "PR_NUMBER=${PR_NUMBER}"
            echo "PYTORCH_FINAL_PACKAGE_DIR=${PYTORCH_FINAL_PACKAGE_DIR}"
            echo "SHA1=${SHA1}"
          } >> "${GITHUB_ENV}"

      - name: Populate binary env
        shell: bash
        run: bash .ci/pytorch/binary_populate_env.sh

      - name: Test PyTorch binary
        shell: bash
        env:
          OUTPUT_SCRIPT: /run.sh
        run: |
          ln -sf "${GITHUB_WORKSPACE}" /pytorch
          ln -sf "${PYTORCH_FINAL_PACKAGE_DIR}" /final_pkgs
          bash .ci/pytorch/binary_linux_test.sh
          source "${BINARY_ENV_FILE}"
          bash -x /run.sh
