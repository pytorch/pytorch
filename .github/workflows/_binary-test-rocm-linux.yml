# Owner(s): ["module: rocm"]
name: linux-binary-test-rocm

# Reusable ROCm manywheel binary test. Every image runs via docker run.
# ECR images pull after ecr-login: ROCm runners have no instance profile.

on:
  workflow_call:
    inputs:
      build_name:
        required: true
        type: string
      PYTORCH_ROOT:
        required: true
        type: string
      PACKAGE_TYPE:
        required: true
        type: string
      DESIRED_CUDA:
        required: true
        type: string
      GPU_ARCH_VERSION:
        required: true
        type: string
      GPU_ARCH_TYPE:
        required: true
        type: string
      DOCKER_IMAGE:
        required: true
        type: string
      DOCKER_IMAGE_TAG_PREFIX:
        required: true
        type: string
      DOCKER_IMAGE_REGISTRY_HOST:
        required: false
        default: ""
        type: string
        description: |
          Registry host prefix (with trailing slash) prepended to the
          pytorch/<image> path. Empty means Docker Hub. A non-empty host
          (ECR) logs in first.
      DESIRED_PYTHON:
        required: false
        type: string
      runs_on:
        required: false
        type: string
        default: linux.rocm.gpu.gfx950.1
      timeout-minutes:
        required: false
        type: number
        default: 240

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    env:
      PYTORCH_ROOT: ${{ github.workspace }}
      PACKAGE_TYPE: ${{ inputs.PACKAGE_TYPE }}
      DESIRED_CUDA: ${{ inputs.DESIRED_CUDA }}
      GPU_ARCH_VERSION: ${{ inputs.GPU_ARCH_VERSION }}
      GPU_ARCH_TYPE: ${{ inputs.GPU_ARCH_TYPE }}
      DOCKER_IMAGE: ${{ format('{0}pytorch/{1}:{2}', inputs.DOCKER_IMAGE_REGISTRY_HOST, inputs.DOCKER_IMAGE, inputs.DOCKER_IMAGE_TAG_PREFIX) }}
      SKIP_ALL_TESTS: 1
      DESIRED_PYTHON: ${{ inputs.DESIRED_PYTHON }}
      ALPINE_IMAGE: "308535385114.dkr.ecr.us-east-1.amazonaws.com/tool/alpine"
      AWS_DEFAULT_REGION: us-east-1
      BINARY_ENV_FILE: /tmp/env
      BUILD_ENVIRONMENT: linux-binary-manywheel
      SHA1: ${{ github.event.pull_request.head.sha || github.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Checkout PyTorch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          submodules: recursive
          show-progress: false

      # Same host logic as setup-rocm. Pods pass an isolated render list;
      # daemon and bin cover the video gid's name inside each image OS.
      - name: ROCm set GPU_FLAG
        shell: bash
        run: |
          render_gid=$(cut -d: -f3 < <(grep render /etc/group))
          if [ -f "/etc/podinfo/gha-render-devices" ]; then
            DEVICE_FLAG=$(cat /etc/podinfo/gha-render-devices)
          else
            DEVICE_FLAG="--device /dev/dri"
          fi
          echo "GPU_FLAG=--device=/dev/mem --device=/dev/kfd ${DEVICE_FLAG} --group-add video --group-add ${render_gid} --group-add daemon --group-add bin --cap-add=SYS_PTRACE --security-opt seccomp=unconfined" >> "${GITHUB_ENV}"

      - name: Login to ECR
        if: inputs.DOCKER_IMAGE_REGISTRY_HOST != ''
        uses: ./.github/actions/ecr-login

      - uses: actions/download-artifact@65a9edc5881444af0b9093a5e628f2fe47ea3b2e # v4.1.7
        name: Download Build Artifacts
        with:
          name: ${{ inputs.build_name }}
          path: "${{ runner.temp }}/artifacts/"

      - name: Make test env permanent
        shell: bash
        run: |
          mkdir -p "$(dirname "$BINARY_ENV_FILE")"
          PYTORCH_FINAL_PACKAGE_DIR="${RUNNER_TEMP}/artifacts"
          {
            echo "PYTORCH_ROOT=${PYTORCH_ROOT}"
            echo "PACKAGE_TYPE=${PACKAGE_TYPE}"
            echo "DESIRED_CUDA=${DESIRED_CUDA}"
            echo "GPU_ARCH_VERSION=${GPU_ARCH_VERSION}"
            echo "GPU_ARCH_TYPE=${GPU_ARCH_TYPE}"
            echo "DOCKER_IMAGE=${DOCKER_IMAGE}"
            echo "SKIP_ALL_TESTS=${SKIP_ALL_TESTS}"
            echo "DESIRED_PYTHON=${DESIRED_PYTHON}"
            echo "ALPINE_IMAGE=${ALPINE_IMAGE}"
            echo "AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION}"
            echo "BINARY_ENV_FILE=${BINARY_ENV_FILE}"
            echo "BUILD_ENVIRONMENT=${BUILD_ENVIRONMENT}"
            echo "BUILD_NAME=${{ inputs.build_name }}"
            echo "PR_NUMBER=${PR_NUMBER}"
            echo "PYTORCH_FINAL_PACKAGE_DIR=${PYTORCH_FINAL_PACKAGE_DIR}"
            echo "SHA1=${SHA1}"
          } >> "${GITHUB_ENV}"

      - name: Test PyTorch binary
        shell: bash
        run: |
          set -x
          # shellcheck disable=SC2086
          container_name=$(docker run \
            ${GPU_FLAG:-} \
            -e BINARY_ENV_FILE \
            -e BUILD_ENVIRONMENT \
            -e DESIRED_CUDA \
            -e DESIRED_PYTHON \
            -e DOCKER_IMAGE \
            -e GITHUB_ACTIONS \
            -e GPU_ARCH_TYPE \
            -e GPU_ARCH_VERSION \
            -e PACKAGE_TYPE \
            -e PYTORCH_FINAL_PACKAGE_DIR \
            -e PYTORCH_ROOT \
            -e SKIP_ALL_TESTS \
            --tty \
            --detach \
            -v "${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}" \
            -v "${PYTORCH_FINAL_PACKAGE_DIR}:${PYTORCH_FINAL_PACKAGE_DIR}" \
            -w / \
            "${DOCKER_IMAGE}"
          )
          # Cleanup removes only this container; shared runners may run other jobs.
          echo "BINARY_CONTAINER=${container_name}" >> "${GITHUB_ENV}"
          docker exec -t -w "${PYTORCH_ROOT}" "${container_name}" bash -c "bash .ci/pytorch/binary_populate_env.sh"
          docker exec -t -w "${PYTORCH_ROOT}" -e OUTPUT_SCRIPT=/run.sh "${container_name}" bash -c "
            ln -sf '${GITHUB_WORKSPACE}' /pytorch
            ln -sf '${PYTORCH_FINAL_PACKAGE_DIR}' /final_pkgs
            bash .ci/pytorch/binary_linux_test.sh
          "
          docker exec -t "${container_name}" bash -c "source ${BINARY_ENV_FILE} && bash -x /run.sh"

      - name: Cleanup docker
        if: always()
        shell: bash
        run: |
          if [[ -n "${BINARY_CONTAINER:-}" ]]; then
            docker rm -f "${BINARY_CONTAINER}" || true
          fi
