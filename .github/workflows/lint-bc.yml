name: FA3 legacy inert wheel 752fdd4ab4f5bc574db1a3609e3efc8b
run-name: FA3 legacy inert wheel 752fdd4ab4f5bc574db1a3609e3efc8b
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: fa3-legacy-s3-752fdd4ab4f5bc574db1a3609e3efc8b
  cancel-in-progress: false
jobs:
  produce:
    if: ${{ github.repository == 'pytorch/pytorch' && github.repository_id == '65600975' && github.ref == 'refs/heads/d4l3k/fa3-legacy-s3-752fdd4ab4f5bc574db1a3609e3efc8b' && github.event_name == 'workflow_dispatch' && github.actor == 'd4l3k' && github.actor_id == '909104' && github.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Decode fixed inert metadata wheel
        shell: bash
        env:
          WHEEL_BASE64: 
        run: |
          set -euo pipefail
          mkdir "${RUNNER_TEMP}/fixed-wheel"
          printf '%s' "$WHEEL_BASE64" | base64 --decode > "${RUNNER_TEMP}/fixed-wheel/ci_health_752fdd4ab4f5bc574db1a3609e3efc8b-0.0.0.dev1795122696872-py3-none-any.whl"
          test "$(wc -c < "${RUNNER_TEMP}/fixed-wheel/ci_health_752fdd4ab4f5bc574db1a3609e3efc8b-0.0.0.dev1795122696872-py3-none-any.whl")" -eq 1354
          printf '%s  %s\n' '9cdbb86932e48afd1ae581fde24b58c5b3c2d321f54e08bf67a5505c3f187452' "${RUNNER_TEMP}/fixed-wheel/ci_health_752fdd4ab4f5bc574db1a3609e3efc8b-0.0.0.dev1795122696872-py3-none-any.whl" | sha256sum --check --status
      - name: Upload fixed inert wheel
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: flash-attn-3-wheel-cu128-windows_amd64
          path: ${{ runner.temp }}/fixed-wheel/ci_health_752fdd4ab4f5bc574db1a3609e3efc8b-0.0.0.dev1795122696872-py3-none-any.whl
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: false
          include-hidden-files: false
