        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' 'FA3 legacy boundary diagnostic 40ae5bacfe617d76282b3fd87b1b8e84' > "${RUNNER_TEMP}/fa3-legacy-boundary-40ae5bacfe617d76282b3fd87b1b8e84.txt"
