# Owner(s): ["module: ci"]
name: Check mergeability of ghstack PR

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches-ignore: [main, 'release/**']

jobs:
  ghstack-mergeability-check:
    if: github.repository_owner == 'pytorch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup git
        shell: bash
        run: |
          git config --global user.email "pytorchmergebot@users.noreply.github.com"
          git config --global user.name "PyTorch MergeBot"
          git fetch origin main:main

      - name: Wait for orig branch
        if: startsWith(github.base_ref, 'gh/') && endsWith(github.base_ref, '/base')
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          PREFIX="${BASE_REF%/base}"
          ORIG="origin/${PREFIX}/orig"
          echo "$PREFIX"

          # ghstack pushes orig after head (for a new PR, only after creating it),
          # so the checkout above can predate it. Wait until orig matches base and
          # head, using the tree equalities ghstack itself asserts.
          WAIT_SECONDS=300
          END_WAIT=$((SECONDS+WAIT_SECONDS))
          IN_SYNC=0

          while [ $SECONDS -lt $END_WAIT ]; do
            git fetch --prune origin "+refs/heads/${PREFIX}/*:refs/remotes/origin/${PREFIX}/*" || true
            if git rev-parse --verify --quiet "${ORIG}" > /dev/null &&
              [ "$(git rev-parse "${ORIG}^{tree}")" = "$(git rev-parse "origin/${PREFIX}/head^{tree}")" ] &&
              [ "$(git rev-parse "${ORIG}~1^{tree}")" = "$(git rev-parse "origin/${PREFIX}/base^{tree}")" ]; then
              IN_SYNC=1
              break
            fi
            echo "Waiting for ${ORIG} to match ${PREFIX}/base and ${PREFIX}/head..."
            sleep 10
          done

          if ! git rev-parse --verify --quiet "${ORIG}" > /dev/null; then
            echo "Branch ${PREFIX}/orig not found after ${WAIT_SECONDS} seconds."
            echo "Mergeability check failed for infrastructure reasons."
            exit 1
          fi
          if [ $IN_SYNC -eq 0 ]; then
            echo "${ORIG} still does not match after ${WAIT_SECONDS} seconds; letting trymerge report it."
          fi

          # ghstack pushes every orig branch of a stack in one push, after all head
          # branches, so the rest of the stack's branches are now current too.
          git fetch --prune origin

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
          architecture: x64

      - run: pip install pyyaml==6.0.2
        shell: bash

      - name: Verify mergeability
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUM: ${{ github.event.pull_request.number }}
        run: |
          set -ex
          python3 .github/scripts/trymerge.py --check-mergeability "${PR_NUM}"

      - name: Print debug info
        if: failure()
        shell: bash
        env:
          PR_NUM: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "# PR $PR_NUM is not mergeable into main"
            echo "To debug, run the diagnostic workflow:"
            echo "https://github.com/pytorch/test-infra/actions/workflows/pr-dependencies-check.yml"
          } >> "$GITHUB_STEP_SUMMARY"


concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}-${{ github.event_name == 'workflow_dispatch' }}
  cancel-in-progress: true
