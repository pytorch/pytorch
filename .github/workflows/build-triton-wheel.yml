# Owner(s): ["oncall: releng"]
name: Build Triton wheels

on:
  push:
    branches:
      - main
    tags:
      # NOTE: Binary build pipelines should only get triggered on release candidate builds
      # Release candidate tags look like: v1.11.0-rc1
      - v[0-9]+.[0-9]+.[0-9]+-rc[0-9]+
      - 'ciflow/triton_binaries/*'
    paths:
      - .github/workflows/build-triton-wheel.yml
      - .github/scripts/build_triton_wheel.py
      - .github/ci_commit_pins/triton.txt
      - .github/scripts/windows/install_vs2022.ps1
      - .github/scripts/windows/build_triton.bat
      - .ci/docker/ci_commit_pins/triton.txt
      - .ci/docker/ci_commit_pins/triton-xpu.txt
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/build-triton-wheel.yml
      - .github/scripts/build_triton_wheel.py
      - .github/ci_commit_pins/triton.txt
      - .github/scripts/windows/install_vs2022.ps1
      - .github/scripts/windows/build_triton.bat
      - .ci/docker/ci_commit_pins/triton.txt
      - .ci/docker/ci_commit_pins/triton-xpu.txt

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}-${{ github.event_name == 'workflow_dispatch' }}
  cancel-in-progress: true

jobs:
  select-runner:
    if: github.repository_owner == 'pytorch'
    uses: ./.github/workflows/_select-release-runner.yml

  build-wheel-cuda:
    if: github.repository_owner == 'pytorch'
    needs: select-runner
    uses: ./.github/workflows/_build-triton-wheel-linux.yml
    secrets: inherit
    with:
      device: "cuda"
      runs_on: ${{ needs.select-runner.outputs.x86 }}
      docker_image: "pytorch/manylinux2_28-builder:cpu"

  build-wheel-aarch64:
    if: github.repository_owner == 'pytorch'
    needs: select-runner
    uses: ./.github/workflows/_build-triton-wheel-linux.yml
    secrets: inherit
    with:
      device: "aarch64"
      runs_on: ${{ needs.select-runner.outputs.arm64 }}
      docker_image: "pytorch/manylinux2_28_aarch64-builder:cpu-aarch64"

  build-wheel-rocm:
    if: github.repository_owner == 'pytorch'
    needs: select-runner
    uses: ./.github/workflows/_build-triton-wheel-linux.yml
    secrets: inherit
    with:
      device: "rocm"
      runs_on: ${{ needs.select-runner.outputs.x86 }}
      docker_image: "pytorch/manylinux2_28-builder:rocm7.2"

  build-wheel-xpu:
    if: github.repository_owner == 'pytorch'
    needs: select-runner
    uses: ./.github/workflows/_build-triton-wheel-linux.yml
    secrets: inherit
    with:
      device: "xpu"
      runs_on: ${{ needs.select-runner.outputs.x86 }}
      docker_image: "pytorch/manylinux2_28-builder:cpu"

  build-wheel-win:
    if: github.repository_owner == 'pytorch'
    name: "Build Triton Windows Wheel"
    runs-on: "windows.4xlarge"
    strategy:
      fail-fast: false
      matrix:
        py_vers: [ "3.10", "3.11", "3.12", "3.13", "3.14", "3.14t", "3.15", "3.15t" ]
        device: ["xpu"]
    timeout-minutes: 40
    env:
      PY_VERS: ${{ matrix.py_vers }}
      BUILD_DEVICE: ${{ matrix.device }}
      VC_INSTALL_PATH: "C:\\MSVC-BuildTools-2022"
    steps:
      - name: Display EC2 information
        shell: bash
        run: |
          set -euo pipefail
          function get_ec2_metadata() {
            # Pulled from instance metadata endpoint for EC2
            # see https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/instancedata-data-retrieval.html
            category=$1
            curl -H "X-aws-ec2-metadata-token: $(curl -s -X PUT "http://169.254.169.254/latest/api/token" -H "X-aws-ec2-metadata-token-ttl-seconds: 30")" -fsSL "http://169.254.169.254/latest/meta-data/${category}"
          }
          echo "ami-id: $(get_ec2_metadata ami-id)"
          echo "instance-id: $(get_ec2_metadata instance-id)"
          echo "instance-type: $(get_ec2_metadata instance-type)"
          echo "system info $(uname -a)"
      - name: "[FB EMPLOYEES] Enable SSH (Click me for login details)"
        uses: pytorch/test-infra/.github/actions/setup-ssh@main
        continue-on-error: true
        with:
          github-secret: ${{ secrets.GITHUB_TOKEN }}
      - name: Enable git long paths and symlinks on Windows and disable fsmonitor daemon
        shell: bash
        run: |
          git config --global core.longpaths true
          git config --global core.symlinks true
          # https://git-scm.com/docs/git-fsmonitor--daemon.  The daemon could lock
          # the directory on Windows and prevent GHA from checking out as reported
          # in https://github.com/actions/checkout/issues/1018
          git config --global core.fsmonitor false
      - name: Checkout PyTorch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          submodules: false
          path: pytorch
          show-progress: false
      - name: Clean PyTorch checkout
        run: |
          # Remove any artifacts from the previous checkouts
          git clean -fxd
        working-directory: pytorch
      - name: Enable long paths on Windows and install VS2022 17.13.2
        env:
          VC_YEAR: 2022
          VC_VERSION: 17.13.2
        shell: bash
        working-directory: pytorch
        run: |
          powershell .github/scripts/windows/install_vs2022.ps1
      - name: Build Triton wheel
        env:
          IS_RELEASE_TAG: ${{ startsWith(github.event.ref, 'refs/tags/v') }}
        working-directory: pytorch
        shell: bash
        run: |
          set -x
          export RELEASE=""
          if [[ "${IS_RELEASE_TAG}" == true ]]; then
            export RELEASE="--release"
          fi
          .github/scripts/windows/build_triton.bat
          mkdir -p "${RUNNER_TEMP}/artifacts/"
          mv ./*.whl "${RUNNER_TEMP}/artifacts/"
      - uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.0
        with:
          name: triton-wheel-win-${{ matrix.py_vers }}-${{ matrix.device }}
          if-no-files-found: error
          path: ${{ runner.temp }}/artifacts/*

  # One upload job per published package, each gated only on its own builds.
  upload-wheel-triton:
    needs: [build-wheel-cuda, build-wheel-aarch64]
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/_upload-triton-wheel.yml
    secrets: inherit
    with:
      artifact_pattern: triton-wheel-*-cuda-manylinux_2_28_x86_64
      extra_artifact_pattern: triton-wheel-*-aarch64-manylinux_2_28_x86_64

  upload-wheel-rocm:
    needs: build-wheel-rocm
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/_upload-triton-wheel.yml
    secrets: inherit
    with:
      artifact_pattern: triton-wheel-*-rocm-manylinux_2_28_x86_64

  upload-wheel-xpu:
    needs: [build-wheel-xpu, build-wheel-win]
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/_upload-triton-wheel.yml
    secrets: inherit
    with:
      artifact_pattern: triton-wheel-*-xpu-manylinux_2_28_x86_64
      extra_artifact_pattern: triton-wheel-win-*
