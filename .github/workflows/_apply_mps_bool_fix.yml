name: Apply MPS bool fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch upstream PR
        run: |
          git remote add pytorch https://github.com/pytorch/pytorch.git
          git fetch pytorch 47a43e0ac5ebe768ae78bd88ff8a406764fc94c6

      - name: Apply header
        run: |
          git checkout 47a43e0ac5ebe768ae78bd88ff8a406764fc94c6 -- aten/src/ATen/native/mps/kernels/LinearAlgebra.h
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add aten/src/ATen/native/mps/kernels/LinearAlgebra.h
          git commit -m 'fix(mps): treat linear algebra bool params as bool'

      - name: Apply Metal kernel
        run: |
          git checkout 47a43e0ac5ebe768ae78bd88ff8a406764fc94c6 -- aten/src/ATen/native/mps/kernels/LinearAlgebra.metal
          git add aten/src/ATen/native/mps/kernels/LinearAlgebra.metal
          git commit -m 'fix(mps): use bool linear algebra kernel flags'

      - name: Apply host code
        run: |
          git checkout 47a43e0ac5ebe768ae78bd88ff8a406764fc94c6 -- aten/src/ATen/native/mps/operations/LinearAlgebra.mm
          git add aten/src/ATen/native/mps/operations/LinearAlgebra.mm
          git commit -m 'fix(mps): pass linear algebra bool params as bool'
          git push origin main
