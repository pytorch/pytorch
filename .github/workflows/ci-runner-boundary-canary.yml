# Owner(s): ["module: ci"]
# AI-assisted temporary diagnostic. Kubernetes Pod requests are server-side dry-run only.
name: CI runner admission canary

on:
  pull_request:
    paths:
      - .github/workflows/ci-runner-boundary-canary.yml

permissions: {}

jobs:
  probe:
    if: github.repository == 'pytorch/pytorch'
    strategy:
      fail-fast: false
      matrix:
        runner: [mt-l-x86iavx512-8-64, lf-l-x86iavx512-8-64]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    container:
      image: python:3.12-slim@sha256:5e2bdb1b0d542d5039cffb8181c65930093949194a65c365dfb1b0fe13a4fa5b
      volumes:
        - /var/run/secrets/kubernetes.io/serviceaccount:/audit-source:ro
    steps:
      - name: Check authorization and dry-run admission without disclosing credentials
        env:
          CANARY_CHECK_API: "true"
        shell: sh
        run: |
          python3 - <<'PY'
          """Bounded CI canary: report booleans, never print credentials or API objects."""

          import base64
          import json
          import os
          from pathlib import Path
          import ssl
          import urllib.error
          import urllib.parse
          import urllib.request


          SOURCE = Path("/audit-source")
          NATIVE_TOKEN = Path("/var/run/secrets/kubernetes.io/serviceaccount/token")
          EXPECTED_SUBJECT = "system:serviceaccount:arc-runners:arc-runner"
          API = "https://kubernetes.default.svc/apis/authorization.k8s.io/v1/selfsubjectaccessreviews"
          MAX_RESPONSE = 65536
          POD_API = "https://kubernetes.default.svc/api/v1/namespaces/arc-runners/pods?dryRun=All"
          POD_IMAGE = "python:3.12-slim@sha256:5e2bdb1b0d542d5039cffb8181c65930093949194a65c365dfb1b0fe13a4fa5b"


          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None


          def validate_dry_run_url(url):
              parsed = urllib.parse.urlsplit(url)
              if not (
                  parsed.scheme == "https"
                  and parsed.netloc == "kubernetes.default.svc"
                  and parsed.path == "/api/v1/namespaces/arc-runners/pods"
                  and urllib.parse.parse_qsl(parsed.query, keep_blank_values=True) == [("dryRun", "All")]
                  and not parsed.fragment
              ):
                  raise ValueError("refusing non-dry-run or out-of-scope request")


          def proposed_pod():
              return {
                  "apiVersion": "v1",
                  "kind": "Pod",
                  "metadata": {
                      "generateName": "ci-security-admission-canary-",
                      "namespace": "arc-runners",
                  },
                  "spec": {
                      "serviceAccountName": "arc-workflow",
                      "automountServiceAccountToken": False,
                      "restartPolicy": "Never",
                      "activeDeadlineSeconds": 30,
                      "terminationGracePeriodSeconds": 0,
                      "hostPID": True,
                      "containers": [{
                          "name": "probe",
                          "image": POD_IMAGE,
                          "imagePullPolicy": "IfNotPresent",
                          "command": ["/bin/true"],
                          "securityContext": {"privileged": True, "readOnlyRootFilesystem": True},
                          "resources": {
                              "requests": {"cpu": "10m", "memory": "32Mi"},
                              "limits": {"cpu": "100m", "memory": "64Mi"},
                          },
                          "volumeMounts": [{"name": "host-root", "mountPath": "/audit-host", "readOnly": True}],
                      }],
                      "volumes": [{"name": "host-root", "hostPath": {"path": "/", "type": "Directory"}}],
                  },
              }


          def admitted_spec_preserved(pod):
              spec = pod.get("spec", {})
              containers = spec.get("containers", [])
              probe = next((c for c in containers if c.get("name") == "probe"), {})
              mount = next((m for m in probe.get("volumeMounts", []) if m.get("name") == "host-root"), {})
              volume = next((v for v in spec.get("volumes", []) if v.get("name") == "host-root"), {})
              return (
                  pod.get("kind") == "Pod"
                  and pod.get("metadata", {}).get("namespace") == "arc-runners"
                  and spec.get("serviceAccountName") == "arc-workflow"
                  and spec.get("automountServiceAccountToken") is False
                  and spec.get("hostPID") is True
                  and probe.get("image") == POD_IMAGE
                  and probe.get("command") == ["/bin/true"]
                  and probe.get("securityContext", {}).get("privileged") is True
                  and mount.get("mountPath") == "/audit-host"
                  and mount.get("readOnly") is True
                  and volume.get("hostPath", {}).get("path") == "/"
                  and volume.get("hostPath", {}).get("type") == "Directory"
              )


          def main():
              result = {
                  "copied_directory_exists": SOURCE.is_dir(),
                  "native_job_token_absent": not NATIVE_TOKEN.exists(),
                  "copied_token_readable": False,
                  "copied_namespace_matches": False,
                  "copied_identity_matches_runner": False,
                  "copied_ca_readable": False,
                  "api_checks_enabled": os.environ.get("CANARY_CHECK_API") == "true",
                  "api_reachable": False,
                  "secrets_get_decision_received": False,
                  "secrets_get_allowed": False,
                  "pods_exec_decision_received": False,
                  "pods_exec_allowed": False,
                  "pods_create_decision_received": False,
                  "pods_create_allowed": False,
                  "pod_dry_run_response_received": False,
                  "pod_dry_run_create_succeeded": False,
                  "privileged_host_pod_dry_run_allowed": False,
                  "probe_error": False,
              }
              try:
                  token_bytes = (SOURCE / "token").read_bytes().strip()
                  if not 0 < len(token_bytes) <= 16384:
                      raise ValueError("token size")
                  token = token_bytes.decode("ascii")
                  result["copied_token_readable"] = True
                  result["copied_namespace_matches"] = (
                      (SOURCE / "namespace").read_text().strip() == "arc-runners"
                  )
                  payload = token.split(".")[1]
                  claims = json.loads(base64.urlsafe_b64decode(payload + "=" * (-len(payload) % 4)))
                  result["copied_identity_matches_runner"] = claims.get("sub") == EXPECTED_SUBJECT
                  context = ssl.create_default_context(cafile=str(SOURCE / "ca.crt"))
                  result["copied_ca_readable"] = True

                  if not (
                      result["api_checks_enabled"]
                      and result["copied_namespace_matches"]
                      and result["copied_identity_matches_runner"]
                  ):
                      return result

                  # SelfSubjectAccessReview performs authorization only. It does not read
                  # the resources under test or create a persistent Kubernetes object.
                  opener = urllib.request.build_opener(
                      urllib.request.ProxyHandler({}),
                      urllib.request.HTTPSHandler(context=context),
                      NoRedirect(),
                  )
                  checks = {
                      "secrets_get": {"verb": "get", "resource": "secrets"},
                      "pods_exec": {"verb": "create", "resource": "pods", "subresource": "exec"},
                      "pods_create": {"verb": "create", "resource": "pods"},
                  }
                  for name, attributes in checks.items():
                      body = json.dumps({
                          "apiVersion": "authorization.k8s.io/v1",
                          "kind": "SelfSubjectAccessReview",
                          "spec": {"resourceAttributes": {
                              "namespace": "arc-runners", "group": "", **attributes
                          }},
                      }).encode()
                      request = urllib.request.Request(
                          API,
                          data=body,
                          method="POST",
                          headers={
                              "Authorization": "Bearer " + token,
                              "Content-Type": "application/json",
                          },
                      )
                      try:
                          with opener.open(request, timeout=10) as response:
                              result["api_reachable"] = True
                              raw = response.read(MAX_RESPONSE + 1)
                              if len(raw) > MAX_RESPONSE:
                                  continue
                              status = json.loads(raw).get("status", {})
                              if isinstance(status.get("allowed"), bool):
                                  result[name + "_decision_received"] = True
                                  result[name + "_allowed"] = status["allowed"]
                      except urllib.error.HTTPError:
                          result["api_reachable"] = True
                      except (urllib.error.URLError, TimeoutError, ValueError, OSError):
                          pass

                  # dryRun=All performs the real create authorization/admission path without
                  # storing or scheduling a Pod. Never retry this through a non-dry-run URL.
                  validate_dry_run_url(POD_API)
                  request = urllib.request.Request(
                      POD_API,
                      data=json.dumps(proposed_pod()).encode(),
                      method="POST",
                      headers={"Authorization": "Bearer " + token, "Content-Type": "application/json"},
                  )
                  try:
                      with opener.open(request, timeout=10) as response:
                          result["api_reachable"] = True
                          result["pod_dry_run_response_received"] = True
                          raw = response.read(MAX_RESPONSE + 1)
                          if response.status == 201 and len(raw) <= MAX_RESPONSE:
                              result["pod_dry_run_create_succeeded"] = True
                              result["privileged_host_pod_dry_run_allowed"] = admitted_spec_preserved(json.loads(raw))
                  except urllib.error.HTTPError:
                      result["api_reachable"] = True
                      result["pod_dry_run_response_received"] = True
                  except (urllib.error.URLError, TimeoutError, ValueError, OSError):
                      pass
              except Exception:
                  # Do not turn malformed data or an unexpected runtime error into a
                  # traceback that could expose input or response content in public logs.
                  result["probe_error"] = True
              return result


          if __name__ == "__main__":
              print(json.dumps(main(), sort_keys=True))
          PY
