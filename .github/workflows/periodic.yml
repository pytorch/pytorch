      docker-image: ${{ needs.linux-jammy-cuda13_0-py3_11-gcc11-build.outputs.docker-image }}
      test-matrix: |
        { include: [
          { config: "aoti_cross_compile_for_windows", shard: 1, num_shards: 1, runner: "${{ needs.get-label-type.outputs.label-type }}l-x86aavx2-11-41-l4", win_torch_wheel_artifact: "win-vs2022-cuda13.0-py3" },
