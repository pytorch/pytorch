      - target-determination
      - get-label-type
    with:
      build-environment: ${{ needs.linux-jammy-cuda13_0-py3_11-gcc11-build.outputs.build-environment }}
      docker-image: ${{ needs.linux-jammy-cuda13_0-py3_11-gcc11-build.outputs.docker-image }}
      test-matrix: ${{ needs.linux-jammy-cuda13_0-py3_11-gcc11-build.outputs.test-matrix }}
      python-version: "3.11"
      compiler: gcc11
      cuda-version: "13.0"
