  linux-jammy-cuda13_0-cudnn9-py3_11-clang20-build:
    name: linux-jammy-cuda13.0-cudnn9-py3.11-clang20
    uses: ./.github/workflows/_linux-build.yml
    needs: get-label-type
    with:
      runner_prefix: "${{ needs.get-label-type.outputs.label-type }}"
      build-environment: linux-jammy-cuda13.0-cudnn9-py3.11-clang20
      docker-image-name: ci-image:pytorch-linux-jammy-cuda13.0-cudnn9-py3.11-clang20
      ci-docker-hash: ${{ needs.get-label-type.outputs.ci-docker-hash }}
      cuda-arch-list: '7.5 8.0'
      test-matrix: |
        { include: [
          { config: "default", shard: 1, num_shards: 1 },
        ]}
      python-version: "3.11"
      compiler: clang20
      cuda-version: "13.0"
    secrets: inherit

  libtorch-linux-jammy-cuda13_0-py3_11-gcc11-debug-build:
    name: libtorch-linux-jammy-cuda13.0-py3.11-gcc11-debug
