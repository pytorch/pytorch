# Owner(s): ["oncall: distributed"]
name: torchtitan-pin-current-controls

on:
  push:
    branches:
      - triton-pin-202417-titan-current-20261106
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.sha }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read
  actions: read

jobs:
  current-native-controls:
    name: current-original-sft-default-pins
    if: github.repository_owner == 'pytorch'
    uses: ./.github/workflows/_linux-test.yml
    with:
      build-environment: linux-jammy-cuda13.2-py3.12-gcc11-torchtitan
      docker-image: 308535385114.dkr.ecr.us-east-1.amazonaws.com/pytorch/ci-image:pytorch-linux-jammy-cuda13.2-cudnn9-py3.12-gcc11-c3702f0a877b3a11803c36cd75a39a8cdf31865d
      timeout-minutes: 180
      test-matrix: |
        { include: [
          { config: "torchtitan_current_pin_controls", shard: 1, num_shards: 1, runner: "mt-l-x86aavx2-189-704-a10g-8" }
        ]}
      python-version: '3.12'
      compiler: gcc11
      cuda-version: '13.2'
    secrets: inherit
