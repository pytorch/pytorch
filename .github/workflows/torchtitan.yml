# Owner(s): ["oncall: distributed"]
name: torchtitan-pin-boundary

on:
  push:
    branches:
      - triton-pin-202417-titan-boundary-20261105
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.sha }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read
  actions: read

jobs:
  get-label-type:
    name: get-label-type
    uses: pytorch/pytorch/.github/workflows/_runner-determinator.yml@main
    if: github.repository_owner == 'pytorch'
    with:
      triggering_actor: ${{ github.triggering_actor }}
      issue_owner: ${{ github.event.pull_request.user.login || github.event.issue.user.login }}
      curr_branch: ${{ github.head_ref || github.ref_name }}
      curr_ref_type: ${{ github.ref_type }}
      check_experiments: lf

  native-boundary-controls:
    name: original-strict-sft-native-boundary
    uses: ./.github/workflows/_linux-test.yml
    needs: get-label-type
    with:
      # Reuse the original native build and original CUDA image. This branch
      # changes test orchestration only; its native Torch SHA is asserted.
      build-environment: linux-jammy-cuda13.2-py3.12-gcc11-torchtitan
      docker-image: 308535385114.dkr.ecr.us-east-1.amazonaws.com/pytorch/ci-image:pytorch-linux-jammy-cuda13.2-cudnn9-py3.12-gcc11-6ce4e7e1f7fed4d82afb7c896fec3dd3ce7d6b17
      artifact-run-id: '40737992620'
      timeout-minutes: 180
      test-matrix: |
        { include: [
          { config: "torchtitan_triton_pin_boundary_controls", shard: 1, num_shards: 1, runner: "lf-l-x86aavx2-45-167-a10g-4" }
        ]}
      python-version: '3.12'
      compiler: gcc11
      cuda-version: '13.2'
    secrets: inherit
