# Owner(s): ["oncall: releng"]
name: build-linux-magma

on:
  push:
    branches:
      main
    paths:
      - .ci/magma/*
      - .ci/magma/package_files/*
      - .github/workflows/build-magma-linux.yml
  pull_request:
    paths:
      - .ci/magma/*
      - .ci/magma/package_files/*
      - .github/workflows/build-magma-linux.yml

defaults:
  run:
    shell: bash -x -e -l {0}
env:
  BUILD_ENVIRONMENT: build-linux-magma
  IN_CI: 1
  IS_GHA: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}-${{ github.event_name == 'workflow_dispatch' }}
  cancel-in-progress: true

jobs:
  check-ci:
    if: github.repository_owner == 'pytorch'
    uses: ./.github/workflows/_check-ci.yml

  select-runner:
    if: github.repository_owner == 'pytorch'
    uses: ./.github/workflows/_select-release-runner.yml

  build-linux-magma:
    needs: [check-ci, select-runner]
    if: github.repository_owner == 'pytorch'
    # The publish step below holds an S3 write role, so protected refs build on
    # the release-isolated pool rather than the shared one.
    runs-on: ${{ needs.select-runner.outputs.x86 }}
    # An OSDC pod has no docker daemon, so the job runs in the builder image the
    # Makefile would otherwise `docker run` itself.
    container:
      image: pytorch/almalinux-builder:cuda${{ matrix.desired_cuda }}-main
    permissions:
      id-token: write
    strategy:
      matrix:
        include:
          - { cuda_version: "134", desired_cuda: "13.4" }
          - { cuda_version: "132", desired_cuda: "13.2" }
          - { cuda_version: "130", desired_cuda: "13.0" }
          - { cuda_version: "129", desired_cuda: "12.9" }
          - { cuda_version: "128", desired_cuda: "12.8" }
          - { cuda_version: "126", desired_cuda: "12.6" }
    steps:
      # The workspace is created as uid 1001 and the image runs as root, so git
      # refuses to read it without this.
      - name: Allow git to read the workspace
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"
      - name: Checkout PyTorch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build Magma Cuda
        working-directory: .ci/magma
        run: |
          # Produces artifacts under magma/output/linux-64/magma-cuda*.bz2
          make magma-cuda${{ matrix.cuda_version }} IN_CONTAINER=1
      - name: Save as artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          path: .ci/magma/output/linux-64/magma-cuda*.bz2
          name: artifact_${{ matrix.cuda_version }}
      - name: Configure AWS credentials(PyTorch account)
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: aws-actions/configure-aws-credentials@ececac1a45f3b08a01d2dd070d28d111c5fe6722 # v4.1.0
        with:
          role-to-assume: arn:aws:iam::308535385114:role/gha_workflow_s3_ossci_linux_windows_read_write
          aws-region: us-east-1
      - name: Set DRY_RUN
        if: ${{ github.event_name == 'push' && github.event.ref == 'refs/heads/main' }}
        run: |
            echo "DRY_RUN=disabled" >> "$GITHUB_ENV"
      - name: Upload binaries
        shell: bash
        env:
            PKG_DIR: ".ci/magma/output/linux-64/"
            TARGET_OS: "linux"
            PKG_INCLUDE: "magma-cuda*.tar.bz2"
        run: |
            set -ex
            bash .github/scripts/upload_aws_ossci.sh
