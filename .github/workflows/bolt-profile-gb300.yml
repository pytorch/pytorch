# Owner(s): ["module: cuda"]

# Collects LLVM BOLT profiles with tools/bolt/collect_profiles.sh from the
# unoptimized libraries and wheels of an aarch64 CUDA nightly: instrument on CPU,
# run the workload with each Python version on GB300, then merge, validate and
# package a torch.tar.zst for cmake/bolt_profiles on CPU. All jobs use the
# nightly's manylinux image, which has every Python version and its llvm-bolt.

name: BOLT profile collection (GB300)

on:
  pull_request:
    paths:
      - .github/workflows/bolt-profile-gb300.yml
      - tools/bolt/**
  workflow_dispatch:
    inputs:
      nightly-run-id:
        description: linux-aarch64-binary-manywheel run to take the libraries and wheels from (default the latest nightly that has them)
        required: false
        type: string
      cuda:
        description: CUDA variant of that build, as in its prebolt-cuda-aarch64-<cuda> artifact
        required: false
        type: string
        default: "13_4"
      python-versions:
        description: Python versions to profile, e.g. "3.12 3.14t". The first provides the profiles of the other libraries and libtorch_python.yaml, each other one a libtorch_python-<SOABI>.yaml
        required: false
        type: string
        default: "3.12"
      workload-variant:
        description: synthetic_workload.py --variant
        required: false
        type: string
        default: all
      workload-steps:
        description: synthetic_workload.py --steps for each Python version
        required: false
        type: string
        default: "45000"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}-${{ github.event_name == 'workflow_dispatch' }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  NIGHTLY_RUN_ID: ${{ inputs.nightly-run-id }}
  BOLT_CUDA: ${{ inputs.cuda || '13_4' }}
  BOLT_PYTHON_VERSIONS: ${{ inputs.python-versions || '3.12' }}
  BOLT_WORKLOAD_VARIANT: ${{ inputs.workload-variant || 'all' }}
  BOLT_WORKLOAD_STEPS: ${{ inputs.workload-steps || '45000' }}
  # Caps the workload of each Python version.
  BOLT_WORKLOAD_MAX_SECONDS: "1200"

jobs:
  get-label-type:
    if: github.repository_owner == 'pytorch'
    name: get-label-type
    uses: pytorch/pytorch/.github/workflows/_runner-determinator.yml@main
    with:
      triggering_actor: ${{ github.triggering_actor }}
      issue_owner: ${{ github.event.pull_request.user.login || github.event.issue.user.login }}
      curr_branch: ${{ github.head_ref || github.ref_name }}
      curr_ref_type: ${{ github.ref_type }}
      check_experiments: lf

  instrument:
    name: instrument
    needs: get-label-type
    runs-on: ${{ needs.get-label-type.outputs.label-type }}l-arm64g4-16-62
    container:
      image: pytorch/manylinux2_28_aarch64-builder:cpu-aarch64
    timeout-minutes: 60
    outputs:
      nightly-run-id: ${{ steps.nightly.outputs.run-id }}
      pythons: ${{ steps.pythons.outputs.matrix }}
    steps:
      - name: Checkout PyTorch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: List the Python versions
        id: pythons
        shell: bash
        run: |
          # The wheel and interpreter of each version, e.g. py3_14t and cp314-cp314t.
          read -ra versions <<< "${BOLT_PYTHON_VERSIONS}"
          for version in "${versions[@]}"; do
            minor="${version#3.}"
            matrix+="${matrix:+, }{\"python\": \"${version}\", \"wheel\": \"py3_${minor}\", \"cpython\": \"cp3${minor%t}-cp3${minor}\"}"
          done
          echo "matrix=[${matrix:-}]" | tee -a "${GITHUB_OUTPUT}"

      - name: Find the nightly build
        id: nightly
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ -z "${NIGHTLY_RUN_ID}" ]]; then
            NIGHTLY_RUN_ID="$(/opt/python/cp312-cp312/bin/python3 - << 'EOF'
          import json, os, sys, urllib.request
          def get(path):
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/actions/{path}",
                  headers={"Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}"},
              )
              with urllib.request.urlopen(request) as response:
                  return json.load(response)
          name = f"prebolt-cuda-aarch64-{os.environ['BOLT_CUDA']}"
          workflow = "generated-linux-aarch64-binary-manywheel-nightly.yml"
          for run in get(f"workflows/{workflow}/runs?branch=nightly&per_page=20")["workflow_runs"]:
              artifacts = get(f"runs/{run['id']}/artifacts?name={name}")["artifacts"]
              if any(not artifact["expired"] for artifact in artifacts):
                  print(run["id"])
                  break
          else:
              sys.exit(f"no recent nightly has the {name} artifact")
          EOF
            )"
          fi
          echo "Libraries and wheels of ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${NIGHTLY_RUN_ID}"
          echo "run-id=${NIGHTLY_RUN_ID}" >> "${GITHUB_OUTPUT}"

      - name: Download the unoptimized libraries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: prebolt-cuda-aarch64-${{ env.BOLT_CUDA }}
          path: prebolt
          run-id: ${{ steps.nightly.outputs.run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Instrument the torch libraries
        shell: bash
        run: tools/bolt/collect_profiles.sh instrument prebolt bolt-instrumented

      - name: Upload instrumented libraries
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.0
        with:
          name: bolt-instrumented
          path: bolt-instrumented/
          if-no-files-found: error
          retention-days: 3

  profile:
    name: profile (${{ matrix.python }}, nv-l-arm64grace-16-200-gb300)
    needs: instrument
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.instrument.outputs.pythons) }}
    runs-on: nv-l-arm64grace-16-200-gb300
    container:
      image: pytorch/manylinux2_28_aarch64-builder:cpu-aarch64
      options: --gpus all -e NVIDIA_DRIVER_CAPABILITIES=compute,utility
    timeout-minutes: 60
    steps:
      - name: Checkout PyTorch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download instrumented libraries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: bolt-instrumented
          path: bolt-instrumented

      - name: Download the wheel
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: manywheel-${{ matrix.wheel }}-cuda-aarch64-${{ env.BOLT_CUDA }}
          path: wheels
          run-id: ${{ needs.instrument.outputs.nightly-run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run the workload
        id: run
        shell: bash
        run: |
          # HOME is / in the container, which pip and Triton cannot write to.
          export HOME="${RUNNER_TEMP}"
          venv="${RUNNER_TEMP}/venv"
          "/opt/python/${{ matrix.cpython }}/bin/python3" -m venv "${venv}"
          "${venv}/bin/pip" install --quiet wheels/*.whl --index-url "https://download.pytorch.org/whl/nightly/cu${BOLT_CUDA/_/}"
          "${venv}/bin/pip" install --quiet numpy
          PATH="${venv}/bin:${PATH}" tools/bolt/collect_profiles.sh run bolt-instrumented bolt-run

      - name: Upload raw profiles
        if: always() && steps.run.conclusion && steps.run.conclusion != 'skipped'
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.0
        with:
          name: bolt-run-${{ matrix.python }}
          path: bolt-run/
          if-no-files-found: warn
          retention-days: 3

  finalize:
    name: finalize
    needs: [get-label-type, instrument, profile]
    # Also package the profiles of the Python versions that ran when others failed.
    if: ${{ !cancelled() && needs.profile.result != 'skipped' }}
    runs-on: ${{ needs.get-label-type.outputs.label-type }}l-arm64g4-16-62
    container:
      image: pytorch/manylinux2_28_aarch64-builder:cpu-aarch64
    timeout-minutes: 60
    steps:
      - name: Checkout PyTorch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download the unoptimized libraries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: prebolt-cuda-aarch64-${{ env.BOLT_CUDA }}
          path: prebolt
          run-id: ${{ needs.instrument.outputs.nightly-run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download raw profiles
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: bolt-run-*
          merge-multiple: true
          path: bolt-run

      - name: Merge, convert and validate the profiles
        id: finalize
        shell: bash
        run: tools/bolt/collect_profiles.sh finalize prebolt bolt-run bolt-profiles

      - name: Upload BOLT profiles
        if: always() && steps.finalize.conclusion && steps.finalize.conclusion != 'skipped'
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.0
        with:
          name: bolt-profiles-cuda${{ env.BOLT_CUDA }}
          path: bolt-profiles/
          if-no-files-found: warn
          retention-days: 14
