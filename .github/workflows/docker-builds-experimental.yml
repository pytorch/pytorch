# Owner(s): ["module: ci"]
name: docker-builds-experimental

# Docker images for experimental, non-mainstream architectures live here rather
# than in docker-builds.yml. They are maintained by the teams contributing those
# architectures, and a break in one of them should not turn the mainstream
# x86/aarch64 docker-builds check red. See #175193.

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - release/*
    tags:
      - ciflow/docker/*
    paths:
      - .ci/docker/**
      - .github/workflows/docker-builds-experimental.yml
      - .lintrunner.toml
  schedule:
    - cron: 1 3 * * 3

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}-${{ github.ref_type == 'branch' && github.sha }}-${{ github.event_name == 'workflow_dispatch' && github.run_id }}-${{ github.event_name == 'schedule' }}
  cancel-in-progress: true

env:
  ECR_REGISTRY: 308535385114.dkr.ecr.us-east-1.amazonaws.com
  ECR_REPOSITORY: pytorch/ci-image
  GHCR_REPOSITORY: ghcr.io/pytorch/ci-image
  AWS_DEFAULT_REGION: us-east-1

permissions:
  id-token: write
  contents: read

jobs:
  docker-build:
    if: github.repository_owner == 'pytorch'
    environment: ${{ (github.ref == 'refs/heads/main' || startsWith(github.event.ref, 'refs/tags/v')) && 'docker-build' || '' }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        buildkit_addr: ["tcp://buildkitd-amd64.buildkit:1234"]
        docker-image-name: [
          pytorch-linux-noble-riscv64-py3.12-gcc14-cross-build
        ]
        include:
          - docker-image-name: pytorch-linux-noble-riscv64-py3.12-gcc14-cross-build
            runner_label: mt-l-x86iavx512-8-64
    runs-on: ${{ matrix.runner_label || 'mt-l-x86iavx512-8-64' }}
    container:
      image: ghcr.io/actions/actions-runner:latest
    steps:
      - name: Setup Linux
        uses: pytorch/pytorch/.github/actions/setup-linux@main
        with:
          use-arc: true
          submodules: false
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to ECR
        uses: pytorch/pytorch/.github/actions/ecr-login@main
        with:
          aws-role-to-assume: arn:aws:iam::308535385114:role/arc

      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref_type == 'branch'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: pytorch
          password: ${{ secrets.GHCR_PAT }}

      - name: Set up Docker Buildx (remote, no bootstrap)
        shell: bash
        # NOT docker/setup-buildx-action: it runs `buildx inspect --bootstrap`,
        # whose ~20s connect timeout fails on a cold/burst start before the
        # autoscaled pool can add a pod. `create` (no --bootstrap) just registers
        # the builder; build.sh retries the build to wait out scale-up.
        run: |
          set -ex
          docker buildx create \
            --name remote-buildkit \
            --driver remote \
            --use \
            "${{ matrix.buildkit_addr }}"

      - name: Compute image tag
        id: tag
        shell: bash
        run: |
          set -ex
          DOCKER_TAG=$(git rev-parse HEAD:.ci/docker)
          DOCKER_IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}:${{ matrix.docker-image-name }}-${DOCKER_TAG}"
          echo "docker-tag=${DOCKER_TAG}" >> "${GITHUB_OUTPUT}"
          echo "docker-image=${DOCKER_IMAGE}" >> "${GITHUB_OUTPUT}"

      - name: Build and push to ECR
        env:
          REMOTE_BUILDKIT: "1"
          CI: "1"
          DOCKER_IMAGE: ${{ steps.tag.outputs.docker-image }}
        shell: bash
        working-directory: .ci/docker
        run: |
          set -ex
          ./build.sh "${{ matrix.docker-image-name }}" -t "${DOCKER_IMAGE}"

      - name: Mirror image to GHCR
        if: github.event_name == 'push' && github.ref_type == 'branch'
        env:
          ECR_DOCKER_IMAGE: ${{ steps.tag.outputs.docker-image }}
          DOCKER_TAG: ${{ steps.tag.outputs.docker-tag }}
        shell: bash
        run: |
          set -ex
          # `buildx imagetools create` does a server-side cross-registry copy,
          # so we don't need a local pull/push round-trip.
          docker buildx imagetools create \
            -t "${GHCR_REPOSITORY}:${{ matrix.docker-image-name }}-${DOCKER_TAG}" \
            -t "${GHCR_REPOSITORY}:${{ matrix.docker-image-name }}" \
            "${ECR_DOCKER_IMAGE}"
