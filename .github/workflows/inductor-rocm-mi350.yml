# Owner(s): ["module: ci"]
# Temporary exact-native A100 memory controls for draft #202417.
name: inductor-rocm-mi350
on:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-a100-memory-${{ github.sha }}
  cancel-in-progress: true
permissions:
  id-token: write
  contents: read
  actions: read
jobs:
  get-label-type:
    uses: pytorch/pytorch/.github/workflows/_runner-determinator.yml@main
    with:
      triggering_actor: ${{ github.triggering_actor }}
      issue_owner: ${{ github.triggering_actor }}
      curr_branch: ${{ github.ref_name }}
      curr_ref_type: ${{ github.ref_type }}
      opt_out_experiments: lf
  a100-memory-controls:
    needs: get-label-type
    uses: ./.github/workflows/_linux-test.yml
    with:
      build-environment: linux-jammy-cuda13.2-py3.11-gcc11-sm80
      docker-image: 308535385114.dkr.ecr.us-east-1.amazonaws.com/pytorch/ci-image:pytorch-linux-jammy-cuda13.2-cudnn9-py3-gcc11-inductor-benchmarks-c3702f0a877b3a11803c36cd75a39a8cdf31865d
      timeout-minutes: 120
      python-version: "3.11"
      compiler: gcc11
      cuda-version: "13.2"
      test-matrix: |
        { include: [
          { config: "a100_memory_controls", shard: 1, num_shards: 1, runner: "${{ needs.get-label-type.outputs.label-type }}l-x86iavx512-11-125-a100" }
        ]}
    secrets: inherit
