# Owner(s): ["module: rocm"]
# Unneeded for CI: trunk.yml covers the same ROCm testing.
# Kept in-repo for metrics; auto-triggers below are commented out.
# workflow_dispatch remains for manual runs.
name: inductor-rocm-mi350

on:
  #push:
  #  branches:
  #    - main
  #    - release/*
  #  tags:
  #    - ciflow/inductor-rocm-mi350/*
  workflow_dispatch:
    inputs:
      hardware:
        type: choice
        default: mi350
        options: [mi350, l4, both, mi350-boundary, mi350-amd-boundary, mi350-bisect, mi350-fusion, mi350-verify, mi350-sub-verify, mi350-conv, l4-ptxas, l4-boundary, l4-verify]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.hardware }}-${{ github.event.pull_request.number || github.sha }}-${{ github.event_name == 'workflow_dispatch' }}-${{ github.event_name == 'schedule' }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read
  actions: read

jobs:
  target-determination:
    if: github.repository_owner == 'pytorch'
    name: before-test
    uses: ./.github/workflows/target_determination.yml

  get-label-type:
    name: get-label-type
    uses: pytorch/pytorch/.github/workflows/_runner-determinator.yml@main
    if: ${{ (github.event_name != 'schedule' || github.repository == 'pytorch/pytorch') && github.repository_owner == 'pytorch' }}
    with:
      triggering_actor: ${{ github.triggering_actor }}
      issue_owner: ${{ github.event.pull_request.user.login || github.event.issue.user.login }}
      curr_branch: ${{ github.head_ref || github.ref_name }}
      curr_ref_type: ${{ github.ref_type }}
      opt_out_experiments: lf
      check_experiments: amd-dpx

  linux-noble-rocm-py3_11-inductor-build:
    if: github.event.inputs.hardware != 'l4' && github.event.inputs.hardware != 'l4-ptxas' && github.event.inputs.hardware != 'l4-boundary' && github.event.inputs.hardware != 'l4-verify' && github.event.inputs.hardware != 'mi350-bisect' && github.event.inputs.hardware != 'mi350-fusion' && github.event.inputs.hardware != 'mi350-verify' && github.event.inputs.hardware != 'mi350-sub-verify' && github.event.inputs.hardware != 'mi350-conv'
    name: linux-noble-rocm-py3.11-mi350
    uses: ./.github/workflows/_linux-build.yml
    needs: get-label-type
    with:
      runner_prefix: "mt-"
      ci-docker-hash: ${{ needs.get-label-type.outputs.ci-docker-hash }}
      build-environment: linux-noble-rocm-py3.11-mi350
      docker-image-name: ci-image:pytorch-linux-noble-rocm-n-py3.11
      rocm-arch-list: gfx950
      test-matrix: |
        { include: [
          { config: "${{ github.event.inputs.hardware == 'mi350-amd-boundary' && 'triton_pin_mi350_amd_boundary' || github.event.inputs.hardware == 'mi350-boundary' && 'triton_pin_mi350_boundary' || 'triton_pin_controls' }}", shard: 1, num_shards: 1, runner: "${{ needs.get-label-type.outputs.amd-dpx-label-type }}linux.rocm.gpu.gfx950.1" },
        ]}
    secrets: inherit

  linux-noble-rocm-py3_11-inductor-test:
    if: github.event.inputs.hardware != 'l4' && github.event.inputs.hardware != 'l4-ptxas' && github.event.inputs.hardware != 'l4-boundary' && github.event.inputs.hardware != 'l4-verify' && github.event.inputs.hardware != 'mi350-bisect' && github.event.inputs.hardware != 'mi350-fusion' && github.event.inputs.hardware != 'mi350-verify' && github.event.inputs.hardware != 'mi350-sub-verify' && github.event.inputs.hardware != 'mi350-conv'
    name: linux-noble-rocm-py3.11-mi350
    uses: ./.github/workflows/_rocm-test.yml
    needs: linux-noble-rocm-py3_11-inductor-build
    with:
      build-environment: ${{ needs.linux-noble-rocm-py3_11-inductor-build.outputs.build-environment }}
      docker-image: ${{ needs.linux-noble-rocm-py3_11-inductor-build.outputs.docker-image }}
      test-matrix:  ${{ needs.linux-noble-rocm-py3_11-inductor-build.outputs.test-matrix }}
    secrets: inherit

  l4-abs-build:
    if: github.event.inputs.hardware == 'l4' || github.event.inputs.hardware == 'both'
    name: linux-jammy-cuda13.4-py3.11-gcc11-l4-controls
    uses: ./.github/workflows/_linux-build.yml
    needs: get-label-type
    with:
      runner_prefix: "${{ needs.get-label-type.outputs.label-type }}"
      build-environment: linux-jammy-cuda13.4-py3.11-gcc11
      docker-image-name: ci-image:pytorch-linux-jammy-cuda13.4-cudnn9-py3-gcc11
      # The original failing L4 job used this already published image.
      ci-docker-hash: 6ce4e7e1f7fed4d82afb7c896fec3dd3ce7d6b17
      cuda-arch-list: '7.5 8.9'
      test-matrix: |
        { include: [
          { config: "triton_pin_l4_controls", shard: 1, num_shards: 1, runner: "${{ needs.get-label-type.outputs.label-type }}l-x86aavx2-11-41-l4" },
        ]}
    secrets: inherit

  mi350-native-bisect:
    if: github.event.inputs.hardware == 'mi350-bisect'
    name: native-mi350-bisect
    uses: ./.github/workflows/_rocm-test.yml
    needs: get-label-type
    with:
      build-environment: linux-noble-rocm-py3.11-mi350
      docker-image: 308535385114.dkr.ecr.us-east-1.amazonaws.com/pytorch/ci-image:pytorch-linux-noble-rocm-n-py3.11-aac29703b520a9906ec6f0b4d3a07872b2601a25
      artifact-run-id: '40865583043'
      timeout-minutes: 300
      test-matrix: |
        { include: [
          { config: "triton_pin_mi350_bisect", shard: 1, num_shards: 1, runner: "${{ needs.get-label-type.outputs.amd-dpx-label-type }}linux.rocm.gpu.gfx950.1" },
        ]}
    secrets: inherit

  mi350-native-fusion:
    if: github.event.inputs.hardware == 'mi350-fusion' || github.event.inputs.hardware == 'mi350-verify' || github.event.inputs.hardware == 'mi350-sub-verify' || github.event.inputs.hardware == 'mi350-conv'
    name: native-mi350-fusion-controls
    uses: ./.github/workflows/_rocm-test.yml
    needs: get-label-type
    with:
      build-environment: linux-noble-rocm-py3.11-mi350
      docker-image: 308535385114.dkr.ecr.us-east-1.amazonaws.com/pytorch/ci-image:pytorch-linux-noble-rocm-n-py3.11-aac29703b520a9906ec6f0b4d3a07872b2601a25
      artifact-run-id: "${{ (github.event.inputs.hardware == 'mi350-sub-verify' || github.event.inputs.hardware == 'mi350-conv') && '40915231984' || '40865583043' }}"
      timeout-minutes: 120
      test-matrix: |
        { include: [
          { config: "${{ github.event.inputs.hardware == 'mi350-conv' && 'triton_pin_conv_controls' || github.event.inputs.hardware == 'mi350-sub-verify' && 'triton_pin_sub_expectations' || github.event.inputs.hardware == 'mi350-verify' && 'triton_pin_mi350_verify' || 'triton_pin_mi350_fusion' }}", shard: 1, num_shards: 1, runner: "${{ needs.get-label-type.outputs.amd-dpx-label-type }}linux.rocm.gpu.gfx950.1" },
        ]}
    secrets: inherit

  l4-abs-test:
    if: github.event.inputs.hardware == 'l4' || github.event.inputs.hardware == 'both'
    name: linux-jammy-cuda13.4-py3.11-gcc11-l4-controls
    uses: ./.github/workflows/_linux-test.yml
    needs: l4-abs-build
    with:
      build-environment: ${{ needs.l4-abs-build.outputs.build-environment }}
      docker-image: ${{ needs.l4-abs-build.outputs.docker-image }}
      test-matrix: ${{ needs.l4-abs-build.outputs.test-matrix }}
    secrets: inherit

  l4-ptxas-controls:
    if: github.event.inputs.hardware == 'l4-ptxas' || github.event.inputs.hardware == 'l4-boundary' || github.event.inputs.hardware == 'l4-verify'
    name: native-l4-ptxas-controls
    uses: ./.github/workflows/_linux-test.yml
    needs: get-label-type
    with:
      build-environment: linux-jammy-cuda13.4-py3.11-gcc11
      docker-image: 308535385114.dkr.ecr.us-east-1.amazonaws.com/pytorch/ci-image:pytorch-linux-jammy-cuda13.4-cudnn9-py3-gcc11-6ce4e7e1f7fed4d82afb7c896fec3dd3ce7d6b17
      artifact-run-id: '40865583043'
      timeout-minutes: 120
      test-matrix: |
        { include: [
          { config: "${{ github.event.inputs.hardware == 'l4-verify' && 'triton_pin_l4_verify' || github.event.inputs.hardware == 'l4-boundary' && 'triton_pin_l4_boundary' || 'triton_pin_l4_ptxas_controls' }}", shard: 1, num_shards: 1, runner: "${{ needs.get-label-type.outputs.label-type }}l-x86aavx2-11-41-l4" },
        ]}
    secrets: inherit
