name: Apply uniform dtype correctness fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch decomposition
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('torch/_decomp/decompositions.py')
          s = p.read_text()
          old = '''    generator: torch.Generator | None = None,\n):\n    return prims._uniform_helper('''
          new = '''    generator: torch.Generator | None = None,\n):\n    torch._check_not_implemented(\n        x.dtype.is_floating_point or x.dtype.is_complex,\n        lambda: f"\\\"check_uniform_bounds\\\" not implemented for '{x.dtype}'",\n    )\n    return prims._uniform_helper('''
          assert old in s
          p.write_text(s.replace(old, new, 1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add torch/_decomp/decompositions.py
          git commit -m 'fix(decomp): reject integral uniform dtypes'

      - name: Patch meta rand
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('torch/_meta_registrations.py')
          s = p.read_text()
          old = '''def meta_rand_default(size, *, dtype=None, layout=None, device=None, pin_memory=None):\n    return torch.empty('''
          new = '''def meta_rand_default(size, *, dtype=None, layout=None, device=None, pin_memory=None):\n    resolved_dtype = torch.get_default_dtype() if dtype is None else dtype\n    torch._check_not_implemented(\n        resolved_dtype.is_floating_point or resolved_dtype.is_complex,\n        lambda: f"\\\"check_uniform_bounds\\\" not implemented for '{resolved_dtype}'",\n    )\n    return torch.empty('''
          assert old in s
          p.write_text(s.replace(old, new, 1))
          PY
          git add torch/_meta_registrations.py
          git commit -m 'fix(meta): reject integral rand dtypes'

      - name: Add regression test
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('test/test_decomp.py')
          s = p.read_text()
          marker = '''    instantiate_device_type_tests(DecompOneOffTests, globals())'''
          test = '''    @onlyNativeDeviceTypes\n    @skipIfCrossRef\n    @parametrize("dtype", [torch.int64, torch.int32, torch.uint8, torch.bool])\n    def test_uniform_integral_dtype(self, device, dtype):\n        from torch._subclasses.fake_tensor import FakeTensorMode\n\n        def rand_like(x):\n            return torch.rand_like(x)\n\n        msg = "check_uniform_bounds"\n        x = torch.ones(4, device=device, dtype=dtype)\n        with self.assertRaisesRegex(NotImplementedError, msg):\n            rand_like(x)\n        with self.assertRaisesRegex(NotImplementedError, msg):\n            torch.compile(rand_like, backend="aot_eager")(x)\n        with self.assertRaisesRegex(NotImplementedError, msg):\n            torch.rand(4, device=device, dtype=dtype)\n        with FakeTensorMode(), self.assertRaisesRegex(NotImplementedError, msg):\n            torch.rand(4, device=device, dtype=dtype)\n\n'''
          assert marker in s
          if 'def test_uniform_integral_dtype' not in s:
              s = s.replace(marker, test + marker, 1)
          p.write_text(s)
          PY
          git add test/test_decomp.py
          git commit -m 'test(decomp): cover integral uniform dtypes'
          git push origin main
