# Owner(s): ["module: ci"]
name: docker-builds

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - release/*
    tags:
      - ciflow/docker/*
    paths:
      - .ci/docker/**
      - .github/workflows/docker-builds.yml
      - .lintrunner.toml
  schedule:
    - cron: 1 3 * * 3

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}-${{ github.ref_type == 'branch' && github.sha }}-${{ github.event_name == 'workflow_dispatch' && github.run_id }}-${{ github.event_name == 'schedule' }}
  cancel-in-progress: true

env:
  ECR_REGISTRY: 308535385114.dkr.ecr.us-east-1.amazonaws.com
  # PR (ciflow/docker) builds push to these. Builds in the docker-build
  # environment (main and release) push to the trusted repos instead, which
  # only they can write, and copy the images here for PR jobs.
  ECR_REPOSITORY: pytorch/ci-image
  GHCR_REPOSITORY: ghcr.io/pytorch/ci-image
  ECR_TRUSTED_REPOSITORY: pytorch/trusted/ci-image
  GHCR_TRUSTED_REPOSITORY: ghcr.io/pytorch/ci-image-trusted
  AWS_DEFAULT_REGION: us-east-1

permissions:
  id-token: write
  contents: read

jobs:
  check-ci:
    if: github.repository_owner == 'pytorch'
    uses: ./.github/workflows/_check-ci.yml

  docker-build:
    needs: check-ci
    if: github.repository_owner == 'pytorch'
    environment: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/') || startsWith(github.event.ref, 'refs/tags/v')) && 'docker-build' || '' }}
    permissions:
      id-token: write
      contents: read
      packages: write
    env:
      # Same condition as `environment` above
      TRUSTED_BUILD: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/') || startsWith(github.event.ref, 'refs/tags/v')) && 'true' || 'false' }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        # BuildKit is a *remote* builder running on OSDC; the orchestrator
        # runner just streams context and waits, so the smallest pool fits
        # both amd64 and arm64 builds. Only `buildkit_addr` differs per arch.
        buildkit_addr: ["tcp://buildkitd-amd64.buildkit:1234"]
        docker-image-name: [
          pytorch-linux-jammy-cuda12.6-cudnn9-py3.11-gcc11,
          pytorch-linux-jammy-cuda13.2-cudnn9-py3-gcc11,
          pytorch-linux-jammy-cuda13.2-cudnn9-py3-gcc11-inductor-benchmarks,
          pytorch-linux-jammy-cuda13.2-cudnn9-py3.12-gcc11,
          pytorch-linux-jammy-cuda13.4-cudnn9-py3-gcc11,
          pytorch-linux-jammy-cuda13.4-cudnn9-py3-gcc11-inductor-benchmarks,
          pytorch-linux-jammy-cuda13.4-cudnn9-py3.12-gcc11,
          pytorch-linux-jammy-cuda13.5-cudnn9-py3-gcc11,
          pytorch-linux-jammy-cuda13.2-cudnn9-py3.12-gcc11-vllm,
          pytorch-linux-jammy-cuda13.2-cudnn9-py3.12-gcc11-inductor-benchmarks,
          pytorch-linux-jammy-py3.11-clang21,
          pytorch-linux-jammy-py3.12-clang21,
          pytorch-linux-jammy-py3.13-clang21,
          pytorch-linux-jammy-py3.14-clang21,
          pytorch-linux-jammy-py3.14t-clang21,
          pytorch-linux-jammy-py3.15-clang21,
          pytorch-linux-jammy-rocm-n-py3,
          pytorch-linux-noble-rocm-n-py3.11,
          pytorch-linux-noble-rocm-preview-py3.11,
          pytorch-linux-jammy-rocm-n-py3-benchmarks,
          pytorch-linux-jammy-cuda13.2-cudnn9-py3.11-clang20,
          pytorch-linux-jammy-cuda13.4-cudnn9-py3.11-clang20,
          pytorch-linux-jammy-py3-gcc11-inductor-benchmarks,
          pytorch-linux-jammy-py3.12-halide,
          pytorch-linux-jammy-cuda13.2-py3.12-pallas,
          pytorch-linux-jammy-tpu-py3.12-pallas,
          pytorch-linux-jammy-xpu-n-1-py3,
          pytorch-linux-noble-xpu-n-py3,
          pytorch-linux-noble-xpu-n-py3-client,
          pytorch-linux-noble-xpu-n-py3-inductor-benchmarks,
          pytorch-linux-jammy-linter,
          pytorch-linux-jammy-cuda13.2-cudnn9-py3.11-linter,
          # TODO: Re-enable me when docker pin update happens
          # pytorch-linux-jammy-py3-clang21-executorch,
          pytorch-linux-jammy-py3.12-triton-cpu,
          pytorch-linux-noble-riscv64-py3.12-gcc14-cross-build
        ]
        include:
          - docker-image-name: pytorch-linux-jammy-aarch64-cuda13.2-cudnn9-py3.11-gcc13
            buildkit_addr: "tcp://buildkitd-arm64.buildkit:1234"
            runner_label: mt-l-arm64g4-16-62
          - docker-image-name: pytorch-linux-jammy-aarch64-cuda13.2-cudnn9-py3.12-gcc13
            buildkit_addr: "tcp://buildkitd-arm64.buildkit:1234"
            runner_label: mt-l-arm64g4-16-62
          - docker-image-name: pytorch-linux-jammy-aarch64-cuda13.4-cudnn9-py3.12-gcc13
            buildkit_addr: "tcp://buildkitd-arm64.buildkit:1234"
            runner_label: mt-l-arm64g4-16-62
          - docker-image-name: pytorch-linux-jammy-aarch64-py3.11-gcc13
            buildkit_addr: "tcp://buildkitd-arm64.buildkit:1234"
            runner_label: mt-l-arm64g4-16-62
          - docker-image-name: pytorch-linux-jammy-aarch64-py3.11-clang21
            buildkit_addr: "tcp://buildkitd-arm64.buildkit:1234"
            runner_label: mt-l-arm64g4-16-62
          - docker-image-name: pytorch-linux-jammy-aarch64-py3.11-gcc13-inductor-benchmarks
            buildkit_addr: "tcp://buildkitd-arm64.buildkit:1234"
            timeout-minutes: 600
            runner_label: mt-l-arm64g4-16-62
    runs-on: ${{ matrix.runner_label || 'mt-l-x86iavx512-8-64' }}
    container:
      image: ghcr.io/actions/actions-runner:latest
    steps:
      - name: Setup Linux
        uses: pytorch/pytorch/.github/actions/setup-linux@main
        with:
          use-arc: true
          submodules: false
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to ECR
        uses: pytorch/pytorch/.github/actions/ecr-login@main
        with:
          aws-role-to-assume: ${{ env.TRUSTED_BUILD == 'true' && 'arn:aws:iam::308535385114:role/ci-image-trusted-push' || 'arn:aws:iam::308535385114:role/arc' }}

      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref_type == 'branch'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: pytorch
          password: ${{ secrets.GHCR_PAT }}

      # GHCR_PAT lives in the docker-build environment, which ciflow/docker PR
      # runs can't use, so they push with GITHUB_TOKEN instead
      - name: Login to GHCR (ciflow/docker)
        if: startsWith(github.ref, 'refs/tags/ciflow/docker/')
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx (remote, no bootstrap)
        shell: bash
        # NOT docker/setup-buildx-action: it runs `buildx inspect --bootstrap`,
        # whose ~20s connect timeout fails on a cold/burst start before the
        # autoscaled pool can add a pod. `create` (no --bootstrap) just registers
        # the builder; build.sh retries the build to wait out scale-up.
        run: |
          set -ex
          docker buildx create \
            --name remote-buildkit \
            --driver remote \
            --use \
            "${{ matrix.buildkit_addr }}"

      - name: Compute image tag
        id: tag
        shell: bash
        run: |
          set -ex
          DOCKER_TAG=$(git rev-parse HEAD:.ci/docker)
          PR_DOCKER_IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}:${{ matrix.docker-image-name }}-${DOCKER_TAG}"
          if [[ "${TRUSTED_BUILD}" == "true" ]]; then
            DOCKER_IMAGE="${ECR_REGISTRY}/${ECR_TRUSTED_REPOSITORY}:${{ matrix.docker-image-name }}-${DOCKER_TAG}"
          else
            DOCKER_IMAGE="${PR_DOCKER_IMAGE}"
          fi
          {
            echo "docker-tag=${DOCKER_TAG}"
            echo "docker-image=${DOCKER_IMAGE}"
            echo "pr-docker-image=${PR_DOCKER_IMAGE}"
          } >> "${GITHUB_OUTPUT}"

      # The tag is the .ci/docker tree hash, so an existing tag already holds a
      # build of these sources. Rebuilding it (the cron, a revert that restores
      # an old tree, a push that only touches this workflow, a ciflow/docker PR
      # that leaves .ci/docker alone) re-resolves every unpinned package and
      # silently changes the image under jobs already using the tag. To pick up
      # newer packages, change a file under .ci/docker so the tag changes. Only a
      # clear "not found" means build: any other registry error is retried and
      # then fails the job rather than risk overwriting an image in use.
      - name: Check whether the image already exists
        id: exists
        env:
          DOCKER_IMAGE: ${{ steps.tag.outputs.docker-image }}
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if err=$(docker buildx imagetools inspect "${DOCKER_IMAGE}" 2>&1 > /dev/null); then
              echo "exists=true" >> "${GITHUB_OUTPUT}"
              echo "::notice::${DOCKER_IMAGE} already exists, not rebuilding it"
              exit 0
            fi
            if grep -qiE 'not found|manifest unknown' <<< "${err}"; then
              exit 0
            fi
            echo "${err}" >&2
            if (( attempt < 3 )); then
              sleep $((attempt * 15))
            fi
          done
          echo "::error::Could not tell whether ${DOCKER_IMAGE} exists, so not rebuilding it in place"
          exit 1

      - name: Build and push to ECR
        if: steps.exists.outputs.exists != 'true'
        env:
          REMOTE_BUILDKIT: "1"
          CI: "1"
          DOCKER_IMAGE: ${{ steps.tag.outputs.docker-image }}
        shell: bash
        working-directory: .ci/docker
        run: |
          set -ex
          ./build.sh "${{ matrix.docker-image-name }}" -t "${DOCKER_IMAGE}"

      # PR jobs pull from pytorch/ci-image. This also replaces any image a PR
      # pushed under this tag.
      - name: Copy the trusted image for PR jobs
        if: env.TRUSTED_BUILD == 'true'
        env:
          DOCKER_IMAGE: ${{ steps.tag.outputs.docker-image }}
          PR_DOCKER_IMAGE: ${{ steps.tag.outputs.pr-docker-image }}
        shell: bash
        run: |
          set -ex
          docker buildx imagetools create -t "${PR_DOCKER_IMAGE}" "${DOCKER_IMAGE}"

      - name: Mirror image to GHCR
        if: github.event_name == 'push'
        env:
          ECR_DOCKER_IMAGE: ${{ steps.tag.outputs.docker-image }}
          DOCKER_TAG: ${{ steps.tag.outputs.docker-tag }}
        shell: bash
        run: |
          set -ex
          tags=(-t "${GHCR_REPOSITORY}:${{ matrix.docker-image-name }}-${DOCKER_TAG}")
          # Only main/release move the floating tag and write the trusted
          # package, never a ciflow/docker PR
          if [[ "${TRUSTED_BUILD}" == "true" ]]; then
            tags+=(
              -t "${GHCR_REPOSITORY}:${{ matrix.docker-image-name }}"
              -t "${GHCR_TRUSTED_REPOSITORY}:${{ matrix.docker-image-name }}-${DOCKER_TAG}"
              -t "${GHCR_TRUSTED_REPOSITORY}:${{ matrix.docker-image-name }}"
            )
          fi
          # `buildx imagetools create` does a server-side cross-registry copy,
          # so we don't need a local pull/push round-trip.
          docker buildx imagetools create "${tags[@]}" "${ECR_DOCKER_IMAGE}"

      - name: Generate output
        if: contains(matrix.docker-image-name, 'rocm')
        run: |
          docker_image_name="${{ matrix.docker-image-name }}"
          docker_image_tag="${{ steps.tag.outputs.pr-docker-image }}"
          echo "${docker_image_name}=${docker_image_tag}" >> "docker-builds-output-${docker_image_name}.txt"

      - name: Upload artifacts
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.0
        if: contains(matrix.docker-image-name, 'rocm')
        with:
          name: docker-builds-artifacts-${{ matrix.docker-image-name }}
          retention-days: 14
          path: ./docker-builds-output-${{ matrix.docker-image-name }}.txt
