# Owner(s): ["module: ci"]
name: target-determination

on:
  workflow_call:

permissions:
  id-token: write
  contents: read

jobs:

  get-label-type:
    name: get-label-type
    # Don't run on forked repos
    if: github.repository_owner == 'pytorch'
    uses: pytorch/pytorch/.github/workflows/_runner-determinator.yml@main
    with:
      triggering_actor: ${{ github.triggering_actor }}
      issue_owner: ${{ github.event.pull_request.user.login || github.event.issue.user.login }}
      curr_branch: ${{ github.head_ref || github.ref_name }}
      curr_ref_type: ${{ github.ref_type }}
      check_experiments: "lf"

  target-determination:
    # Don't run on forked repos
    if: github.repository_owner == 'pytorch'
    runs-on: "${{ needs.get-label-type.outputs.label-type }}l-x86iavx512-8-64"
    needs: get-label-type
    container:
      image: ghcr.io/actions/actions-runner:latest
    steps:
      - name: Setup Linux
        uses: pytorch/pytorch/.github/actions/setup-linux@main
        with:
          submodules: false
          use-arc: true

      - name: Setup uv
        uses: pytorch/test-infra/.github/actions/setup-uv@main
        with:
          enable-cache: true

      - name: Configure AWS credentials
        id: aws-creds
        # Fork PRs can't assume the OIDC role; fall back to GHA-native artifacts below.
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7
        with:
          role-to-assume: arn:aws:iam::308535385114:role/arc
          aws-region: us-east-1

      - name: Get workflow job id
        id: get-job-id
        uses: pytorch/pytorch/.github/actions/get-workflow-job-id@main
        if: always()
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download pytest cache
        uses: pytorch/pytorch/.github/actions/pytest-cache-download@main
        # Public-read bucket; works without creds (anonymous fallback) on fork PRs.
        continue-on-error: true
        with:
          cache_dir: .pytest_cache
          job_identifier: ${{ github.workflow }}

      - name: Download LLM Artifacts
        uses: actions/download-artifact@65a9edc5881444af0b9093a5e628f2fe47ea3b2e # v4.1.7
        continue-on-error: true
        with:
          name: llm_results
          path: .additional_ci_files/llm_results

      - name: Do TD
        id: td
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
          GITHUB_JOB: ${{ github.job }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_REF: ${{ github.ref }}
          JOB_ID: ${{ steps.get-job-id.outputs.job-id }}
          JOB_NAME: ${{ steps.get-job-id.outputs.job-name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          unzip -o .additional_ci_files/llm_results/mappings.zip -d .additional_ci_files/llm_results || true
          # Dependencies are declared inline in the script via PEP 723.
          uv run --no-project --python 3.12 tools/testing/do_target_determination_for_s3.py

      - name: Upload TD results to s3
        uses: seemethere/upload-artifact-s3@baba72d0712b404f646cebe0730933554ebce96a # v5.1.0
        # Skipped on fork PRs (no S3 creds); the GHA-native upload below is the fallback.
        if: steps.td.outcome == 'success' && steps.aws-creds.outcome == 'success'
        with:
          name: td_results
          retention-days: 1
          if-no-files-found: error
          path: td_results.json

      - name: Store TD results on GHA
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.td.outcome == 'success'
        with:
          name: td_results.json
          retention-days: 1
          if-no-files-found: error
          path: td_results.json

  # Shadow LLM test selection (tools/testing/llm_td). The scripts and the prompt
  # come from main; the PR is only read through git, never executed, and fork
  # PRs are skipped. run_test.py reports what the selection would have skipped,
  # and only skips it on PRs labeled ci-llm-td.
  llm-test-selection:
    if: >-
      github.repository_owner == 'pytorch' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    continue-on-error: true
    environment: bedrock
    steps:
      - name: Checkout main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch PR head
        run: git fetch --no-tags origin ${{ github.event.pull_request.head.sha }}

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.280

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: arn:aws:iam::308535385114:role/gha_workflow_claude_code
          aws-region: us-east-1

      - name: Select tests
        env:
          CLAUDE_CODE_USE_BEDROCK: "1"
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ENFORCE: ${{ contains(github.event.pull_request.labels.*.name, 'ci-llm-td') && '--enforce' || '' }}
        run: |
          python3 -m tools.testing.llm_td.select_tests --base origin/main --head "$HEAD_SHA" \
            --output llm_td_selection.json $ENFORCE

      - name: Upload selection to s3
        uses: seemethere/upload-artifact-s3@baba72d0712b404f646cebe0730933554ebce96a # v5.1.0
        with:
          name: llm_td_selection
          retention-days: 1
          if-no-files-found: error
          path: llm_td_selection.json
