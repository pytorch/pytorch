name: Run linters

on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string
        description: The runner to use
      docker-image:
        required: true
        type: string
        description: The Docker image to use
      script:
        required: true
        type: string
        description: The linter script to run

jobs:
  lint:
    runs-on: ${{ inputs.runner }}
    container:
      image: ${{ inputs.docker-image }}
    timeout-minutes: 120
    steps:
      - name: Setup SSH (Click me for login details)
        uses: pytorch/test-infra/.github/actions/setup-ssh@main
        with:
          github-secret: ${{ secrets.GITHUB_TOKEN }}
          instructions: |
            All linting is done inside the container, to start an interactive session run:
              docker exec -it $(docker container ps --format '{{.ID}}') bash

      - name: Setup Linux
        uses: pytorch/pytorch/.github/actions/setup-linux@main
        with:
          use-arc: true

      - name: Prepare lintrunner
        shell: bash
        run: |
          set -eux
          lintrunner init

      - name: Run linter
        shell: bash
        env:
          SCRIPT: ${{ inputs.script }}
        run: |
          {
            echo "#!/usr/bin/env bash";
            echo "set -eou pipefail";
            echo "${SCRIPT}";
          } > "${RUNNER_TEMP}/linter_script"

          # Execute the linter script
          bash "${RUNNER_TEMP}/linter_script"

      - name: Teardown Linux
        uses: pytorch/test-infra/.github/actions/teardown-linux@main
        if: always()
