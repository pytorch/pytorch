# Owner(s): ["module: ci"]
name: trunk

on:
  push:
    branches:
      - main
      - release/*
      - landchecks/*
    tags:
      - ciflow/trunk/*
  workflow_dispatch:
    inputs:
      jobs-to-include:
        description: "Space-separated list of job display names to run (empty = all)"
        required: false
        default: ""
        type: string
      tests-to-include:
        description: "Space-separated tests to include (passed to test runner; empty = default)"
        required: false
        default: ""
        type: string
  schedule:
    - cron: 29 8 * * *  # about 1:29am PDT

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}-${{ github.ref_type == 'branch' && github.sha }}-${{ github.event_name == 'workflow_dispatch' && github.run_id }}-${{ github.event_name == 'schedule' }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read
  actions: read

jobs:
  # See job-filter.yml for rules on adding job filter conditions
  job-filter:
    needs: get-label-type
    if: github.repository_owner == 'pytorch'
    name: job-filter
    uses: ./.github/workflows/job-filter.yml
    with:
      jobs-to-include: ${{ github.event.inputs.jobs-to-include || '' }}

  llm-td:
    if: github.repository_owner == 'pytorch'
    name: before-test
    uses: ./.github/workflows/llm_td_retrieval.yml

  target-determination:
    name: before-test
    uses: ./.github/workflows/target_determination.yml
    needs: llm-td

  get-label-type:
    name: get-label-type
    uses: pytorch/pytorch/.github/workflows/_runner-determinator.yml@main
    if: ${{ (github.event_name != 'schedule' || github.repository == 'pytorch/pytorch') && github.repository_owner == 'pytorch' }}
    with:
      triggering_actor: ${{ github.triggering_actor }}
      issue_owner: ${{ github.event.pull_request.user.login || github.event.issue.user.login }}
      curr_branch: ${{ github.head_ref || github.ref_name }}
      curr_ref_type: ${{ github.ref_type }}
      check_experiments: lf,amd-dpx

  # Build-only Hopper coverage: nothing in CI compiles for sm90 on CUDA 12.x
  # otherwise, so this catches 12.6-specific compile breaks against '9.0'.
  linux-jammy-cuda13_2-py3_11-gcc11-build:
    if: ${{ needs.job-filter.outputs.jobs == '' || contains(needs.job-filter.outputs.jobs, ' linux-jammy-cuda13.2-py3.11-gcc11 ') || contains(needs.job-filter.outputs.jobs, ' cross-compile-linux-test-cuda132 ') }}
    name: linux-jammy-cuda13.2-py3.11-gcc11
    uses: ./.github/workflows/_linux-build.yml
    needs:
      - get-label-type
      - job-filter
    with:
      runner_prefix: "${{ needs.get-label-type.outputs.label-type }}"
      build-environment: linux-jammy-cuda13.2-py3.11-gcc11
      docker-image-name: ci-image:pytorch-linux-jammy-cuda13.2-cudnn9-py3-gcc11
      ci-docker-hash: ${{ needs.get-label-type.outputs.ci-docker-hash }}
      cuda-arch-list: '7.5 8.9'
      test-matrix: |
        { include: [
          { config: "default", shard: 1, num_shards: 14, runner: "${{ needs.get-label-type.outputs.label-type }}linux.g6.4xlarge.experimental.nvidia.gpu" },
          { config: "distributed", shard: 1, num_shards: 10, runner: "${{ needs.get-label-type.outputs.label-type }}linux.g4dn.12xlarge.nvidia.gpu" },
          { config: "pr_time_benchmarks", shard: 1, num_shards: 1, runner: "${{ needs.get-label-type.outputs.label-type }}linux.g4dn.metal.nvidia.gpu" },
        ]}
      python-version: "3.11"
      compiler: gcc11
      cuda-version: "13.2"
    secrets: inherit

  linux-jammy-cuda13_2-py3_11-gcc11-test:
    if: ${{ needs.job-filter.outputs.jobs == '' || contains(needs.job-filter.outputs.jobs, ' linux-jammy-cuda13.2-py3.11-gcc11 ') }}
    name: linux-jammy-cuda13.2-py3.11-gcc11
    uses: ./.github/workflows/_linux-test.yml
    needs:
      - linux-jammy-cuda13_2-py3_11-gcc11-build
      - target-determination
      - job-filter
      - get-label-type
    with:
      timeout-minutes: 360
      build-environment: linux-jammy-cuda13.2-py3.11-gcc11
      docker-image: ${{ needs.linux-jammy-cuda13_2-py3_11-gcc11-build.outputs.docker-image }}
      test-matrix: ${{ needs.linux-jammy-cuda13_2-py3_11-gcc11-build.outputs.test-matrix }}
      tests-to-include: ${{ github.event.inputs.tests-to-include || '' }}
      python-version: "3.11"
      compiler: gcc11
      cuda-version: "13.2"
    secrets: inherit

  # Test cross-compiled models with Windows libs extracted from wheel (CUDA 13.2).
  # Independent of the main cuda13 test job so its other shards don't wait on the
  # Windows build.
  macos-py3-arm64-build:
    if: ${{ github.repository_owner == 'pytorch' && (needs.job-filter.outputs.jobs == '' || contains(needs.job-filter.outputs.jobs, ' macos-py3-arm64 ')) }}
    name: macos-py3-arm64
    uses: ./.github/workflows/_mac-build.yml
    needs: job-filter
    with:
      sync-tag: macos-py3-arm64-build
      build-environment: macos-py3-arm64
      runner-type: macos-m1-stable
      build-generates-artifacts: true
      # To match the one pre-installed in the m1 runners
      python-version: 3.12.7
      test-matrix: |
        { include: [
          { config: "default", shard: 1, num_shards: 3, runner: "macos-m1-stable" },
          { config: "mps", shard: 1, num_shards: 1, runner: "macos-m2-15" },
        ]}
    secrets: inherit

  macos-py3-arm64-test:
    if: ${{ needs.job-filter.outputs.jobs == '' || contains(needs.job-filter.outputs.jobs, ' macos-py3-arm64 ') }}
    name: macos-py3-arm64
    uses: ./.github/workflows/_mac-test.yml
    needs:
      - macos-py3-arm64-build
      - target-determination
      - job-filter
    with:
      build-environment: ${{ needs.macos-py3-arm64-build.outputs.build-environment }}
      # Same as the build job
      python-version: 3.12.7
      test-matrix: ${{ needs.macos-py3-arm64-build.outputs.test-matrix }}
      disable-monitor: false
    secrets: inherit

  # NB: Windows runners are not available in OSDC, so we run this on Meta account
  # for now until we get OSDC deployed to LF account
  win-vs2022-cpu-py3-build:
    if: ${{ needs.job-filter.outputs.jobs == '' || contains(needs.job-filter.outputs.jobs, ' win-vs2022-cpu-py3 ') }}
    name: win-vs2022-cpu-py3
    uses: ./.github/workflows/_win-build.yml
    needs:
      - get-label-type
      - job-filter
    with:
      build-environment: win-vs2022-cpu-py3
      cuda-version: cpu
      runner: windows.4xlarge.nonephemeral
      test-matrix: |
        { include: [
          { config: "default", shard: 1, num_shards: 12, runner: "windows.4xlarge.nonephemeral" },
        ]}
    secrets: inherit

  win-vs2022-cpu-py3-test:
    if: ${{ needs.job-filter.outputs.jobs == '' || contains(needs.job-filter.outputs.jobs, ' win-vs2022-cpu-py3 ') }}
    name: win-vs2022-cpu-py3
    uses: ./.github/workflows/_win-test.yml
    needs:
      - win-vs2022-cpu-py3-build
      - target-determination
      - job-filter
    with:
      build-environment: ${{ needs.win-vs2022-cpu-py3-build.outputs.build-environment }}
      cuda-version: cpu
      test-matrix: ${{ needs.win-vs2022-cpu-py3-build.outputs.test-matrix }}
      disable-monitor: false
    secrets: inherit

  # NB: Windows runners are not available in OSDC, so we run this on Meta account
  # for now until we get OSDC deployed to LF account
  linux-noble-rocm-py3_11-build:
    name: linux-noble-rocm-py3.11-mi350
    uses: ./.github/workflows/_linux-build.yml
    needs:
      - get-label-type
      - job-filter
    with:
      runner_prefix: "mt-"
      build-environment: linux-noble-rocm-py3.11-mi350
      docker-image-name: ci-image:pytorch-linux-noble-rocm-n-py3.11
      ci-docker-hash: ${{ needs.get-label-type.outputs.ci-docker-hash }}
      # TODO (huydhn): Add this back once other workflow migrates
      # sync-tag: rocm-build
      test-matrix: |
        { include: [
          { config: "default", shard: 1, num_shards: 8, runner: "${{ needs.get-label-type.outputs.amd-dpx-label-type }}linux.rocm.gpu.gfx950.1" },
          { config: "distributed", shard: 1, num_shards: 3, runner: "${{ needs.get-label-type.outputs.amd-dpx-label-type }}linux.rocm.gpu.gfx950.2" },
        ]}
      python-version: "3.11"
    secrets: inherit

  linux-noble-rocm-py3_11-test:
    name: linux-noble-rocm-py3.11-mi350
    uses: ./.github/workflows/_rocm-test.yml
    needs:
      - linux-noble-rocm-py3_11-build
      - target-determination
      - job-filter
    with:
      build-environment: ${{ needs.linux-noble-rocm-py3_11-build.outputs.build-environment }}
      docker-image: ${{ needs.linux-noble-rocm-py3_11-build.outputs.docker-image }}
      test-matrix: ${{ needs.linux-noble-rocm-py3_11-build.outputs.test-matrix }}
      # The default config picks these up by discovery; the inductor config in
      # this same job already runs them. Only affects default (see EXCLUDE_CLAUSE
      # in .ci/pytorch/test.sh).
      tests-to-exclude: >-
        inductor/test_torchinductor
        inductor/test_torchinductor_opinfo
        inductor/test_aot_inductor
        inductor/test_cpu_select_algorithm
      tests-to-include: ${{ github.event.inputs.tests-to-include || '' }}
    secrets: inherit

  linux-jammy-aarch64-py3_11-gcc13-build:
    name: linux-jammy-aarch64-py3.11
    uses: ./.github/workflows/_linux-build.yml
    needs: get-label-type
    with:
      runner_prefix: ${{ needs.get-label-type.outputs.label-type }}
      build-environment: linux-jammy-aarch64-py3.11
      docker-image-name: ci-image:pytorch-linux-jammy-aarch64-py3.11-gcc13
      ci-docker-hash: ${{ needs.get-label-type.outputs.ci-docker-hash }}
      runner: linux.arm64.m7g.4xlarge
      # Periodic AArch64 tests for SVE256 coverage
      test-matrix: |
        { include: [
          { config: "default", shard: 1, num_shards: 8, runner: "${{ needs.get-label-type.outputs.label-type }}linux.arm64.m7g.4xlarge" },
        ]}
      python-version: "3.11"
      compiler: gcc13
    secrets: inherit

  linux-jammy-aarch64-py3_11-gcc13-test:
    name: linux-jammy-aarch64-py3.11
    uses: ./.github/workflows/_linux-test.yml
    needs:
      - linux-jammy-aarch64-py3_11-gcc13-build
      - get-label-type
    with:
      build-environment: ${{ needs.linux-jammy-aarch64-py3_11-gcc13-build.outputs.build-environment }}
      docker-image: ${{ needs.linux-jammy-aarch64-py3_11-gcc13-build.outputs.docker-image }}
      test-matrix: ${{ needs.linux-jammy-aarch64-py3_11-gcc13-build.outputs.test-matrix }}
      python-version: "3.11"
      compiler: gcc13
    secrets: inherit
