# Owner(s): ["module: ci"]
name: Index PyTorch Tests for Target Determination

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */2 * * *'

permissions:
  contents: read

jobs:
  get-label-type:
    if: github.repository_owner == 'pytorch'
    name: get-label-type
    uses: pytorch/pytorch/.github/workflows/_runner-determinator.yml@main
    with:
      triggering_actor: ${{ github.triggering_actor }}
      issue_owner: ${{ github.event.pull_request.user.login || github.event.issue.user.login }}
      curr_branch: ${{ github.head_ref || github.ref_name }}
      curr_ref_type: ${{ github.ref_type }}
      check_experiments: "lf"

  build:
    needs: get-label-type
    runs-on: "${{ needs.get-label-type.outputs.label-type }}l-x86iavx512-16-128"
    timeout-minutes: 120
    permissions:
      contents: read
    outputs:
      bundle-sha256: ${{ steps.build.outputs.bundle-sha256 }}
    container:
      image: ghcr.io/actions/actions-runner:latest
    steps:
      - name: Setup Linux
        uses: pytorch/pytorch/.github/actions/setup-linux@main
        with:
          use-arc: true
          submodules: false

      - name: Setup uv
        uses: pytorch/test-infra/.github/actions/setup-uv@main
        with:
          python-version: "3.12"
          activate-environment: true
          enable-cache: true

      - name: Checkout test-infra
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: pytorch/test-infra
          ref: main
          path: test-infra
          persist-credentials: false

      - name: Install requirements
        shell: bash
        run: |
          set -euxo pipefail
          uv pip install -r test-infra/tools/torchci/td/llm/requirements-torch.txt --index-url https://download.pytorch.org/whl/cpu
          uv pip install -r test-infra/tools/torchci/td/llm/requirements.txt
          uv pip install -e test-infra/tools/torchci

      - name: Build index
        id: build
        shell: bash
        working-directory: test-infra/tools/torchci
        env:
          # The runner's default HF_HOME is a read-only shared cache.
          HF_HOME: ${{ runner.temp }}/hf
        run: |
          set -euxo pipefail
          python -P -m torchci.td.llm.index \
            --pytorch "${GITHUB_WORKSPACE}" \
            --out "${RUNNER_TEMP}/td-index/bundle.tar" \
            --threads 16
          sha256=$(sha256sum "${RUNNER_TEMP}/td-index/bundle.tar" | cut -d' ' -f1)
          echo "bundle-sha256=${sha256}" >> "${GITHUB_OUTPUT}"

      - name: Upload bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: td-index-bundle
          retention-days: 1
          if-no-files-found: error
          path: ${{ runner.temp }}/td-index/bundle.tar

  upload:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: target-determinator-env
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: td-indexer-upload
      cancel-in-progress: false
    env:
      BUNDLE_SHA256: ${{ needs.build.outputs.bundle-sha256 }}
    steps:
      - name: Download bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: td-index-bundle
          path: ${{ runner.temp }}/td-index

      - name: Check bundle
        shell: bash
        working-directory: ${{ runner.temp }}/td-index
        run: |
          set -euo pipefail
          if [[ ! "${BUNDLE_SHA256}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "The build job did not report a sha256 for the bundle" >&2
            exit 1
          fi
          echo "${BUNDLE_SHA256}  bundle.tar" | sha256sum -c -

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@ececac1a45f3b08a01d2dd070d28d111c5fe6722 # v4.1.0
        with:
          role-to-assume: arn:aws:iam::308535385114:role/gha_target_determinator_s3_read_write
          aws-region: us-east-1
          role-duration-seconds: 900

      - name: Keep the current bundle as previous
        shell: bash
        run: |
          set -euo pipefail
          bucket=target-determinator-assets
          if latest_sha256=$(aws s3api head-object --bucket "${bucket}" --key indexes/latest/bundle.tar \
              --query 'Metadata."bundle-sha256"' --output text 2>"${RUNNER_TEMP}/head-object.err"); then
            # Only this job sets the metadata, after the build read the bundle back with
            # the retriever's full check; anything else at latest is not kept.
            if [[ "${latest_sha256}" =~ ^[0-9a-f]{64}$ ]]; then
              # Server-side multipart copy: copy-object stops at 5 GB, and bundles of
              # the larger registry models exceed it.
              aws s3 cp "s3://${bucket}/indexes/latest/bundle.tar" "s3://${bucket}/indexes/previous/bundle.tar"
            else
              echo "The current latest bundle has no bundle-sha256 metadata from this workflow: not keeping it as previous"
            fi
          elif grep -qE 'Not Found|404' "${RUNNER_TEMP}/head-object.err"; then
            echo "No current bundle at indexes/latest: nothing to keep"
          else
            cat "${RUNNER_TEMP}/head-object.err" >&2
            exit 1
          fi

      - name: Upload bundle to S3
        shell: bash
        run: |
          set -euo pipefail
          aws s3 cp "${RUNNER_TEMP}/td-index/bundle.tar" s3://target-determinator-assets/indexes/latest/bundle.tar \
            --metadata "bundle-sha256=${BUNDLE_SHA256}" --no-progress

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}-${{ github.event_name == 'workflow_dispatch' }}
  cancel-in-progress: true
