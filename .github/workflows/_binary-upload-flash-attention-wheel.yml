# Owner(s): ["oncall: releng"]
name: Upload Flash Attention 3 wheels

on:
  workflow_dispatch:
    inputs:
      linux_run_id:
        description: 'Run ID from the Linux build workflow (leave empty to skip Linux uploads)'
        required: false
        type: string
      windows_run_id:
        description: 'Run ID from the Windows build workflow (leave empty to skip Windows uploads)'
        required: false
        type: string
      preview_only:
        description: 'Only show what would be uploaded in the run summary: no upload job runs, so no approval is asked'
        required: false
        type: boolean
        default: false

jobs:
  # Runs before the approval gate of the upload jobs: the environment approval screen
  # does not show the workflow inputs or the artifacts, but this job's summary is on
  # the run page while the deployment waits for a reviewer. It only reports. It has no
  # environment, no secrets and no AWS credentials.
  preview:
    name: Show what approval will upload
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    env:
      LINUX_RUN_ID: ${{ inputs.linux_run_id }}
      WINDOWS_RUN_ID: ${{ inputs.windows_run_id }}
    steps:
      - name: Check the run ids
        shell: bash
        run: |
          set -euo pipefail
          for run_id in "${LINUX_RUN_ID}" "${WINDOWS_RUN_ID}"; do
            if [[ -n "${run_id}" && ! "${run_id}" =~ ^[1-9][0-9]{0,17}$ ]]; then
              echo "::error::'${run_id}' is not a run id"
              exit 1
            fi
          done

      - name: Download the Linux artifacts
        if: ${{ inputs.linux_run_id != '' }}
        uses: actions/download-artifact@65a9edc5881444af0b9093a5e628f2fe47ea3b2e # v4.1.7
        with:
          pattern: flash-attn-3-wheel-*
          path: ${{ runner.temp }}/linux
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.linux_run_id }}

      - name: Download the Windows artifacts
        if: ${{ inputs.windows_run_id != '' }}
        uses: actions/download-artifact@65a9edc5881444af0b9093a5e628f2fe47ea3b2e # v4.1.7
        with:
          pattern: flash-attn-3-wheel-*
          path: ${{ runner.temp }}/windows
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.windows_run_id }}

      - name: Show what approval will upload
        shell: bash
        env:
          # read by the `gh api` calls below
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # The folders of the test index each artifact is uploaded to. Keep in sync
          # with the matrices of the upload jobs below.
          folders_of() {
            case "$1" in
              flash-attn-3-wheel-cu126-*|flash-attn-3-wheel-cu128-windows_amd64) echo "cu126 cu128 cu129" ;;
              flash-attn-3-wheel-cu130-*) echo "cu130 cu132 cu134" ;;
              *) echo "" ;;
            esac
          }
          # flash_attn_3-3.0.1-cp310-abi3-manylinux_2_28_x86_64.whl, ...-win_amd64.whl
          wheel_pattern='^flash_attn_3-[0-9][A-Za-z0-9.+!_]*-cp3[0-9]+-abi3-(manylinux_[0-9]+_[0-9]+_(x86_64|aarch64)|win_amd64)\.whl$'

          describe_run() {
            local label="$1" run_id="$2" workflow="$3" dir="$4" run ok
            run=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")
            echo "### ${label} artifacts, run [${run_id}](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${run_id})"
            echo
            echo "| Run | Value |"
            echo "|---|---|"
            jq -r --arg workflow ".github/workflows/${workflow}" '
              "| workflow | `\(.path)`" + (if .path == $workflow then "" else " (expected `" + $workflow + "`)" end) + " |",
              "| event | `\(.event)` |",
              "| branch | `\(.head_branch)` (\(.head_repository.full_name)) |",
              "| commit | [`\(.head_sha[0:10])`](https://github.com/\(.repository.full_name)/commit/\(.head_sha)) |",
              "| result | \(.status) / \(.conclusion // "none") |",
              "| started by | \(.triggering_actor.login), \(.created_at) |"' <<<"${run}"
            echo
            ok=$(jq -r --arg workflow ".github/workflows/${workflow}" --arg repo "${GITHUB_REPOSITORY}" '
              (.path == $workflow and (.event == "workflow_dispatch" or .event == "schedule")
               and .head_branch == "main" and .head_repository.full_name == $repo
               and .status == "completed" and .conclusion == "success")' <<<"${run}")
            if [[ "${ok}" == "true" ]]; then
              echo "> A successful dispatch or scheduled run of \`${workflow}\` on \`main\`."
            else
              echo "> **Warning: this is not a successful dispatch or scheduled run of \`${workflow}\` on \`main\`.**"
            fi
            echo
            echo "| Artifact | File | Size | SHA-256 | Name | Version | Uploaded to (\`s3://pytorch/whl/test/<folder>/\`, public) |"
            echo "|---|---|---|---|---|---|---|"
            local artifact file name version folders warn count=0
            for artifact in "${dir}"/*/; do
              [[ -d "${artifact}" ]] || continue
              artifact=$(basename "${artifact}")
              folders=$(folders_of "${artifact}")
              for file in "${dir}/${artifact}"/*; do
                count=$((count + 1))
                warn=""
                if [[ ! "$(basename "${file}")" =~ ${wheel_pattern} ]]; then
                  warn=" **not a flash_attn_3 wheel**"
                fi
                if [[ -z "${folders}" ]]; then
                  warn="${warn} **unexpected artifact, the upload jobs do not use it**"
                fi
                name=$(unzip -p "${file}" '*.dist-info/METADATA' 2>/dev/null | sed -n 's/^Name: //p' | head -1 || true)
                version=$(unzip -p "${file}" '*.dist-info/METADATA' 2>/dev/null | sed -n 's/^Version: //p' | head -1 || true)
                echo "| \`${artifact}\` | \`$(basename "${file}")\`${warn} | $(stat -c %s "${file}") | \`$(sha256sum "${file}" | cut -d' ' -f1)\` | ${name:-?} | ${version:-?} | ${folders:-none} |"
              done
            done
            if [[ "${count}" -eq 0 ]]; then
              echo "| none | | | | | | |"
            fi
            echo
          }

          {
            echo "## Upload Flash Attention 3 wheels to the test index"
            echo
            echo "| Input | Value |"
            echo "|---|---|"
            echo "| linux_run_id | ${LINUX_RUN_ID:-none} |"
            echo "| windows_run_id | ${WINDOWS_RUN_ID:-none} |"
            echo "| ref | \`${GITHUB_REF_NAME}\` (\`${GITHUB_SHA::7}\`) |"
            echo "| requested by | ${GITHUB_ACTOR} |"
            echo
            echo "> Approving uploads the files below to the test index of download.pytorch.org with public read access."
            echo
            if [[ -z "${LINUX_RUN_ID}" && -z "${WINDOWS_RUN_ID}" ]]; then
              echo "No run id was given, nothing will be uploaded."
            fi
            if [[ -n "${LINUX_RUN_ID}" ]]; then
              describe_run Linux "${LINUX_RUN_ID}" _binary-build-flash-attention-wheel-linux.yml "${RUNNER_TEMP}/linux"
            fi
            if [[ -n "${WINDOWS_RUN_ID}" ]]; then
              describe_run Windows "${WINDOWS_RUN_ID}" _binary-build-flash-attention-wheel-windows.yml "${RUNNER_TEMP}/windows"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
  upload-wheel-linux:
    name: "Upload FA3 ${{ matrix.build_cuda_short }} ${{ matrix.arch }}"
    needs: preview
    if: ${{ inputs.linux_run_id != '' && !inputs.preview_only }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - build_cuda_short: "126"
            upload_subfolders: "cu126 cu128 cu129"
            arch: "x86_64"
          - build_cuda_short: "130"
            upload_subfolders: "cu130 cu132 cu134"
            arch: "x86_64"
          - build_cuda_short: "126"
            upload_subfolders: "cu126 cu128 cu129"
            arch: "aarch64"
          - build_cuda_short: "130"
            upload_subfolders: "cu130 cu132 cu134"
            arch: "aarch64"
    permissions:
      id-token: write
      contents: read
      actions: read
    container:
      image: continuumio/miniconda3:4.12.0
    environment: fa3-wheel-upload
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure AWS credentials(PyTorch account) for test
        uses: aws-actions/configure-aws-credentials@ececac1a45f3b08a01d2dd070d28d111c5fe6722 # v4.1.0
        with:
          role-to-assume: arn:aws:iam::749337293305:role/gha_workflow_test_build_wheels
          aws-region: us-east-1

      - name: Download Build Artifacts
        uses: actions/download-artifact@65a9edc5881444af0b9093a5e628f2fe47ea3b2e # v4.1.7
        with:
          name: flash-attn-3-wheel-cu${{ matrix.build_cuda_short }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/artifacts
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.linux_run_id }}

      - name: Upload binaries to test index
        env:
          PACKAGE_TYPE: wheel
          UPLOAD_CHANNEL: test
          PKG_DIR: ${{ runner.temp }}/artifacts
          DRY_RUN: disabled
        shell: bash
        run: |
          set -ex
          for subfolder in ${{ matrix.upload_subfolders }}; do
            UPLOAD_SUBFOLDER="${subfolder}" bash .ci/pytorch/binary_upload.sh
          done

      # always(): an upload that stops partway is exactly when you want to know which
      # files are already on the test index.
      - name: Summarize uploaded files
        if: always()
        env:
          PKG_DIR: ${{ runner.temp }}/artifacts
          JOB_STATUS: ${{ job.status }}
          SUBFOLDERS: ${{ matrix.upload_subfolders }}
        shell: bash
        run: |
          set -uo pipefail
          {
            echo "### ${GITHUB_JOB}: ${SUBFOLDERS} (${JOB_STATUS})"
            echo
            echo "| File | SHA-256 | Folder | Download |"
            echo "|---|---|---|---|"
            for file in "${PKG_DIR}"/*.whl; do
              [[ -f "${file}" ]] || continue
              for folder in ${SUBFOLDERS}; do
                echo "| \`$(basename "${file}")\` | \`$(sha256sum "${file}" | cut -d' ' -f1)\` | \`${folder}\` | https://download.pytorch.org/whl/test/${folder}/$(basename "${file}") |"
              done
            done
            echo
          } >> "${GITHUB_STEP_SUMMARY}"

  upload-wheel-windows:
    name: "Upload FA3 ${{ matrix.build_cuda_short }} windows_amd64"
    needs: preview
    if: ${{ inputs.windows_run_id != '' && !inputs.preview_only }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - build_cuda_short: "128"
            upload_subfolders: "cu126 cu128 cu129"
    permissions:
      id-token: write
      contents: read
      actions: read
    container:
      image: continuumio/miniconda3:4.12.0
    environment: fa3-wheel-upload
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure AWS credentials(PyTorch account) for test
        uses: aws-actions/configure-aws-credentials@ececac1a45f3b08a01d2dd070d28d111c5fe6722 # v4.1.0
        with:
          role-to-assume: arn:aws:iam::749337293305:role/gha_workflow_test_build_wheels
          aws-region: us-east-1

      - name: Download Build Artifacts
        uses: actions/download-artifact@65a9edc5881444af0b9093a5e628f2fe47ea3b2e # v4.1.7
        with:
          name: flash-attn-3-wheel-cu${{ matrix.build_cuda_short }}-windows_amd64
          path: ${{ runner.temp }}/artifacts
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.windows_run_id }}

      - name: Upload binaries to test index
        env:
          PACKAGE_TYPE: wheel
          UPLOAD_CHANNEL: test
          PKG_DIR: ${{ runner.temp }}/artifacts
          DRY_RUN: disabled
        shell: bash
        run: |
          set -ex
          for subfolder in ${{ matrix.upload_subfolders }}; do
            UPLOAD_SUBFOLDER="${subfolder}" bash .ci/pytorch/binary_upload.sh
          done

      # always(): an upload that stops partway is exactly when you want to know which
      # files are already on the test index.
      - name: Summarize uploaded files
        if: always()
        env:
          PKG_DIR: ${{ runner.temp }}/artifacts
          JOB_STATUS: ${{ job.status }}
          SUBFOLDERS: ${{ matrix.upload_subfolders }}
        shell: bash
        run: |
          set -uo pipefail
          {
            echo "### ${GITHUB_JOB}: ${SUBFOLDERS} (${JOB_STATUS})"
            echo
            echo "| File | SHA-256 | Folder | Download |"
            echo "|---|---|---|---|"
            for file in "${PKG_DIR}"/*.whl; do
              [[ -f "${file}" ]] || continue
              for folder in ${SUBFOLDERS}; do
                echo "| \`$(basename "${file}")\` | \`$(sha256sum "${file}" | cut -d' ' -f1)\` | \`${folder}\` | https://download.pytorch.org/whl/test/${folder}/$(basename "${file}") |"
              done
            done
            echo
          } >> "${GITHUB_STEP_SUMMARY}"
