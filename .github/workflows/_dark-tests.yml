name: dark-tests

# Reports tests that exist but were never observed running on any trunk runner.
#
# Needs a torch build to enumerate what tests exist (the introspection engine
# imports each file) and ClickHouse to read what actually ran, so it reuses a
# caller-supplied build artifact rather than adding one.

on:
  workflow_call:
    inputs:
      build-environment:
        required: true
        type: string
        description: Build artifact / environment to reuse.
      docker-image:
        required: true
        type: string
        description: Docker image to run in (the build's image).
      days:
        required: false
        type: number
        default: 7
        description: Trunk window, in days, that counts as "observed running".
      runner_prefix:
        required: false
        type: string
        default: ""
      runner:
        required: false
        type: string
        default: "l-x86iavx512-8-64"
      s3-bucket:
        required: false
        type: string
        default: "gha-artifacts"
    secrets:
      CLICKHOUSE_ENDPOINT:
        required: true
      CLICKHOUSE_READONLY_USERNAME:
        required: true
      CLICKHOUSE_READONLY_PASSWORD:
        required: true

jobs:
  dark-tests:
    if: github.repository_owner == 'pytorch'
    # The ClickHouse credentials are scoped to this environment; without it the
    # secrets resolve to empty strings and the query fails to authenticate.
    environment: rockset-read-only
    runs-on: ${{ inputs.runner_prefix }}${{ inputs.runner }}
    container:
      image: ${{ inputs.docker-image }}
    timeout-minutes: 120
    permissions:
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Setup Linux
        uses: pytorch/pytorch/.github/actions/setup-linux@main
        with:
          use-arc: true
          checkout-mode: normal
          submodules: 'false'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure AWS credentials
        id: aws-creds
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7
        with:
          role-to-assume: arn:aws:iam::308535385114:role/arc
          aws-region: us-east-1
          role-duration-seconds: 18000

      - name: Download build artifacts
        uses: pytorch/pytorch/.github/actions/download-build-artifacts@main
        with:
          name: ${{ inputs.build-environment }}
          s3-bucket: ${{ inputs.s3-bucket }}
          use-gha: ${{ steps.aws-creds.outcome != 'success' }}

      - name: Report dark tests
        shell: bash
        env:
          CLICKHOUSE_ENDPOINT: ${{ secrets.CLICKHOUSE_ENDPOINT }}
          CLICKHOUSE_USERNAME: ${{ secrets.CLICKHOUSE_READONLY_USERNAME }}
          CLICKHOUSE_PASSWORD: ${{ secrets.CLICKHOUSE_READONLY_PASSWORD }}
          TESTINTRO_CACHE: ${{ runner.temp }}/testintro-cache
        run: |
          set -ex
          shopt -s nullglob
          wheels=(dist/*.whl)
          if [ ${#wheels[@]} -eq 0 ]; then
            echo "::error::no build artifact in $(pwd)/dist; dark-tests measured nothing"
            ls -la . dist 2>&1 || true
            exit 1
          fi
          pip install "${wheels[0]}[opt-einsum]" clickhouse-connect==0.8.14
          # One pass: human-readable to the log, JSON to the artifact. Enumerating
          # the tree twice would double a ~10 minute job.
          python tools/testing/dark_tests.py --days "${{ inputs.days }}" \
            --out dark-tests.json

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dark-tests
          path: dark-tests.json
          if-no-files-found: warn
