# Owner(s): ["oncall: distributed", "module: symm_mem"]
name: Limited CI for distributed tests on GB300

on:
  pull_request:
    paths:
      - .github/workflows/gb300-distributed.yml
  workflow_dispatch:
  push:
    tags:
      - ciflow/gb300-distributed/*
  schedule:
    - cron: 46 8 * * *  # about 1:46am PDT

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}-${{ github.event_name == 'workflow_dispatch' }}-${{ github.event_name == 'schedule' }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read
  actions: read

jobs:

  get-label-type:
    if: github.repository_owner == 'pytorch'
    name: get-label-type
    uses: pytorch/pytorch/.github/workflows/_runner-determinator.yml@main
    with:
      triggering_actor: ${{ github.triggering_actor }}
      issue_owner: ${{ github.event.pull_request.user.login || github.event.issue.user.login }}
      curr_branch: ${{ github.head_ref || github.ref_name }}
      curr_ref_type: ${{ github.ref_type }}
      check_experiments: lf

  linux-jammy-aarch64-cuda13_4-py3_12-gcc13-build-dist:
    name: linux-jammy-aarch64-cuda13.4-py3.12-gcc13-sm100-dist
    uses: ./.github/workflows/_linux-build.yml
    needs: get-label-type
    with:
      runner_prefix: "${{ needs.get-label-type.outputs.label-type }}"
      runner: l-arm64g4-16-62
      build-environment: linux-jammy-aarch64-cuda13.4-py3.12-gcc13
      docker-image-name: ci-image:pytorch-linux-jammy-aarch64-cuda13.4-cudnn9-py3.12-gcc13
      ci-docker-hash: ${{ needs.get-label-type.outputs.ci-docker-hash }}
      cuda-arch-list: '10.0'
      test-matrix: |
        { include: [
          { config: "h100_distributed", shard: 1, num_shards: 1, runner: "nv-l-arm64grace-16-850-gb300-4" },
          { config: "h100-symm-mem", shard: 1, num_shards: 1, runner: "nv-l-arm64grace-16-850-gb300-4" },
          { config: "h100-fabric", shard: 1, num_shards: 1, runner: "nv-l-arm64grace-16-850-gb300-4" },
        ]}
      python-version: "3.12"
      compiler: gcc13
      cuda-version: "13.4"
    secrets: inherit

  linux-jammy-aarch64-cuda13_4-py3_12-gcc13-test-dist:
    name: linux-jammy-aarch64-cuda13.4-py3.12-gcc13-sm100-dist
    uses: ./.github/workflows/_linux-test.yml
    needs:
      - linux-jammy-aarch64-cuda13_4-py3_12-gcc13-build-dist
      - get-label-type
    with:
      build-environment: ${{ needs.linux-jammy-aarch64-cuda13_4-py3_12-gcc13-build-dist.outputs.build-environment }}
      docker-image: ghcr.io/pytorch/ci-image:pytorch-linux-jammy-aarch64-cuda13.4-cudnn9-py3.12-gcc13-${{ needs.get-label-type.outputs.ci-docker-hash }}
      test-matrix: ${{ needs.linux-jammy-aarch64-cuda13_4-py3_12-gcc13-build-dist.outputs.test-matrix }}
      python-version: "3.12"
      compiler: gcc13
      cuda-version: "13.4"
    secrets: inherit
