[package]
name = "torch_cfg_rs"
version = "0.1.0"
edition = "2021"
publish = false
description = "CFG/SSA compiler and VM behind torch.rewrite"

[lib]
name = "_cfg_rs"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.30", features = ["extension-module"] }

[build-dependencies]
pyo3-build-config = "0.30"

[profile.release]
opt-level = 3
debug = 1
panic = "unwind"
