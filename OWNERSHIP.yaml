# Source of truth for CODEOWNERS. After editing, regenerate CODEOWNERS with
#   python scripts/codeowners/generate_codeowners.py
# or `lintrunner -a`; the CODEOWNERS_GENERATED lint fails until they match.
#
# Each entry under `ownership` is a label group: a `name`, its labels, its owners,
# and every path it owns, listed once. The name is a stable identifier that
# doesn't change when a label is renamed; it is the group's most specific label
# followed by its other labels, or the CODEOWNERS section name for paths without
# labels. Ownership status is `owners` alone; `[]` means no owner recorded yet.
# Handles are written without the leading @. A path with handles is an active
# CODEOWNERS rule (those handles get review requests); a bare path is a
# commented rule. `section` is the CODEOWNERS section the group's paths are
# written under; it is kept temporarily for scripts/codeowners/owners.py.

